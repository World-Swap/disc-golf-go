<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Vault · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w15" />
  <style>
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title">Vault</span>
      <span class="pill" id="xp">— XP</span>
    </header>
    <div class="screen stack">
      <div><h1 class="h-display">VAULT<span class="mark" style="width:38%"></span></h1></div>
      <!-- The channel feed used to be a third tab here. It is not the vault's
           kind of thing -- the vault holds the lesson videos you have
           unlocked, the lounge is whatever the channels posted this week --
           so it has its own page. This sits ABOVE the tabs deliberately: put
           below them it is pushed off the bottom by whichever tab is open,
           and it is the same card on both, so repeating it per tab is worse. -->
      <a class="artcard" href="/lounge" style="--art:url('/img/cards/lounge.webp')">
        <span class="artcard__art"></span><span class="artcard__scrim"></span>
        <span class="artcard__body">
          <span class="artcard__eyebrow">Players Lounge</span>
          <span class="artcard__title">New videos →</span>
          <span class="artcard__sub" id="loungeSub">Rounds, reviews and coaching from 27 channels</span>
        </span>
      </a>
      <div class="segbar" id="tabs">
        <button class="seg" data-tab="library" aria-selected="true">My Library</button>
        <button class="seg" data-tab="bonus">Creators</button>
      </div>
      <div id="view" class="loading">Loading…</div>
    </div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('vault');
      var esc = DGG.esc, API = DGG.API;
      var view = document.getElementById('view');

      // Header shows the player's XP total.
      API.get('/players/me').then(function (p) {
        document.getElementById('xp').textContent = (p.xp != null ? p.xp : 0).toLocaleString() + ' XP';
      }).catch(function () {});

      document.getElementById('tabs').addEventListener('click', function (e) {
        var b = e.target.closest('.seg'); if (!b) return;
        [].forEach.call(this.children, function (c) { c.setAttribute('aria-selected', c === b ? 'true' : 'false'); });
        b.getAttribute('data-tab') === 'bonus' ? loadBonus() : loadLibrary();
      });

      function loading() { view.className = 'loading'; view.textContent = 'Loading…'; }
      function fail(e) { view.className = 'screen'; view.innerHTML = '<div class="error">' + esc(e.message || 'Error') + '</div>'; }

      async function loadLibrary() {
        loading();
        try {
          var d = await API.get('/vault/library');
          var cats = (d.categories || []);
          if (!cats.length) { view.className = ''; view.innerHTML = '<div class="loading">Complete lessons to unlock videos &amp; resources in your library.</div>'; return; }
          view.className = 'stack';
          view.innerHTML = cats.map(function (c) {
            var lessons = (c.lessons || []).map(function (l) {
              return '<a class="row" href="' + esc(l.youtube_url || '#') + '" target="_blank" rel="noopener">' +
                '<span class="row__glyph">▷</span><div class="row__body"><div class="row__title">' + esc(l.youtube_title || l.title) + '</div>' +
                (l.youtube_channel ? '<div class="row__sub">' + esc(l.youtube_channel) + '</div>' : '') + '</div><span class="row__meta">Watch</span></a>';
            }).join('');
            return '<div><p class="section-label">' + esc(c.icon || '') + ' ' + esc(c.name) + '</p><div class="rows">' + lessons + '</div></div>';
          }).join('');
        } catch (e) { fail(e); }
      }

      async function loadBonus() {
        loading();
        try {
          var d = await API.get('/vault/bonus');
          var chans = (d.channels || []);
          if (!chans.length) { view.className = ''; view.innerHTML = '<div class="loading">No creator videos yet.</div>'; return; }
          var t = d.totals || {};
          view.className = 'stack';
          view.innerHTML =
            '<p class="row__sub" style="text-transform:none;letter-spacing:0;margin-bottom:2px">' +
              (t.unlocked || 0) + ' of ' + (t.videos || 0) + ' videos unlocked · ' + (t.channels || 0) + ' creators. ' +
              'Complete a lesson to unlock its video here.</p>' +
            chans.map(function (c) {
              var vids = (c.videos || []).map(function (v) {
                var note = 'From: ' + esc(v.lesson_title) + ' · ' + esc(v.category);
                if (v.completed && v.youtube_url) {
                  return '<a class="row" href="' + esc(v.youtube_url) + '" target="_blank" rel="noopener">' +
                    '<span class="row__glyph">▷</span><div class="row__body"><div class="row__title">' + esc(v.youtube_title) + '</div>' +
                    '<div class="row__sub" style="text-transform:none;letter-spacing:0">' + note + '</div></div>' +
                    '<span class="row__meta">Watch</span></a>';
                }
                return '<a class="row" href="/training?lesson=' + v.lesson_id + '" style="opacity:.6">' +
                  '<span class="row__glyph">🔒</span><div class="row__body"><div class="row__title">' + esc(v.youtube_title) + '</div>' +
                  '<div class="row__sub" style="text-transform:none;letter-spacing:0">Complete “' + esc(v.lesson_title) + '” to unlock</div></div>' +
                  '<span class="row__meta">›</span></a>';
              }).join('');
              return '<div><p class="section-label">' + esc(c.channel) + ' · ' + (c.unlocked || 0) + '/' + (c.video_count || 0) + '</p><div class="rows">' + vids + '</div></div>';
            }).join('');
        } catch (e) { fail(e); }
      }


      DGG.loungeSub();

      loadLibrary();
    })();
  </script>
</body>
</html>
