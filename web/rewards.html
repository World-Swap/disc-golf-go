<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, follow" />
  <title>Rewards · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w15" />
  <style>
    .back { display:inline-flex; align-items:center; gap:6px; font-size:13px;
            color:var(--color-ash,#6d655c); text-decoration:none; }
    .purse { background:#16130f; color:#f7f4ef; border-radius:4px; padding:16px 18px; }
    .purse__l { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#fc6414; font-weight:700; }
    .purse__n { font-family:var(--font-display,system-ui); font-weight:800; font-size:30px; margin:4px 0 2px; }
    .purse__sub { font-size:12px; color:rgba(247,244,239,.66); line-height:1.45; }
    .offer { border:1px solid var(--hair,#e4dfd6); border-radius:4px; background:#fff; padding:14px; }
    .offer + .offer { margin-top:10px; }
    .offer__top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
    .offer__t { font-weight:700; font-size:15px; line-height:1.3; }
    .offer__c { font-weight:800; font-size:14px; white-space:nowrap; color:#2e7d57; }
    .offer__c[data-short="1"] { color:#b5aca1; }
    .offer__terms { font-size:12.5px; line-height:1.5; color:var(--color-ash,#6d655c); margin:8px 0 12px; }
    /* A coupon is a thing you hold, so it is drawn as one — and it has to
       survive being printed in black and white and shown at a desk. */
    .cpn { border:2px dashed #fc6414; border-radius:10px; background:#fff; padding:16px; text-align:center; }
    .cpn + .cpn, .offer + .cpn, .cpn + .offer { margin-top:10px; }
    .cpn[data-dead="1"] { border-color:#d8d2c8; opacity:.72; }
    .cpn__t { font-weight:700; font-size:14px; }
    .cpn__code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:800;
                 font-size:21px; letter-spacing:.04em; margin:10px 0 6px; word-break:break-all; }
    .cpn__meta { font-size:11.5px; color:var(--color-ash,#6d655c); line-height:1.5; }
    .cpn__terms { font-size:11.5px; color:var(--color-ash,#6d655c); line-height:1.5; margin-top:8px; }
    .cpn__badge { display:inline-block; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
                  font-weight:700; padding:3px 8px; border-radius:999px; margin-top:8px; }
    .cpn__badge[data-s="issued"]   { background:#e8f3ec; color:#2e7d57; }
    .cpn__badge[data-s="redeemed"] { background:#eee9e1; color:#8a8279; }
    .cpn__badge[data-s="expired"]  { background:#f6e4e4; color:#a44; }
    .note { font-size:12px; line-height:1.55; color:var(--color-ash,#6d655c); }
    @media print {
      /* Printing is a stated use: show the coupon at an event for a discount.
         Everything that is not the coupon gets out of the way. */
      .topbar, #tabbar, .back, #offers, .no-print, .section-label { display:none !important; }
      .cpn { break-inside:avoid; page-break-inside:avoid; border-color:#000; }
      body { background:#fff; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><span class="topbar__title">Rewards</span><span class="pill" id="goldpill">—</span></header>
    <div class="screen stack">
      <div>
        <a class="back" href="/profile">← Profile</a>
        <p class="section-label">Earn gold, take it out</p>
        <h1 class="h-display">REWARDS<span class="mark" style="width:30%"></span></h1>
      </div>
      <div id="content" class="loading">Loading…</div>
    </div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('profile');
      var content = document.getElementById('content');
      var goldPill = document.getElementById('goldpill');
      var esc = DGG.esc, API = DGG.API;
      function day(d) {
        try { return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }
        catch (e) { return String(d).slice(0, 10); }
      }

      var state = { gold: 0, cat: null, mine: [] };
      var justIssued = null;

      function render() {
        var html = '';
        html += '<div class="purse"><p class="purse__l">Your gold</p>' +
                '<p class="purse__n">' + state.gold.toLocaleString() + '</p>' +
                '<p class="purse__sub">Earned by levelling up, finishing lessons and playing. ' +
                'Spend it on a coupon below.</p></div>';

        if (!state.cat || !state.cat.enabled) {
          html += '<p class="note">Coupons are not open yet. Keep earning — your gold is safe and ' +
                  'will still be here.</p>';
          content.className = 'screen stack';
          content.innerHTML = html;
          return;
        }

        var live = state.mine.filter(function (c) { return c.status === 'issued'; });
        if (justIssued) {
          live.sort(function (a, b) { return (b.code === justIssued) - (a.code === justIssued); });
        }
        if (live.length) {
          html += '<div><p class="section-label">Your coupons</p>' +
            (justIssued ? '<p class="note no-print" style="margin:0 0 10px">Sent to your email — ' +
              'you can also print this page or show it at an event.</p>' : '') +
            live.map(coupon).join('') + '</div>';
        }

        html += '<div id="offers"><p class="section-label">Redeem gold</p>' +
                state.cat.coupons.map(offer).join('') +
                '<p class="note" style="margin-top:12px">Codes last ' + state.cat.valid_months +
                ' months and can be used once. You can redeem ' + state.cat.max_per_window + ' ' +
                (state.cat.max_per_window === 1 ? 'coupon' : 'coupons') + ' every ' +
                state.cat.window_days + ' days' +
                (state.cat.max_per_visit > 1
                  ? ', and use up to ' + state.cat.max_per_visit +
                    ' of the same kind together on one purchase'
                  : '') +
                '.</p></div>';

        var spent = state.mine.filter(function (c) { return c.status !== 'issued'; });
        if (spent.length) {
          html += '<div class="no-print"><p class="section-label">Used &amp; expired</p>' + spent.map(coupon).join('') + '</div>';
        }

        content.className = 'screen stack';
        content.innerHTML = html;
        wire();
      }

      function offer(c) {
        var short = state.gold < c.gold_cost;
        return '<div class="offer">' +
          '<div class="offer__top"><div class="offer__t">' + esc(c.title) + '</div>' +
          '<div class="offer__c" data-short="' + (short ? 1 : 0) + '">' + c.gold_cost.toLocaleString() + ' gold</div></div>' +
          '<p class="offer__terms">' + esc(c.terms) + '</p>' +
          '<button class="btn btn--block" data-key="' + esc(c.key) + '"' + (short ? ' disabled' : '') + '>' +
          (short ? (c.gold_cost - state.gold).toLocaleString() + ' more gold needed' : 'Redeem') + '</button>' +
          '</div>';
      }

      function coupon(c) {
        var dead = c.status !== 'issued';
        return '<div class="cpn" data-dead="' + (dead ? 1 : 0) + '">' +
          '<div class="cpn__t">' + esc(c.title) + '</div>' +
          '<div class="cpn__code">' + esc(c.code) + '</div>' +
          '<div class="cpn__meta">' +
            (c.status === 'issued' ? 'Valid until ' + esc(day(c.expires_at))
             : c.status === 'redeemed' ? 'Used ' + esc(day(c.redeemed_at))
             : 'Expired ' + esc(day(c.expires_at))) + '</div>' +
          '<div class="cpn__terms">' + esc(c.terms) + '</div>' +
          '<span class="cpn__badge" data-s="' + esc(c.status) + '">' + esc(c.status) + '</span>' +
          '</div>';
      }

      function wire() {
        var btns = content.querySelectorAll('button[data-key]');
        Array.prototype.forEach.call(btns, function (b) {
          b.addEventListener('click', function () {
            var key = b.getAttribute('data-key');
            var c = state.cat.coupons.filter(function (x) { return x.key === key; })[0];
            if (!c) return;
            // Spending gold is not undoable, and the coupon expires whether or
            // not it gets used, so the confirm states both plainly.
            if (!window.confirm(
              'Redeem ' + c.gold_cost + ' gold for "' + c.title + '"?\n\n' +
              'This cannot be undone, and the code expires in ' + state.cat.valid_months + ' months.'
            )) return;
            b.disabled = true; b.textContent = 'Redeeming…';
            API.post('/rewards/redeem', { type_key: key }).then(function (r) {
              // The code the player just bought is the only thing that matters
              // now, so it is rendered first and scrolled to, with a line saying
              // the email is on its way. (There is no DGG.toast in this app --
              // the confirmation has to be on the page.)
              justIssued = r && r.coupon ? r.coupon.code : null;
              return load().then(function () {
                var el = content.querySelector('.cpn');
                if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
              });
            }).catch(function (e) {
              b.disabled = false; b.textContent = 'Redeem';
              var msg = (e && e.data && e.data.error) || (e && e.message) || 'Could not redeem that.';
              var p = document.createElement('p');
              p.className = 'note'; p.style.marginTop = '8px'; p.textContent = msg;
              b.parentNode.appendChild(p);
            });
          });
        });
      }

      function load() {
        return Promise.all([
          API.get('/players/me'),
          API.get('/rewards/catalogue'),
          API.get('/rewards/mine')['catch'](function () { return { coupons: [] }; }),
        ]).then(function (res) {
          state.gold = Number((res[0] && res[0].gold) || 0);
          state.cat = res[1];
          state.mine = (res[2] && res[2].coupons) || [];
          goldPill.textContent = state.gold.toLocaleString() + ' gold';
          render();
        });
      }

      load().catch(function (e) {
        content.className = 'screen';
        content.innerHTML = '<div class="error">' + esc((e && e.message) || 'Could not load rewards.') + '</div>';
      });
    })();
  </script>
</body>
</html>
