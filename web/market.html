<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, follow" />
  <title>Market · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w17" />
  <style>
    /* The Market is the only page in the app that shows a grid of goods, so
       its CSS lives here rather than in app-ui.css, which is shared behind a
       ?v= buster across every page. Nothing below is used anywhere else. */

    /* ── Search ─────────────────────────────────────────────────────── */
    .msearch { display: flex; gap: 8px; }
    .msearch__in {
      flex: 1; min-width: 0; font: inherit; font-size: 16px; /* 16px: anything
         smaller makes iOS Safari zoom the page on focus */
      padding: 12px 14px; border: 1px solid var(--hair); border-radius: 11px;
      background: #fff; color: var(--color-ink);
    }
    .msearch__in:focus { outline: 2px solid var(--color-orange); outline-offset: -1px; }
    .msearch__go {
      flex: none; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
      padding: 0 18px; border: 0; border-radius: 11px;
      background: var(--color-orange); color: #fff;
    }
    .msearch__go:disabled { opacity: .5; cursor: default; }

    /* ── Departments ────────────────────────────────────────────────── */
    .depts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 560px) { .depts { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 860px) { .depts { grid-template-columns: repeat(5, 1fr); } }
    .dept {
      display: flex; flex-direction: column; gap: 3px; text-align: left;
      padding: 12px 12px 13px; border: 1px solid var(--hair); border-radius: 12px;
      background: #fff; font: inherit; color: inherit; cursor: pointer;
    }
    .dept:hover { border-color: var(--color-orange); }
    /* A drawing rather than a character: see DEPT_ICON below for why. It
       inherits currentColor, so a department tile needs no palette of its own. */
    .dept__glyph { line-height: 0; }
    .dept__glyph svg { display: block; width: 20px; height: 20px; }
    .dept__label { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
    /* The reason a department exists is the useful half, so it wraps rather
       than ellipsing -- but it is clamped so one long line cannot make a
       single tile taller than the row beside it. */
    .dept__why {
      font-size: 11.5px; line-height: 1.35; color: var(--color-ash);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ── Product grid ───────────────────────────────────────────────── */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 860px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .card {
      display: flex; flex-direction: column; text-decoration: none; color: inherit;
      border: 1px solid var(--hair); border-radius: 12px; background: #fff; overflow: hidden;
    }
    .card:hover { border-color: var(--color-orange); }
    /* A fixed square: the shops' images are every ratio there is, and without
       this the grid rows step raggedly as each one loads. */
    .card__shot {
      position: relative; aspect-ratio: 1 / 1; background: var(--color-peach);
      display: flex; align-items: center; justify-content: center;
    }
    .card__shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .card__none { font-size: 22px; opacity: .25; }
    .card__flag {
      position: absolute; top: 7px; left: 7px;
      font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      padding: 3px 6px; border-radius: 5px; background: var(--color-ink); color: #fff;
    }
    .card__flag--out { background: var(--color-ash); }
    .card__flag--sale { background: var(--color-orange); }
    .card__body { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px 11px; flex: 1; }
    /* .card__body is a flex ITEM where these spans sit; flex blockifies its
       children, not its grandchildren, so without this they run together --
       the trap already shipped in .lprev__*, .uprow__* and .stat span. */
    .card__title, .card__price, .card__shop, .card__was { display: block; }
    .card__title {
      font-size: 12.5px; font-weight: 600; line-height: 1.3; color: var(--color-ink);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      /* min-height of two lines, so a one-line title does not make its card
         shorter than the one beside it and step the row. */
      min-height: 2.6em;
    }
    .card__price { margin-top: 4px; font-size: 14.5px; font-weight: 700; color: var(--color-ink); }
    .card__was { font-size: 11px; color: var(--color-ash); text-decoration: line-through; }
    .card__shop {
      margin-top: auto; padding-top: 5px; font-size: 10.5px; color: var(--color-ash);
      display: flex; align-items: center; gap: 4px; min-width: 0;
    }
    /* The name is what truncates. `min-width: 0` is required for a flex item
       to be allowed to shrink below its content width at all, without which
       the ellipsis never engages and the badge is pushed out of the card. */
    .card__shopname { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* `flex: none` is the whole point: our own listing stays labelled however
       long the shop name is. */
    .card__ours {
      flex: none; font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; padding: 1px 5px; border-radius: 999px;
      background: var(--color-orange); color: #fff;
    }

    /* ── Our own store, as a row in Browse ──────────────────────────── */
    .srow {
      display: flex; align-items: center; gap: 10px; padding: 13px 14px;
      background: var(--color-card, #fff); border: 1px solid var(--color-line, #e7e2da);
      border-radius: 14px; text-decoration: none; color: inherit;
    }
    .srow__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    /* .srow__body is a flex ITEM, not a container, and flex blockifies its
       children but not its grandchildren -- this exact trap has shipped in
       .lprev__*, .uprow__*, .nrow__* and the admin .stat span. */
    .srow__title, .srow__sub { display: block; }
    .srow__title { font-weight: 700; font-size: 15px; }
    .srow__sub { font-size: 12px; color: var(--color-ash); }

    /* ── Filter row ─────────────────────────────────────────────────── */
    .filters { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; font: inherit; font-size: 12px; cursor: pointer;
      padding: 6px 11px; border: 1px solid var(--hair); border-radius: 999px;
      background: #fff; color: var(--color-ash); white-space: nowrap;
    }
    .chip[aria-pressed="true"] { background: var(--color-ink); border-color: var(--color-ink); color: #fff; }

    /* ── Status lines ───────────────────────────────────────────────── */
    .mnote { font-size: 11.5px; line-height: 1.5; color: var(--color-ash); }
    .mdown {
      font-size: 11.5px; line-height: 1.5; color: var(--color-ash);
      padding: 9px 11px; border: 1px solid var(--hair); border-radius: 9px; background: var(--color-peach);
    }
    .mhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .mhead__n { font-size: 11.5px; color: var(--color-ash); flex: none; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title">Market</span>
      <span class="pill" id="reach">—</span>
    </header>
    <div class="screen stack">
      <div>
        <p class="section-label">Every shop at once</p>
        <h1 class="h-display">MARKET<span class="mark" style="width:38%"></span></h1>
        <!-- True in BOTH states, deliberately: most shops really do show only
             their own stock, and that stays true of us whether or not we
             stock any. Copy that need not change when the store opens cannot
             go stale when the store opens. setLede() still swaps it for the
             ordering declaration once a storefront is configured, because a
             results page shows this line and no other. -->
        <p class="mnote" id="lede">
          Search anything disc golf and see what it costs. Most shops show you their
          own stock — this shows you everyone's.
        </p>
      </div>

      <form class="msearch" id="form" autocomplete="off">
        <input class="msearch__in" id="q" type="search" name="q" maxlength="80"
               placeholder="Search discs, bags, baskets…" aria-label="Search the market" />
        <button class="msearch__go" id="go" type="submit">Search</button>
      </form>

      <div id="view" class="loading">Loading…</div>
    </div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w15"></script>
  <script>
    (function () {
      DGG.tabbar('market');
      var esc = DGG.esc, API = DGG.API;
      var view = document.getElementById('view');
      var form = document.getElementById('form');
      var qIn = document.getElementById('q');
      var go = document.getElementById('go');

      // What the page is currently showing. `retailer` is a filter applied by
      // re-asking the server rather than by hiding cards: a filter that only
      // hides what was already fetched would show "4 shops" while quietly
      // having searched eleven.
      // No shop list. The Market is a search: you type what you want and each
      // result names the retailer selling it. A filter row of shops is exactly
      // the "browse our shops" shape this is not.
      var state = { departments: [], last: null, mode: 'browse', web: false, affiliate: false };

      function money(n, ccy) {
        if (n === null || n === undefined) return '';
        try {
          return new Intl.NumberFormat(undefined, { style: 'currency', currency: ccy || 'USD' }).format(n);
        } catch (e) {
          // An unknown currency code must still print a price with its code
          // attached, never a bare number that reads as dollars.
          return (ccy ? ccy + ' ' : '') + n.toFixed(2);
        }
      }

      function card(p) {
        // available is a TRISTATE: true, false, or null when the source does
        // not say. Only `false` is "Sold out" -- treating null as sold out
        // would mark every web-search result out of stock, since Google
        // Shopping does not report stock at all.
        var flag = p.available === false
          ? '<span class="card__flag card__flag--out">Sold out</span>'
          : '';
        var shot = p.image
          ? '<img src="' + esc(p.image) + '" alt="" loading="lazy" />'
          : '<span class="card__none" aria-hidden="true">\u{1F94F}</span>';
        return '<a class="card" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">' +
          '<span class="card__shot">' + shot + flag + '</span>' +
          '<span class="card__body">' +
            '<span class="card__title">' + esc(p.title) + '</span>' +
            '<span class="card__price">' + esc(money(p.price, p.currency)) + '</span>' +
            // Sold by us. A player comparing prices is entitled to know that
            // one of the sellers is the app showing them the comparison, and
            // `ours` is set server-side from the url's host, so a retailer
            // cannot claim it and we cannot quietly drop it.
            //
            // The badge is a SIBLING of the shop name rather than inside it:
            // .card__shopname truncates with an ellipsis, so a nested badge
            // would disappear on any long retailer name -- a disclosure that
            // silently vanishes on some rows is worse than none, because it
            // reads as "this one is not ours".
            '<span class="card__shop">' +
              '<span class="card__shopname">' + esc(p.retailer) + '</span>' +
              (p.ours ? '<span class="card__ours">Ours</span>' : '') +
            '</span>' +
          '</span>' +
        '</a>';
      }

      // Shops that did not answer are NAMED. A marketplace quietly showing
      // nine of eleven looks complete and is not.
      function downNote(sources) {
        var down = (sources || []).filter(function (s) { return !s.ok; });
        if (!down.length) return '';
        return '<p class="mdown">Could not reach ' + down.map(function (d) {
          return esc(d.label) + (d.error ? ' (' + esc(d.error) + ')' : '');
        }).join(', ') + '. Everything else is live.</p>';
      }

      // Said plainly when no search key is configured: the reach is a set of
      // storefronts, not the web, and the page must not imply otherwise.
      function reachNote(d) {
        if (!d.fallbackOnly) return '';
        return '<p class="mdown">Searching disc golf storefronts directly. ' +
          'Web search is not switched on, so this reaches fewer shops than it could.</p>';
      }

      function resultHead(d) {
        var n = d.products.length;
        // "from $4.00" would imply $4.00 is the floor of everything shown, and
        // it is not when the set holds more than one currency -- the server
        // reports the minimum WITHIN one currency and never converts. So when
        // the set is mixed, name the currency the figure belongs to. Same rule
        // as naming a retailer we could not reach: do not look complete when
        // you are not.
        var cheap = d.cheapest !== null && d.cheapest !== undefined
          ? ' · from ' + money(d.cheapest, d.currency) + (d.mixedCurrency ? ' in ' + d.currency : '')
          : '';
        // Count the RETAILERS in the results, not the sources we asked --
        // "12 shops" means twelve shops sell this, which is the useful fact.
        var shops = {};
        (d.products || []).forEach(function (p) { shops[p.retailer] = 1; });
        var ns = Object.keys(shops).length;
        return '<div class="mhead">' +
            '<p class="section-label" style="margin:0">' + esc(d.department ? d.department.label : d.query) + '</p>' +
            '<span class="mhead__n">' + n + ' from ' + ns + ' retailer' + (ns === 1 ? '' : 's') + esc(cheap) + '</span>' +
          '</div>';
      }

      function renderResults(d) {
        state.last = d;
        var body = d.products.length
          ? '<div class="grid">' + d.products.map(card).join('') + '</div>'
          : '<p class="mnote">No shop on the list has that in stock right now. Try a brand, a mould, or one of the departments below.</p>';
        view.className = 'stack';
        view.innerHTML =
          resultHead(d) +
          reachNote(d) +
          downNote(d.sources) +
          body +
          '<p class="mnote">Prices and stock read from each shop just now. They set them, and they can change them — check the shop before you buy.</p>' +
          commissionNote() +
          '<div><p class="section-label">Browse</p>' + deptGrid() + '</div>';
        wire();
      }

      // Disclosed only when a programme is actually configured, because with
      // none there is no commission to disclose. It states the thing a reader
      // would reasonably suspect -- that being paid might bend the results --
      // rather than leaving them to wonder: the ranking is price-ordered and
      // affiliate tagging happens after it, which market/affiliate.ts enforces.
      function commissionNote() {
        if (!state.affiliate) return '';
        return '<p class="mnote">Some links here earn us a commission if you buy. ' +
          'It costs you nothing extra, and it never changes which results you see ' +
          'or the order they are in.</p>';
      }

      // What the Market is, said differently depending on whether we sell here.
      //
      // This used to read "Nothing here is ours -- we take no payment and hold
      // no stock", which was true and is the claim the whole comparison was
      // built on. It stops being true the moment our own storefront is
      // configured, and a page still saying it would be the most damaging kind
      // of stale copy: a promise of neutrality that the reader can disprove by
      // scrolling. So there are two versions and the configuration picks one.
      //
      // The second one does not bury the change -- it LEADS with it. We show
      // our own stock first (owner's call: we are in no affiliate programme
      // and take no payment from any retailer here, so we owe none of them
      // equal billing), and the honest price of that is saying so plainly
      // rather than claiming a neutrality we no longer have.
      //
      // What it must keep promising, because this part is still true and is
      // what makes the page worth reading: the prices are real and a cheaper
      // rival is visible on the next row rather than suppressed.
      function storeNote() {
        if (!state.ourStore) {
          return '<p class="mnote">Most shops show you their own stock \u2014 this shows you ' +
            'everyone\u2019s. Nothing here is ours yet: we take no payment and hold no stock, ' +
            'and every result opens on the seller\u2019s own page.</p>';
        }
        return '<p class="mnote"><strong>Our own store comes first</strong>, marked ' +
          '<span class="card__ours">Ours</span> \u2014 then every other retailer, ordered by ' +
          'price. Real prices throughout, so if someone is cheaper you can see it on the next ' +
          'row. Every result opens on the seller\u2019s own page.</p>';
      }

      // The headline claim lives in static markup so it renders with no
      // JavaScript, and it is now written to be true whether or not we stock
      // anything -- which is the real fix for what went wrong here. The old
      // default said "we are not a shop", and that was caught by rendering the
      // page and reading it rather than by a test: the guard written for it
      // checked storeNote() and never saw the lede, so the one line carrying
      // the stale claim was the one line nothing looked at (the shape of the
      // home.html miss in CLAUDE.md).
      //
      // This still swaps the line when a storefront is configured, because a
      // RESULTS page renders the lede and not storeNote(), so without it the
      // ours-first ordering would go undeclared on exactly the screen where
      // the ordering is visible.
      function setLede() {
        if (!state.ourStore) return;
        var el = document.getElementById('lede');
        if (!el) return;
        el.textContent = 'Search anything disc golf and see what it costs. Our own store ' +
          'comes first, then every other retailer by price.';
      }

      // The way in to our own storefront, shown only when there is one.
      // A row rather than a sixth tab: Market is already where buying happens.
      function storeRow() {
        if (!state.ourStore) return '';
        // Opens the in-app store, not the Shopify site in a new tab: being
        // shown the door is a poor answer to "what do you have?". Buying
        // still hands off to our storefront from the product itself.
        return '<div><p class="section-label">Our store</p>' +
          '<a class="srow" href="/store">' +
            '<span class="srow__body">' +
              '<span class="srow__title">' + esc(state.ourStore.label) + ' \u2192</span>' +
              '<span class="srow__sub">Discs, apparel and accessories, shipped by us</span>' +
            '</span>' +
          '</a></div>';
      }

      // Department glyphs, drawn rather than borrowed.
      //
      // These were emoji and two were plainly the wrong object: Baskets had a
      // BASKETBALL and Accessories a wicker laundry basket, with a bow and
      // arrow on fairway drivers. No substitution fixes that -- Unicode has
      // one disc golf character (the disc) and no disc golf basket at all --
      // so they are drawn here, in the logo's own vocabulary: the basket is
      // its thick rounded top bar, bold vertical chains, wide trapezoid tray
      // and post. Same decision the notification bell reached when U+25C9 read
      // as a record button, and for the same reason.
      //
      // The four disc classes are deliberately ONE family -- the same disc
      // mark with a flight line that grows and bends -- because they are the
      // same object at different speeds, and the tile carries a label to say
      // which. Length varies more than curvature, which is what actually
      // reads at 20px.
      var DEPT_ICON = {
        discs:
          '<ellipse cx="12" cy="7.4" rx="7" ry="2.5"/>' +
          '<ellipse cx="12" cy="12" rx="7" ry="2.5"/>' +
          '<ellipse cx="12" cy="16.6" rx="7" ry="2.5"/>',

        // The four disc classes are one family: the same disc, with one motion
        // line per step up in speed. That maps to the speed rating players
        // already buy by (a putter is a 2, a distance driver a 13), it is
        // ordered so the four read as a scale rather than four unrelated
        // marks, and motion lines are concrete where a curve is not.
        //
        // Two earlier passes are worth recording so they are not retried. A
        // tiny disc with a stub of flight line read as a scratch in the corner
        // of the box. Drawing the four as full-height FLIGHT PATHS -- the
        // bottom-to-top convention every flight chart uses -- was better
        // reasoning and worse in practice: rendered at 20px they read as
        // punctuation, a comma and an exclamation mark and a bracket, because
        // a bare curve at that size is indistinguishable from type.
        putter:
          '<ellipse cx="14.6" cy="12" rx="5.6" ry="2.4"/>' +
          '<path d="M4.6 12h2.8"/>',
        midrange:
          '<ellipse cx="14.6" cy="12" rx="5.6" ry="2.4"/>' +
          '<path d="M4.6 9.5h2.8M4.6 14.5h2.8"/>',
        fairway:
          '<ellipse cx="14.6" cy="12" rx="5.6" ry="2.4"/>' +
          '<path d="M4.6 8h2.8M4.6 12h2.8M4.6 16h2.8"/>',
        distance:
          '<ellipse cx="14.6" cy="12" rx="5.6" ry="2.4"/>' +
          '<path d="M3.4 6.8h3.2M3.4 10.3h3.2M3.4 13.7h3.2M3.4 17.2h3.2"/>',

        bag:
          '<path d="M6.3 9.8a5.7 5.7 0 0 1 11.4 0v8.4a1.9 1.9 0 0 1-1.9 1.9H8.2a1.9 1.9 0 0 1-1.9-1.9z"/>' +
          '<path d="M9.4 20.1v-4.6h5.2v4.6"/>' +
          '<path d="M10.2 7.4V5.9a1.8 1.8 0 0 1 3.6 0v1.5"/>',
        basket:
          '<rect x="4.6" y="5.6" width="14.8" height="2.4" rx="1.2" fill="currentColor" stroke="none"/>' +
          '<path d="M7.3 8.6V14M10.4 8.6V14M13.6 8.6V14M16.7 8.6V14"/>' +
          '<path d="M5.4 14h13.2l-2.4 3.5H7.8z"/>' +
          '<path d="M12 17.7v3.1M9.2 20.8h5.6"/>',
        shirt:
          '<path d="M9.2 4.2 5 6.6l1.7 3.2 1.6-.8v10.8h7.4V9l1.6.8L19 6.6l-4.2-2.4a2.9 2.9 0 0 1-5.6 0z"/>',

        // A mini is a small disc you put down to mark your lie, so it is one
        // SOLID small disc on a wide ground line -- small against the ground,
        // which is the whole point of it. An outlined ellipse with anything
        // inside it renders as a closed EYE at this size; that was the first
        // version and a ring-within-a-ring was the second.
        mini:
          '<ellipse cx="12" cy="13.9" rx="4.1" ry="1.75" fill="currentColor" stroke="none"/>' +
          '<path d="M3.8 18.2h16.4"/>',

        // A towel hanging on a rail, and the thing that makes it read is the
        // ASPECT RATIO: a tall narrow cloth under a short rail. Five versions
        // failed before that was the finding, every one of them furniture or
        // stationery -- draped over a full-width bar it is a table, with an
        // arc over the top a padlock, as a striped panel a card, with a wavy
        // hem a torn receipt, and short-and-wide under a wide rail a stool.
        // Width is what said "table"; height is what says "cloth".
        towel:
          '<path d="M7.4 4.6h9.2"/>' +
          '<path d="M8.8 4.6v14.8h6.4V4.6"/>' +
          '<path d="M8.8 8.2h6.4"/>',
      };

      // Looked up by NAME, never interpolated from the response as markup --
      // the icon used to be the one unescaped field on the tile. An unknown
      // name draws the disc rather than an empty box, so a department added
      // without a drawing is visibly plain instead of invisibly broken.
      function deptIcon(name) {
        var body = DEPT_ICON[name] || DEPT_ICON.discs;
        return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" ' +
          'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
      }

      function deptGrid() {
        return '<div class="depts">' + state.departments.map(function (x) {
          return '<button class="dept" type="button" data-dept="' + esc(x.key) + '">' +
            '<span class="dept__glyph" aria-hidden="true">' + deptIcon(x.icon) + '</span>' +
            '<span class="dept__label">' + esc(x.label) + '</span>' +
            '<span class="dept__why">' + esc(x.why) + '</span>' +
          '</button>';
        }).join('') + '</div>';
      }

      function renderBrowse() {
        view.className = 'stack';
        view.innerHTML =
          '<div><p class="section-label">Browse</p>' + deptGrid() + '</div>' +
          storeRow() +
          storeNote() +
          commissionNote() +
          (state.web ? '' : '<p class="mdown">Web search is not switched on yet, so this currently ' +
            'reaches a set of disc golf storefronts rather than the whole web.</p>');
        wire();
      }

      function wire() {
        [].forEach.call(view.querySelectorAll('[data-dept]'), function (b) {
          b.addEventListener('click', function () { loadDept(b.dataset.dept); });
        });
      }

      function busy(msg) { view.className = 'loading'; view.textContent = msg || 'Searching the shops…'; }
      function fail(e) {
        view.className = 'screen';
        view.innerHTML = '<div class="error">' + esc((e && e.message) || 'Could not reach the shops') + '</div>';
      }

      async function loadDept(key) {
        state.mode = 'dept'; state.deptKey = key;
        busy();
        try { renderResults(await API.get('/market/department/' + encodeURIComponent(key))); }
        catch (e) { fail(e); }
      }

      async function search(q) {
        q = (q || '').trim();
        if (!q) return;
        state.mode = 'search'; state.query = q;
        qIn.value = q;
        busy();
        try { renderResults(await API.get('/market/search?q=' + encodeURIComponent(q))); }
        catch (e) { fail(e); }
      }

      form.addEventListener('submit', function (e) { e.preventDefault(); search(qIn.value); });

      (async function init() {
        try {
          var d = await API.get('/market');
          state.departments = d.departments || [];
          state.web = !!d.webSearch;
          state.affiliate = !!d.affiliate;
          state.ourStore = d.ourStore || null;
          setLede();
          document.getElementById('reach').textContent = state.web ? 'web search' : 'storefronts';
          // A deep link wins over the front page, so a shared search opens on
          // what was shared rather than on the department of the day.
          var usp = new URLSearchParams(location.search);
          if (usp.get('q')) return search(usp.get('q'));
          if (usp.get('dept')) return loadDept(usp.get('dept'));
          renderBrowse();
        } catch (e) { fail(e); }
      })();
    })();
  </script>
</body>
</html>
