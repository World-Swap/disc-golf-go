<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, follow" />
  <title>Market · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w17" />
  <style>
    /* The Market is the only page in the app that shows a grid of goods, so
       its CSS lives here rather than in app-ui.css, which is shared behind a
       ?v= buster across every page. Nothing below is used anywhere else. */

    /* ── Search ─────────────────────────────────────────────────────── */
    .msearch { display: flex; gap: 8px; }
    .msearch__in {
      flex: 1; min-width: 0; font: inherit; font-size: 16px; /* 16px: anything
         smaller makes iOS Safari zoom the page on focus */
      padding: 12px 14px; border: 1px solid var(--hair); border-radius: 11px;
      background: #fff; color: var(--color-ink);
    }
    .msearch__in:focus { outline: 2px solid var(--color-orange); outline-offset: -1px; }
    .msearch__go {
      flex: none; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
      padding: 0 18px; border: 0; border-radius: 11px;
      background: var(--color-orange); color: #fff;
    }
    .msearch__go:disabled { opacity: .5; cursor: default; }

    /* ── Departments ────────────────────────────────────────────────── */
    .depts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 560px) { .depts { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 860px) { .depts { grid-template-columns: repeat(5, 1fr); } }
    .dept {
      display: flex; flex-direction: column; gap: 3px; text-align: left;
      padding: 12px 12px 13px; border: 1px solid var(--hair); border-radius: 12px;
      background: #fff; font: inherit; color: inherit; cursor: pointer;
    }
    .dept:hover { border-color: var(--color-orange); }
    .dept__glyph { font-size: 17px; line-height: 1; }
    .dept__label { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
    /* The reason a department exists is the useful half, so it wraps rather
       than ellipsing -- but it is clamped so one long line cannot make a
       single tile taller than the row beside it. */
    .dept__why {
      font-size: 11.5px; line-height: 1.35; color: var(--color-ash);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ── Product grid ───────────────────────────────────────────────── */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 860px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .card {
      display: flex; flex-direction: column; text-decoration: none; color: inherit;
      border: 1px solid var(--hair); border-radius: 12px; background: #fff; overflow: hidden;
    }
    .card:hover { border-color: var(--color-orange); }
    /* A fixed square: the shops' images are every ratio there is, and without
       this the grid rows step raggedly as each one loads. */
    .card__shot {
      position: relative; aspect-ratio: 1 / 1; background: var(--color-peach);
      display: flex; align-items: center; justify-content: center;
    }
    .card__shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .card__none { font-size: 22px; opacity: .25; }
    .card__flag {
      position: absolute; top: 7px; left: 7px;
      font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      padding: 3px 6px; border-radius: 5px; background: var(--color-ink); color: #fff;
    }
    .card__flag--out { background: var(--color-ash); }
    .card__flag--sale { background: var(--color-orange); }
    .card__body { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px 11px; flex: 1; }
    /* .card__body is a flex ITEM where these spans sit; flex blockifies its
       children, not its grandchildren, so without this they run together --
       the trap already shipped in .lprev__*, .uprow__* and .stat span. */
    .card__title, .card__price, .card__shop, .card__was { display: block; }
    .card__title {
      font-size: 12.5px; font-weight: 600; line-height: 1.3; color: var(--color-ink);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      /* min-height of two lines, so a one-line title does not make its card
         shorter than the one beside it and step the row. */
      min-height: 2.6em;
    }
    .card__price { margin-top: 4px; font-size: 14.5px; font-weight: 700; color: var(--color-ink); }
    .card__was { font-size: 11px; color: var(--color-ash); text-decoration: line-through; }
    .card__shop {
      margin-top: auto; padding-top: 5px; font-size: 10.5px; color: var(--color-ash);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Filter row ─────────────────────────────────────────────────── */
    .filters { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; font: inherit; font-size: 12px; cursor: pointer;
      padding: 6px 11px; border: 1px solid var(--hair); border-radius: 999px;
      background: #fff; color: var(--color-ash); white-space: nowrap;
    }
    .chip[aria-pressed="true"] { background: var(--color-ink); border-color: var(--color-ink); color: #fff; }

    /* ── Status lines ───────────────────────────────────────────────── */
    .mnote { font-size: 11.5px; line-height: 1.5; color: var(--color-ash); }
    .mdown {
      font-size: 11.5px; line-height: 1.5; color: var(--color-ash);
      padding: 9px 11px; border: 1px solid var(--hair); border-radius: 9px; background: var(--color-peach);
    }
    .mhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .mhead__n { font-size: 11.5px; color: var(--color-ash); flex: none; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title">Market</span>
      <span class="pill" id="shopcount">—</span>
    </header>
    <div class="screen stack">
      <div>
        <p class="section-label">Every shop at once</p>
        <h1 class="h-display">MARKET<span class="mark" style="width:38%"></span></h1>
        <p class="mnote" id="lede">
          Live prices and live stock from disc golf shops, searched together.
          We are not a shop — every result opens on the retailer's own page.
        </p>
      </div>

      <form class="msearch" id="form" autocomplete="off">
        <input class="msearch__in" id="q" type="search" name="q" maxlength="80"
               placeholder="Search discs, bags, baskets…" aria-label="Search the market" />
        <button class="msearch__go" id="go" type="submit">Search</button>
      </form>

      <div id="view" class="loading">Loading…</div>
    </div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w14"></script>
  <script>
    (function () {
      DGG.tabbar('market');
      var esc = DGG.esc, API = DGG.API;
      var view = document.getElementById('view');
      var form = document.getElementById('form');
      var qIn = document.getElementById('q');
      var go = document.getElementById('go');

      // What the page is currently showing. `retailer` is a filter applied by
      // re-asking the server rather than by hiding cards: a filter that only
      // hides what was already fetched would show "4 shops" while quietly
      // having searched eleven.
      var state = { shops: [], departments: [], retailer: '', last: null, mode: 'browse' };

      function money(n, ccy) {
        if (n === null || n === undefined) return '';
        try {
          return new Intl.NumberFormat(undefined, { style: 'currency', currency: ccy || 'USD' }).format(n);
        } catch (e) {
          // An unknown currency code must still print a price with its code
          // attached, never a bare number that reads as dollars.
          return (ccy ? ccy + ' ' : '') + n.toFixed(2);
        }
      }

      function card(p) {
        var flag = !p.available
          ? '<span class="card__flag card__flag--out">Sold out</span>'
          : p.compareAt ? '<span class="card__flag card__flag--sale">Sale</span>' : '';
        var shot = p.image
          ? '<img src="' + esc(p.image) + '" alt="" loading="lazy" />'
          : '<span class="card__none" aria-hidden="true">\u{1F94F}</span>';
        return '<a class="card" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">' +
          '<span class="card__shot">' + shot + flag + '</span>' +
          '<span class="card__body">' +
            '<span class="card__title">' + esc(p.title) + '</span>' +
            '<span class="card__price">' + esc(money(p.price, p.currency)) + '</span>' +
            (p.compareAt ? '<span class="card__was">' + esc(money(p.compareAt, p.currency)) + '</span>' : '') +
            '<span class="card__shop">' + esc(p.retailerName) + '</span>' +
          '</span>' +
        '</a>';
      }

      function filterRow() {
        var all = '<button class="chip" type="button" data-shop="" aria-pressed="' +
          (state.retailer ? 'false' : 'true') + '">All shops</button>';
        return '<div class="filters">' + all + state.shops.map(function (s) {
          return '<button class="chip" type="button" data-shop="' + esc(s.key) + '" aria-pressed="' +
            (state.retailer === s.key ? 'true' : 'false') + '">' + esc(s.name) + '</button>';
        }).join('') + '</div>';
      }

      // Shops that did not answer are NAMED. A marketplace quietly showing
      // nine of eleven looks complete and is not.
      function downNote(shops) {
        var down = (shops || []).filter(function (s) { return !s.ok; });
        if (!down.length) return '';
        return '<p class="mdown">Could not reach ' + down.map(function (d) {
          return esc(d.name) + (d.error ? ' (' + esc(d.error) + ')' : '');
        }).join(', ') + '. Everything else is live.</p>';
      }

      function resultHead(d) {
        var n = d.products.length;
        var cheap = d.cheapest !== null && d.cheapest !== undefined
          ? ' · from ' + money(d.cheapest, d.currency)
          : '';
        var ok = (d.shops || []).filter(function (s) { return s.ok; }).length;
        return '<div class="mhead">' +
            '<p class="section-label" style="margin:0">' + esc(d.department ? d.department.label : d.query) + '</p>' +
            '<span class="mhead__n">' + n + ' from ' + ok + ' shop' + (ok === 1 ? '' : 's') + esc(cheap) + '</span>' +
          '</div>';
      }

      function renderResults(d) {
        state.last = d;
        var body = d.products.length
          ? '<div class="grid">' + d.products.map(card).join('') + '</div>'
          : '<p class="mnote">No shop on the list has that in stock right now. Try a brand, a mould, or one of the departments below.</p>';
        view.className = 'stack';
        view.innerHTML =
          resultHead(d) +
          filterRow() +
          downNote(d.shops) +
          body +
          '<p class="mnote">Prices and stock read from each shop just now. They set them, and they can change them — check the shop before you buy.</p>' +
          '<div><p class="section-label">Browse</p>' + deptGrid() + '</div>';
        wire();
      }

      function deptGrid() {
        return '<div class="depts">' + state.departments.map(function (x) {
          return '<button class="dept" type="button" data-dept="' + esc(x.key) + '">' +
            '<span class="dept__glyph" aria-hidden="true">' + x.glyph + '</span>' +
            '<span class="dept__label">' + esc(x.label) + '</span>' +
            '<span class="dept__why">' + esc(x.why) + '</span>' +
          '</button>';
        }).join('') + '</div>';
      }

      function renderBrowse() {
        view.className = 'stack';
        view.innerHTML =
          '<div><p class="section-label">Browse</p>' + deptGrid() + '</div>' +
          filterRow() +
          '<p class="mnote">' + state.shops.length + ' shops searched together. ' +
            'Nothing here is ours — we take no payment and hold no stock; every result opens on the shop’s own page.</p>';
        wire();
      }

      function wire() {
        [].forEach.call(view.querySelectorAll('[data-dept]'), function (b) {
          b.addEventListener('click', function () { loadDept(b.dataset.dept); });
        });
        [].forEach.call(view.querySelectorAll('[data-shop]'), function (b) {
          b.addEventListener('click', function () {
            state.retailer = b.dataset.shop;
            // Re-ask rather than hide: see state.retailer above.
            if (state.mode === 'dept') loadDept(state.deptKey);
            else if (state.mode === 'search') search(state.query);
            else renderBrowse();
          });
        });
      }

      function busy(msg) { view.className = 'loading'; view.textContent = msg || 'Searching the shops…'; }
      function fail(e) {
        view.className = 'screen';
        view.innerHTML = '<div class="error">' + esc((e && e.message) || 'Could not reach the shops') + '</div>';
      }

      function rq(path) {
        return path + (state.retailer ? (path.indexOf('?') >= 0 ? '&' : '?') + 'retailer=' + encodeURIComponent(state.retailer) : '');
      }

      async function loadDept(key) {
        state.mode = 'dept'; state.deptKey = key;
        busy();
        try { renderResults(await API.get(rq('/market/department/' + encodeURIComponent(key)))); }
        catch (e) { fail(e); }
      }

      async function search(q) {
        q = (q || '').trim();
        if (!q) return;
        state.mode = 'search'; state.query = q;
        qIn.value = q;
        busy();
        try { renderResults(await API.get(rq('/market/search?q=' + encodeURIComponent(q)))); }
        catch (e) { fail(e); }
      }

      form.addEventListener('submit', function (e) { e.preventDefault(); search(qIn.value); });

      (async function init() {
        try {
          var d = await API.get('/market');
          state.shops = d.shops || [];
          state.departments = d.departments || [];
          document.getElementById('shopcount').textContent = state.shops.length + ' shops';
          // A deep link wins over the front page, so a shared search opens on
          // what was shared rather than on the department of the day.
          var usp = new URLSearchParams(location.search);
          if (usp.get('q')) return search(usp.get('q'));
          if (usp.get('dept')) return loadDept(usp.get('dept'));
          renderBrowse();
        } catch (e) { fail(e); }
      })();
    })();
  </script>
</body>
</html>
