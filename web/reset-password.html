<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>New Password · Disc Golf Go</title>
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/app.css" />
  <link rel="stylesheet" href="/styles/app-ui.css" />
</head>
<body>
  <main class="app">
    <div class="auth">
      <h1 class="h-display">NEW<br />PASS<span class="mark" style="width:36%"></span></h1>
      <p class="caption" style="margin:16px 0 32px">Choose a new password</p>
      <div class="error" id="err"></div>
      <div id="wrap"><div class="loading">Checking link…</div></div>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    (function () {
      var API = DGG.API, err = document.getElementById('err'), wrap = document.getElementById('wrap');
      var token = new URLSearchParams(location.search).get('token');
      if (!token) { wrap.innerHTML = '<div class="error">Missing reset token.</div>'; return; }

      API.get('/auth/verify-reset-token?token=' + encodeURIComponent(token)).then(function (v) {
        if (!v.valid) { wrap.innerHTML = '<div class="error">This reset link is ' + DGG.esc(v.error || 'invalid') + '. <a href="/forgot-password" style="color:var(--color-frost)">Request a new one</a>.</div>'; return; }
        wrap.innerHTML =
          '<form id="form"><label class="field"><span class="field__label">New password · 8+ characters</span>' +
          '<input class="input" type="password" name="password" minlength="8" required placeholder="••••••••" autocomplete="new-password" /></label>' +
          '<button class="btn btn--block" id="submit">Set New Password</button></form>';
        document.getElementById('form').addEventListener('submit', async function (e) {
          e.preventDefault(); err.textContent = '';
          var btn = document.getElementById('submit'); btn.disabled = true; btn.textContent = 'Saving…';
          try {
            await API.post('/auth/reset-password', { token: token, password: new FormData(this).get('password') });
            wrap.innerHTML = '<div class="card"><p style="font-family:var(--font-mono);font-size:12px;color:var(--color-frost)">Password updated. <a href="/login" style="color:var(--color-bone)">Log in →</a></p></div>';
          } catch (ex) { err.textContent = ex.message || 'Could not reset password'; btn.disabled = false; btn.textContent = 'Set New Password'; }
        });
      }).catch(function () { wrap.innerHTML = '<div class="error">Could not verify link.</div>'; });
    })();
  </script>
</body>
</html>
