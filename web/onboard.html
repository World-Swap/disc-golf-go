<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Welcome · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w15" />
</head>
<body>
  <main class="app">
    <div class="auth">
      <p class="caption" style="margin-bottom:16px">Welcome to Disc Golf Go</p>
      <h1 class="h-display">HAVE<br />YOU<br />PLAYED?<span class="mark" style="width:52%"></span></h1>
      <p class="row__sub" style="margin:16px 0 32px;text-transform:none;letter-spacing:0;font-size:12px;color:var(--color-frost)">We'll tailor your training path.</p>

      <div class="error" id="err"></div>
      <button class="btn btn--block" data-exp="new">I'm new to disc golf</button>
      <button class="btn btn--ghost btn--block" style="margin-top:12px" data-exp="experienced">I've played before</button>
      <p class="formnote"><a href="#" id="skip">Skip for now</a></p>
    </div>
  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      var API = DGG.API, err = document.getElementById('err');
      try { API.post('/onboarding/event', { event_type: 'onboard_loaded', guest_uuid: API.guestUuid() }); } catch (e) {}

      async function finish(exp) {
        err.textContent = '';
        try {
          if (exp) await API.put('/onboarding/experience', { experience_level: exp });
          await API.post('/onboarding/complete', {});
          // This screen promises "we'll tailor your training path", so it hands
          // straight to the four questions that actually do it rather than
          // dropping the player on /home with the promise unkept. `exp` rides
          // along so the survey does not ask what was just answered. Skipping
          // goes to /home: someone who skipped this has said no to questions.
          location.replace(exp ? '/assessment?from=onboard&exp=' + encodeURIComponent(exp) : '/home');
        } catch (ex) { err.textContent = ex.message || 'Something went wrong'; }
      }

      document.querySelectorAll('[data-exp]').forEach(function (b) {
        b.addEventListener('click', function () { b.disabled = true; finish(this.getAttribute('data-exp')); });
      });
      document.getElementById('skip').addEventListener('click', function (e) { e.preventDefault(); finish(null); });
    })();
  </script>
</body>
</html>
