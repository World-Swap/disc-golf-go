<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ranks · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w6" />
  <link rel="stylesheet" href="/styles/app.css?v=w6" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w6" />
  <style>
    .rank { width:26px; font-family:var(--font-mono); font-size:13px; color:var(--color-ash); text-align:right; flex:none; }
    .row--me { background:var(--color-peach); }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title">Rankings</span>
      <span class="pill" id="period-pill">All-time</span>
    </header>
    <div class="screen stack">
      <div><h1 class="h-display">RANKS<span class="mark" style="width:36%"></span></h1></div>
      <div class="segbar" id="tabs">
        <button class="seg" data-tab="overall" aria-selected="true">XP</button>
        <button class="seg" data-tab="lessons">Lessons</button>
        <button class="seg" data-tab="streak">Streak</button>
        <button class="seg" data-tab="challenges">Wins</button>
      </div>
      <div class="segbar" id="periods">
        <button class="seg" data-period="alltime" aria-selected="true">All-time</button>
        <button class="seg" data-period="week">Week</button>
        <button class="seg" data-period="month">Month</button>
      </div>
      <div id="board" class="loading">Loading…</div>
    </div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w5"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('profile');
      var esc = DGG.esc, API = DGG.API;
      var board = document.getElementById('board');
      var state = { tab: 'overall', period: 'alltime' };
      var STAT = { overall: 'total_xp', lessons: 'lessons_completed', streak: 'current_streak', challenges: 'challenges_won' };
      var UNIT = { overall: 'XP', lessons: '', streak: 'd', challenges: '' };

      function bind(containerId, key) {
        document.getElementById(containerId).addEventListener('click', function (e) {
          var b = e.target.closest('.seg'); if (!b) return;
          [].forEach.call(this.children, function (c) { c.setAttribute('aria-selected', c === b ? 'true' : 'false'); });
          state[key] = b.getAttribute('data-' + key);
          if (key === 'period') document.getElementById('period-pill').textContent = b.textContent;
          load();
        });
      }
      bind('tabs', 'tab'); bind('periods', 'period');

      async function load() {
        board.className = 'loading'; board.textContent = 'Loading…';
        try {
          var data = await API.get('/leaderboard?tab=' + state.tab + '&period=' + state.period);
          var stat = STAT[state.tab], unit = UNIT[state.tab];
          var rows = (data.players || []).map(function (p) {
            var val = p[stat] != null ? p[stat] : 0;
            return '<div class="row' + (p.is_me ? ' row--me' : '') + '">' +
              '<span class="rank">' + (p.rank || '') + '</span>' +
              '<div class="row__body"><div class="row__title">' + esc(p.display_name || 'Player') + (p.is_me ? ' · you' : '') + '</div>' +
              (p.rank_tier ? '<div class="row__sub">' + esc(p.rank_tier) + '</div>' : '') + '</div>' +
              '<span class="row__meta">' + val + (unit ? ' ' + unit : '') + '</span></div>';
          }).join('');
          board.className = '';
          board.innerHTML = rows ? '<div class="rows">' + rows + '</div>' : '<div class="loading">No rankings yet</div>';
        } catch (e) {
          board.className = 'screen'; board.innerHTML = '<div class="error">' + esc(e.message || 'Could not load ranks') + '</div>';
        }
      }
      load();
    })();
  </script>
</body>
</html>
