<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Ranks · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w11" />
  <style>
    .rank { width:26px; font-family:var(--font-mono); font-size:13px; color:var(--color-ash); text-align:right; flex:none; }
    .row--me { background:var(--color-peach); }
    /* Every board opens with this same strip, so switching boards changes the
       numbers and not the furniture. */
    .bhead { margin:0 0 10px; padding:0 2px; }
    /* #board carries .loading itself while fetching, and wraps a .loading child
       for an empty board. Both need the page edge, not --edge-pad on top of it. */
    #board.loading, #board .loading { padding:18px 2px; }
    .bhead__eyebrow { font-family:var(--font-display); font-size:11px; font-weight:700;
      letter-spacing:.12em; text-transform:uppercase; color:var(--color-orange); }
    .bhead__title { font-family:var(--font-display); font-weight:800; font-size:16px;
      line-height:1.25; margin:3px 0 2px; color:var(--color-ink); }
    .bhead__sub { font-family:var(--font-display); font-size:12px; color:var(--color-ash); line-height:1.45; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title">Rankings</span>
      <span class="pill" id="period-pill">All-time</span>
    </header>
    <div class="screen stack">
      <div><h1 class="h-display">RANKS<span class="mark" style="width:36%"></span></h1></div>
      <div class="segbar" id="boards">
        <button class="seg" data-board="training" aria-selected="true">Training</button>
        <button class="seg" data-board="game">Throw Lab</button>
        <button class="seg" data-board="tournament">Weekly</button>
        <button class="seg" data-board="daily">Daily</button>
      </div>
      <div class="segbar segbar--scroll" id="tabs">
        <button class="seg" data-tab="overall" aria-selected="true">XP</button>
        <button class="seg" data-tab="lessons">Lessons</button>
        <button class="seg" data-tab="streak">Streak</button>
        <button class="seg" data-tab="challenges">Daily</button>
      </div>
      <div class="segbar" id="periods"></div>
      <div id="board" class="loading">Loading…</div>
    </div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('profile');
      var esc = DGG.esc, API = DGG.API;
      var board = document.getElementById('board');
      // Deep-linkable. The end of a tournament round offers "See the board",
      // and that has to land on the board you just played -- it used to go to
      // /ranks bare, which opens on Training, so finishing a daily entry showed
      // you the lesson XP ranking. Only a known board is accepted, so a stale
      // or hand-edited link falls back rather than rendering an empty page.
      var BOARDS = ['training', 'game', 'tournament', 'daily'];
      var wanted = new URLSearchParams(location.search).get('board');
      var state = {
        board: BOARDS.indexOf(wanted) >= 0 ? wanted : 'training',
        tab: 'overall',
        period: 'lifetime'
      };
      var STAT = { overall: 'total_xp', lessons: 'lessons_completed', streak: 'current_streak', challenges: 'challenges_won' };
      var UNIT = { overall: 'XP', lessons: '', streak: 'd', challenges: '' };

      // Training and Throw Lab now offer the SAME periods in the SAME order, and
      // the server means the same thing by each: Today is since UTC midnight,
      // Week runs from Monday, Month from the 1st. Training used to show
      // All-time / Week / Month -- a different set, a different order, and a
      // "Week" that was a rolling seven days rather than the game's Monday.
      // Because the slugs match, the chosen period also survives switching
      // boards instead of silently resetting.
      var PERIODS = {
        training: [['daily', 'Today'], ['weekly', 'Week'], ['monthly', 'Month'], ['lifetime', 'All-time']],
        game: [['daily', 'Today'], ['weekly', 'Week'], ['monthly', 'Month'], ['lifetime', 'All-time']],
        // Tournament boards are either this week's or all-time; neither takes
        // a period, so the bar is hidden for them.
        tournament: [],
        daily: []
      };

      // What each board can be ranked by. The keys are the API's metric names,
      // so a tab is a metric and nothing has to be translated.
      var TABS = {
        training: [['overall', 'XP'], ['lessons', 'Lessons'], ['streak', 'Streak'], ['challenges', 'Challenges']],
        game: [['xp', 'XP'], ['best_round', 'Best round'], ['best_18', 'Best 18'], ['aces', 'Aces'],
               ['full_rounds', '18-hole'], ['courses', 'Courses'], ['birdies', 'Birdies'],
               ['under_par', 'Under par']],
        daily: [['week', 'Today'], ['wins', 'Wins'], ['podiums', 'Podiums'],
                ['played', 'Days'], ['best_score', 'Best round']],
        tournament: [['week', 'This week'], ['wins', 'Wins'], ['podiums', 'Podiums'],
                     ['played', 'Weeks played'], ['best_score', 'Best score']]
      };

      function paintTabs() {
        var list = TABS[state.board] || [];
        if (list.every(function (x) { return x[0] !== state.tab; })) state.tab = list[0][0];
        document.getElementById('tabs').innerHTML = list.map(function (x) {
          return '<button class="seg" data-tab="' + x[0] + '" aria-selected="' +
            (x[0] === state.tab) + '">' + esc(x[1]) + '</button>';
        }).join('');
        markScrollEnd();
      }

      // The fade on the metric bar means "more this way", so it has to go once
      // there is no more: at the end of the scroll it would be decoration over
      // a tab you can already see.
      function markScrollEnd() {
        var el = document.getElementById('tabs');
        el.classList.toggle('is-end', el.scrollWidth - el.clientWidth - el.scrollLeft <= 4);
      }
      document.getElementById('tabs').addEventListener('scroll', markScrollEnd);
      window.addEventListener('resize', markScrollEnd);

      function paintPeriods() {
        var list = PERIODS[state.board];
        document.getElementById('periods').style.display = list.length ? '' : 'none';
        if (!list.length) { document.getElementById('periods').innerHTML = ''; return; }
        if (list.every(function (x) { return x[0] !== state.period; })) state.period = list[0][0];
        document.getElementById('periods').innerHTML = list.map(function (x) {
          return '<button class="seg" data-period="' + x[0] + '" aria-selected="' +
            (x[0] === state.period) + '">' + x[1] + '</button>';
        }).join('');
        var label = list.filter(function (x) { return x[0] === state.period; })[0];
        if (label) document.getElementById('period-pill').textContent = label[1];
      }

      function bind(containerId, key) {
        document.getElementById(containerId).addEventListener('click', function (e) {
          var b = e.target.closest('.seg'); if (!b) return;
          [].forEach.call(this.children, function (c) { c.setAttribute('aria-selected', c === b ? 'true' : 'false'); });
          state[key] = b.getAttribute('data-' + key);
          if (key === 'period') document.getElementById('period-pill').textContent = b.textContent;
          load();
        });
      }
      // Switching board is not the same as switching a tab within one: the new
      // board may not have the tab that is selected, so the bars have to be
      // repainted -- which is what corrects state.tab -- BEFORE the fetch.
      // Binding this with bind() ran load() first, on the previous board's tab,
      // so picking Tournament from Training landed on an all-time board instead
      // of this week's. Adding the daily surfaced it; it was always there.
      document.getElementById('boards').addEventListener('click', function (e) {
        var b = e.target.closest('.seg'); if (!b) return;
        [].forEach.call(this.children, function (c) {
          c.setAttribute('aria-selected', c === b ? 'true' : 'false');
        });
        state.board = b.getAttribute('data-board');
        paintTabs(); paintPeriods();
        load();
      });
      document.getElementById('tabs').addEventListener('click', function (e) {
        var b = e.target.closest('.seg'); if (!b) return;
        state.tab = b.getAttribute('data-tab');
        paintTabs(); load();
      });
      // The period bar is rebuilt whenever the board changes, so it is bound
      // by delegation rather than to buttons that may no longer exist.
      document.getElementById('periods').addEventListener('click', function (e) {
        var b = e.target.closest('.seg'); if (!b) return;
        state.period = b.getAttribute('data-period');
        paintPeriods(); load();
      });

      function row(rank, title, sub, meta, isMe) {
        return '<div class="row' + (isMe ? ' row--me' : '') + '">' +
          '<span class="rank">' + (rank || '') + '</span>' +
          '<div class="row__body"><div class="row__title">' + esc(title) + (isMe ? ' · you' : '') + '</div>' +
          (sub ? '<div class="row__sub">' + esc(sub) + '</div>' : '') + '</div>' +
          '<span class="row__meta">' + esc(meta) + '</span></div>';
      }

      // Keyed on the training board's real tab slugs. An earlier version used
      // 'xp'/'daily', which this board never sets, so the eyebrow printed the
      // raw slug ("Training - OVERALL") and every tab claimed the same subtitle.
      var TRAINING_TAB = {
        overall:    ['XP', 'XP earned from completed lessons.'],
        lessons:    ['Lessons', 'Lessons completed.'],
        streak:     ['Streak', 'Consecutive days training.'],
        challenges: ['Challenges', 'Daily challenges completed.']
      };

      function fmtVs(n) { return n == null ? '' : n === 0 ? 'E' : (n > 0 ? '+' + n : String(n)); }

      /** The one header every board uses. title is optional. */
      function bhead(eyebrow, title, sub) {
        return '<div class="bhead"><p class="bhead__eyebrow">' + esc(eyebrow) + '</p>' +
          (title ? '<div class="bhead__title">' + esc(title) + '</div>' : '') +
          (sub ? '<div class="bhead__sub">' + esc(sub) + '</div>' : '') + '</div>';
      }

      async function load() {
        board.className = 'loading'; board.textContent = 'Loading…';
        try {
          var rows;
          // The weekly and the daily are the same two views over different
          // endpoints, so the only thing that varies is the base and the noun.
          var isTourn = state.board === 'tournament' || state.board === 'daily';
          var tb = state.board === 'daily'
            ? { base: '/tournament/daily', name: 'Daily tournament', period: 'Today',
                noun: 'day', nouns: 'days', closes: 'at midnight UTC', resets: 'every day' }
            : { base: '/tournament', name: 'Weekly tournament', period: 'This week',
                noun: 'week', nouns: 'weeks', closes: 'when it closes', resets: 'every Monday' };

          if (isTourn && state.tab !== 'week') {
            // All-time tournament boards: most wins, most podiums, and so on.
            var rec = await API.get(tb.base + '/records?metric=' + state.tab);
            document.getElementById('period-pill').textContent = 'All-time';
            rows = (rec.players || []).map(function (p) {
              var bits = [p.played + ' ' + (p.played === 1 ? tb.noun : tb.nouns)];
              if (p.wins) bits.push(p.wins + (p.wins === 1 ? ' win' : ' wins'));
              if (p.best_finish) bits.push('best #' + p.best_finish);
              return row(p.rank, p.display_name || p.username || 'Player', bits.join(' · '),
                rec.lower_is_better ? fmtVs(p.value) : String(p.value), p.is_me);
            }).join('');
            board.className = '';
            // These boards are over finished weeks only: a placing in a week
            // still being played is not a result yet, so it would be wrong to
            // count it as a win. Said plainly, or the totals look short.
            var note = bhead(tb.name + ' \u00b7 ' + (rec.metric_label || tb.period), '',
              'Completed ' + tb.nouns + ' only \u2014 ' + tb.period.toLowerCase() + ' counts ' + tb.closes + '.');
            board.innerHTML = note + (rows ? '<div class="rows">' + rows + '</div>'
              : '<div class="loading">No one has a ' + esc(rec.metric_label.toLowerCase()) +
                ' yet \u2014 the tournament resets ' + tb.resets + '.</div>');
            return;
          }
          if (isTourn) {
            var t = await API.get(tb.base);
            var me = t.me || {};
            rows = (t.leaderboard || []).map(function (p) {
              return row(p.rank, p.name, 'through ' + t.holes + ' holes',
                fmtVs(p.vs_par), me.place != null && p.rank === me.place);
            }).join('');
            // The course and what's left of the week belong above the field.
            document.getElementById('period-pill').textContent = t.week_key;
            board.className = '';
            board.innerHTML =
              bhead(tb.name + ' \u00b7 ' + tb.period, t.course.name,
                t.holes + ' holes \u00b7 ' + t.players + ' player' + (t.players === 1 ? '' : 's') +
                (me.used != null
                  ? ' \u00b7 you have used ' + me.used + ' of ' + t.max_entries +
                    (t.max_entries === 1 ? ' entry' : ' entries')
                  : '')) +
              (rows ? '<div class="rows">' + rows + '</div>'
                    : '<div class="loading">No scores posted yet — play the tournament from the Play tab.</div>');
            return;
          }
          if (state.board === 'game') {
            var g = await API.get('/game/leaderboard?period=' + state.period + '&metric=' + state.tab);
            rows = (g.players || []).map(function (p) {
              // The row always says what it is ranked on; the line beneath
              // gives the context that makes the number mean something.
              var bits = [p.rounds + (p.rounds === 1 ? ' round' : ' rounds')];
              if (p.full_rounds) bits.push(p.full_rounds + ' × 18');
              if (p.best_vs_par != null && state.tab !== 'best_round') bits.push('best ' + fmtVs(p.best_vs_par));
              if (p.courses && state.tab !== 'courses') bits.push(p.courses + (p.courses === 1 ? ' course' : ' courses'));
              var value = g.lower_is_better ? fmtVs(p.value)
                        : String(p.value) + (g.metric_unit ? ' ' + g.metric_unit : '');
              return row(p.rank, p.display_name || p.username || 'Player', bits.join(' · '), value, p.is_me);
            }).join('');
            board.className = '';
            board.innerHTML = bhead('Throw Lab \u00b7 ' + (g.metric_label || ''), '',
                g.lower_is_better ? 'Lower is better.' : 'Ranked across every Throw Lab round.') +
              (rows ? '<div class="rows">' + rows + '</div>'
                : '<div class="loading">No one has a ' + esc((g.metric_label || '').toLowerCase()) +
                  ' in this window yet.</div>');
            return;
          }
          {
            var data = await API.get('/leaderboard?tab=' + state.tab + '&period=' + state.period);
            var stat = STAT[state.tab], unit = UNIT[state.tab];
            rows = (data.players || []).map(function (p) {
              var val = p[stat] != null ? p[stat] : 0;
              return row(p.rank, p.display_name || 'Player', p.rank_tier || '', val + (unit ? ' ' + unit : ''), p.is_me);
            }).join('');
          }
          board.className = '';
          var tl = TRAINING_TAB[state.tab] || [state.tab, ''];
          var tHead = state.board === 'game' ? '' : bhead('Training \u00b7 ' + tl[0], '', tl[1]);
          board.innerHTML = tHead + (rows ? '<div class="rows">' + rows + '</div>'
            : '<div class="loading">No rankings yet — ' +
              (state.board === 'game' ? 'play a round to get on the board.' : 'complete a lesson to get on the board.') + '</div>');
        } catch (e) {
          board.className = 'screen'; board.innerHTML = '<div class="error">' + esc(e.message || 'Could not load ranks') + '</div>';
        }
      }
      // Reflect a deep-linked board in the bar, which is otherwise selected in
      // the static markup and would keep showing Training as the active tab.
      [].forEach.call(document.getElementById('boards').children, function (c) {
        c.setAttribute('aria-selected', c.getAttribute('data-board') === state.board ? 'true' : 'false');
      });
      paintTabs();
      paintPeriods();
      load();
    })();
  </script>
</body>
</html>
