<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ranks · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w9" />
  <link rel="stylesheet" href="/styles/app.css?v=w9" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w9" />
  <style>
    .rank { width:26px; font-family:var(--font-mono); font-size:13px; color:var(--color-ash); text-align:right; flex:none; }
    .row--me { background:var(--color-peach); }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title">Rankings</span>
      <span class="pill" id="period-pill">All-time</span>
    </header>
    <div class="screen stack">
      <div><h1 class="h-display">RANKS<span class="mark" style="width:36%"></span></h1></div>
      <div class="segbar" id="boards">
        <button class="seg" data-board="training" aria-selected="true">Training</button>
        <button class="seg" data-board="game">Throw Lab</button>
        <button class="seg" data-board="tournament">Tournament</button>
      </div>
      <div class="segbar segbar--scroll" id="tabs">
        <button class="seg" data-tab="overall" aria-selected="true">XP</button>
        <button class="seg" data-tab="lessons">Lessons</button>
        <button class="seg" data-tab="streak">Streak</button>
        <button class="seg" data-tab="challenges">Daily</button>
      </div>
      <div class="segbar" id="periods"></div>
      <div id="board" class="loading">Loading…</div>
    </div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w9"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('profile');
      var esc = DGG.esc, API = DGG.API;
      var board = document.getElementById('board');
      var state = { board: 'training', tab: 'overall', period: 'alltime' };
      var STAT = { overall: 'total_xp', lessons: 'lessons_completed', streak: 'current_streak', challenges: 'challenges_won' };
      var UNIT = { overall: 'XP', lessons: '', streak: 'd', challenges: '' };

      // Two boards, two vocabularies. Training ranks lessons, XP and streaks;
      // Throw Lab ranks what you earn playing, which is comparable across
      // 3-hole and 18-hole rounds in a way raw score is not.
      var PERIODS = {
        training: [['alltime', 'All-time'], ['week', 'Week'], ['month', 'Month']],
        game: [['daily', 'Today'], ['weekly', 'Week'], ['monthly', 'Month'], ['lifetime', 'All-time']],
        // Tournament boards are either this week's or all-time; neither takes
        // a period, so the bar is hidden for them.
        tournament: []
      };

      // What each board can be ranked by. The keys are the API's metric names,
      // so a tab is a metric and nothing has to be translated.
      var TABS = {
        training: [['overall', 'XP'], ['lessons', 'Lessons'], ['streak', 'Streak'], ['challenges', 'Daily']],
        game: [['xp', 'XP'], ['best_round', 'Best round'], ['best_18', 'Best 18'], ['aces', 'Aces'],
               ['full_rounds', '18-hole'], ['courses', 'Courses'], ['birdies', 'Birdies'],
               ['under_par', 'Under par']],
        tournament: [['week', 'This week'], ['wins', 'Wins'], ['podiums', 'Podiums'],
                     ['played', 'Weeks played'], ['best_score', 'Best score']]
      };

      function paintTabs() {
        var list = TABS[state.board] || [];
        if (list.every(function (x) { return x[0] !== state.tab; })) state.tab = list[0][0];
        document.getElementById('tabs').innerHTML = list.map(function (x) {
          return '<button class="seg" data-tab="' + x[0] + '" aria-selected="' +
            (x[0] === state.tab) + '">' + esc(x[1]) + '</button>';
        }).join('');
        markScrollEnd();
      }

      // The fade on the metric bar means "more this way", so it has to go once
      // there is no more: at the end of the scroll it would be decoration over
      // a tab you can already see.
      function markScrollEnd() {
        var el = document.getElementById('tabs');
        el.classList.toggle('is-end', el.scrollWidth - el.clientWidth - el.scrollLeft <= 4);
      }
      document.getElementById('tabs').addEventListener('scroll', markScrollEnd);
      window.addEventListener('resize', markScrollEnd);

      function paintPeriods() {
        var list = PERIODS[state.board];
        document.getElementById('periods').style.display = list.length ? '' : 'none';
        if (!list.length) { document.getElementById('periods').innerHTML = ''; return; }
        if (list.every(function (x) { return x[0] !== state.period; })) state.period = list[0][0];
        document.getElementById('periods').innerHTML = list.map(function (x) {
          return '<button class="seg" data-period="' + x[0] + '" aria-selected="' +
            (x[0] === state.period) + '">' + x[1] + '</button>';
        }).join('');
        var label = list.filter(function (x) { return x[0] === state.period; })[0];
        if (label) document.getElementById('period-pill').textContent = label[1];
      }

      function bind(containerId, key) {
        document.getElementById(containerId).addEventListener('click', function (e) {
          var b = e.target.closest('.seg'); if (!b) return;
          [].forEach.call(this.children, function (c) { c.setAttribute('aria-selected', c === b ? 'true' : 'false'); });
          state[key] = b.getAttribute('data-' + key);
          if (key === 'period') document.getElementById('period-pill').textContent = b.textContent;
          load();
        });
      }
      bind('boards', 'board');
      document.getElementById('tabs').addEventListener('click', function (e) {
        var b = e.target.closest('.seg'); if (!b) return;
        state.tab = b.getAttribute('data-tab');
        paintTabs(); load();
      });
      // The period bar is rebuilt whenever the board changes, so it is bound
      // by delegation rather than to buttons that may no longer exist.
      document.getElementById('periods').addEventListener('click', function (e) {
        var b = e.target.closest('.seg'); if (!b) return;
        state.period = b.getAttribute('data-period');
        paintPeriods(); load();
      });
      document.getElementById('boards').addEventListener('click', function () { paintTabs(); paintPeriods(); });

      function row(rank, title, sub, meta, isMe) {
        return '<div class="row' + (isMe ? ' row--me' : '') + '">' +
          '<span class="rank">' + (rank || '') + '</span>' +
          '<div class="row__body"><div class="row__title">' + esc(title) + (isMe ? ' · you' : '') + '</div>' +
          (sub ? '<div class="row__sub">' + esc(sub) + '</div>' : '') + '</div>' +
          '<span class="row__meta">' + esc(meta) + '</span></div>';
      }

      function fmtVs(n) { return n == null ? '' : n === 0 ? 'E' : (n > 0 ? '+' + n : String(n)); }

      async function load() {
        board.className = 'loading'; board.textContent = 'Loading…';
        try {
          var rows;
          if (state.board === 'tournament' && state.tab !== 'week') {
            // All-time tournament boards: most wins, most podiums, and so on.
            var rec = await API.get('/tournament/records?metric=' + state.tab);
            document.getElementById('period-pill').textContent = 'All-time';
            rows = (rec.players || []).map(function (p) {
              var bits = [p.played + (p.played === 1 ? ' week' : ' weeks')];
              if (p.wins) bits.push(p.wins + (p.wins === 1 ? ' win' : ' wins'));
              if (p.best_finish) bits.push('best #' + p.best_finish);
              return row(p.rank, p.display_name || p.username || 'Player', bits.join(' · '),
                rec.lower_is_better ? fmtVs(p.value) : String(p.value), p.is_me);
            }).join('');
            board.className = '';
            // These boards are over finished weeks only: a placing in a week
            // still being played is not a result yet, so it would be wrong to
            // count it as a win. Said plainly, or the totals look short.
            var note = '<p class="row__sub" style="text-transform:none;letter-spacing:0;margin:0 0 10px">' +
              'Completed weeks only — this week counts once it closes.</p>';
            board.innerHTML = note + (rows ? '<div class="rows">' + rows + '</div>'
              : '<div class="loading">No one has a ' + esc(rec.metric_label.toLowerCase()) +
                ' yet — the tournament resets every Monday.</div>');
            return;
          }
          if (state.board === 'tournament') {
            var t = await API.get('/tournament');
            var me = t.me || {};
            rows = (t.leaderboard || []).map(function (p) {
              return row(p.rank, p.name, 'through ' + t.holes + ' holes',
                fmtVs(p.vs_par), me.place != null && p.rank === me.place);
            }).join('');
            // The course and what's left of the week belong above the field.
            document.getElementById('period-pill').textContent = t.week_key;
            board.className = '';
            board.innerHTML =
              '<div class="card" style="margin-bottom:12px"><p class="card__eyebrow">This week</p>' +
                '<div class="row__title" style="font-size:18px;margin:4px 0 2px">' + esc(t.course.name) + '</div>' +
                '<div class="row__sub" style="text-transform:none;letter-spacing:0">' + t.holes +
                  ' holes · ' + t.players + ' player' + (t.players === 1 ? '' : 's') +
                  (me.used != null ? ' · you have used ' + me.used + ' of ' + t.max_entries + ' entries' : '') +
                '</div></div>' +
              (rows ? '<div class="rows">' + rows + '</div>'
                    : '<div class="loading">No scores posted yet — play the tournament from the Play tab.</div>');
            return;
          }
          if (state.board === 'game') {
            var g = await API.get('/game/leaderboard?period=' + state.period + '&metric=' + state.tab);
            rows = (g.players || []).map(function (p) {
              // The row always says what it is ranked on; the line beneath
              // gives the context that makes the number mean something.
              var bits = [p.rounds + (p.rounds === 1 ? ' round' : ' rounds')];
              if (p.full_rounds) bits.push(p.full_rounds + ' × 18');
              if (p.best_vs_par != null && state.tab !== 'best_round') bits.push('best ' + fmtVs(p.best_vs_par));
              if (p.courses && state.tab !== 'courses') bits.push(p.courses + (p.courses === 1 ? ' course' : ' courses'));
              var value = g.lower_is_better ? fmtVs(p.value)
                        : String(p.value) + (g.metric_unit ? ' ' + g.metric_unit : '');
              return row(p.rank, p.display_name || p.username || 'Player', bits.join(' · '), value, p.is_me);
            }).join('');
            board.className = '';
            board.innerHTML = rows ? '<div class="rows">' + rows + '</div>'
              : '<div class="loading">No one has a ' + esc((g.metric_label || '').toLowerCase()) +
                ' in this window yet.</div>';
            return;
          }
          {
            var data = await API.get('/leaderboard?tab=' + state.tab + '&period=' + state.period);
            var stat = STAT[state.tab], unit = UNIT[state.tab];
            rows = (data.players || []).map(function (p) {
              var val = p[stat] != null ? p[stat] : 0;
              return row(p.rank, p.display_name || 'Player', p.rank_tier || '', val + (unit ? ' ' + unit : ''), p.is_me);
            }).join('');
          }
          board.className = '';
          board.innerHTML = rows ? '<div class="rows">' + rows + '</div>'
            : '<div class="loading">No rankings yet — ' +
              (state.board === 'game' ? 'play a round to get on the board.' : 'complete a lesson to get on the board.') + '</div>';
        } catch (e) {
          board.className = 'screen'; board.innerHTML = '<div class="error">' + esc(e.message || 'Could not load ranks') + '</div>';
        }
      }
      paintTabs();
      paintPeriods();
      load();
    })();
  </script>
</body>
</html>
