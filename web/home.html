<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Home · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w6" />
  <link rel="stylesheet" href="/styles/app.css?v=w6" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w6" />
  <style>
    /* Pro video slideshow. 16:9 so a YouTube thumbnail fills it exactly. */
    .slides { position: relative; border-radius: var(--radius-lg, 14px); overflow: hidden;
              background: #202020; box-shadow: var(--shadow-card); aspect-ratio: 16 / 9; }
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 450ms ease;
             display: block; color: #fff; text-decoration: none; }
    .slide[data-on="1"] { opacity: 1; }
    .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Dark wash under the caption so white text stays readable on any frame. */
    .slide__scrim { position: absolute; inset: 0;
      background: linear-gradient(0deg, rgba(16,12,9,0.88) 0%, rgba(16,12,9,0.35) 42%, rgba(16,12,9,0.05) 70%); }
    .slide__body { position: absolute; left: 14px; right: 14px; bottom: 12px; display: block; }
    .slide__creator { display: block; font-size: 11px; font-weight: 800; letter-spacing: .07em;
                      text-transform: uppercase; color: #ffb27a; }
    .slide__title { display: block; font-family: var(--font-display, system-ui); font-weight: 800;
                    font-size: 16px; line-height: 1.2; margin-top: 3px;
                    text-shadow: 0 1px 12px rgba(0,0,0,.55); }
    .slide__play { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
                   width: 46px; height: 46px; border-radius: 50%; background: rgba(252,100,20,.92);
                   display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; }
    .dots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #d9d1c6; border: 0; padding: 0; }
    .dot[data-on="1"] { background: #fc6414; width: 18px; border-radius: 3px; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="logo topbar__spark"><span class="logo__glyph" aria-hidden="true"></span> DISCGOLFGO</span>
      <span class="pill" id="xp">— XP</span>
    </header>

    <div id="content" class="loading">Loading…</div>

    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w6"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('home');
      var esc = DGG.esc;
      var content = document.getElementById('content');

      function meter(pct) {
        return '<div class="meter"><div class="meter__fill" style="width:' + Math.max(0, Math.min(100, pct)) + '%"></div></div>';
      }

      function render(s) {
        var p = s.player || {};
        var tr = s.training || { overall: {}, categories: [], next_lesson: null };
        var tier = (p.skill_tier && p.skill_tier.title) || 'Rookie';
        var levelXpPct = p.xp && s.next_level_xp ? Math.round((p.xp / s.next_level_xp) * 100) : 0;
        var next = tr.next_lesson;

        document.getElementById('xp').textContent = (p.xp != null ? p.xp : 0).toLocaleString() + ' XP';

        var cats = (tr.categories || []).map(function (c) {
          return '<div class="meter-row"><span class="caption">' + esc(c.name) + '</span>' +
            '<span class="caption">' + (c.completed_lessons || 0) + '/' + (c.total_lessons || 0) + '</span></div>' + meter(c.pct_complete || 0);
        }).join('<div style="height:14px"></div>');

        content.className = 'screen stack';
        content.innerHTML =
          '<div class="hbanner">' +
            '<img src="/img/hero.jpg" alt="" />' +
            '<div class="hbanner__scrim"></div>' +
            '<div class="hbanner__body">' +
              '<div class="hbanner__eyebrow">' + esc(tier) + ' · Level ' + (p.level || 1) + '</div>' +
              '<div class="hbanner__title">Train today</div>' +
            '</div>' +
          '</div>' +

          '<div>' +
            '<div class="meter-row"><span class="caption">XP</span><span class="caption">' + (p.xp || 0) + ' / ' + (s.next_level_xp || 0) + '</span></div>' +
            meter(levelXpPct) +
          '</div>' +

          (next ?
            '<a class="artcard" href="/training" style="--art:url(\'/img/cards/training.webp\')">' +
              '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
              '<span class="artcard__body">' +
                '<span class="artcard__eyebrow">Continue training</span>' +
                '<span class="artcard__title">' + esc(next.title) + '</span>' +
                '<span class="artcard__sub">' + esc(next.category_name || '') + ' →</span>' +
              '</span>' +
              '<span class="artcard__meta">+' + (next.xp_reward || 0) + ' XP</span>' +
            '</a>'
          :
            '<a class="artcard" href="/training" style="--art:url(\'/img/cards/training.webp\')">' +
              '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
              '<span class="artcard__body">' +
                '<span class="artcard__eyebrow">Training</span>' +
                '<span class="artcard__title">Browse lessons →</span>' +
                '<span class="artcard__sub">134 lessons from touring pros</span>' +
              '</span>' +
            '</a>'
          ) +

          '<div id="daily"></div>' +

          '<div id="pros"></div>' +

          // Throw Lab — practise the shot shapes the lessons teach.
          '<a class="artcard" href="/game" style="--art:url(\'/img/cards/throw-lab.webp\')">' +
            '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
            '<span class="artcard__body">' +
              '<span class="artcard__eyebrow">Throw Lab</span>' +
              '<span class="artcard__title">Play a quick round →</span>' +
              '<span class="artcard__sub">3, 6 or 9 holes · shape the line, read the fade</span>' +
            '</span>' +
          '</a>' +

          '<div>' +
            '<p class="section-label">Overall progress</p>' +
            '<div class="card">' +
              '<div class="meter-row"><span class="caption">' + (tr.overall.completed_lessons || 0) + ' of ' + (tr.overall.total_lessons || 0) + ' lessons</span>' +
              '<span class="caption">' + (tr.overall.pct_complete || 0) + '%</span></div>' +
              meter(tr.overall.pct_complete || 0) +
              '<div style="height:18px"></div>' + cats +
            '</div>' +
          '</div>' +

          '<div class="stats">' +
            '<div class="stat"><div class="stat__num">' + (p.training_streak_days || 0) + '</div><div class="stat__label">Day streak</div></div>' +
            '<div class="stat"><div class="stat__num">' + (tr.overall.completed_lessons || 0) + '</div><div class="stat__label">Lessons</div></div>' +
            '<div class="stat"><div class="stat__num">' + (p.total_checkins || 0) + '</div><div class="stat__label">Check-ins</div></div>' +
          '</div>';

        loadDaily();
        loadPros();
      }

      // Pro video slideshow: real frames from the coaches whose lessons are in
      // the app. Auto-advances, and stops the moment the player touches it so
      // it never yanks a slide away mid-tap.
      async function loadPros() {
        var box = document.getElementById('pros');
        if (!box) return;
        try {
          var r = await DGG.API.get('/training/featured-videos?limit=8');
          var vids = (r.videos || []).filter(function (v) { return v.video_id; });
          if (!vids.length) return;

          box.innerHTML =
            '<p class="section-label">Pro coaching</p>' +
            '<div class="slides" id="slides">' + vids.map(function (v, i) {
              return '<a class="slide" data-on="' + (i === 0 ? 1 : 0) + '" ' +
                'href="/training?cat=' + esc(v.category_slug) + '&lesson=' + v.lesson_id + '">' +
                '<img src="https://i.ytimg.com/vi/' + esc(v.video_id) + '/hqdefault.jpg" alt="" loading="lazy" />' +
                '<span class="slide__scrim"></span>' +
                '<span class="slide__play" aria-hidden="true">▶</span>' +
                '<span class="slide__body">' +
                  '<span class="slide__creator">' + esc(v.creator) + '</span>' +
                  '<span class="slide__title">' + esc(v.video_title) + '</span>' +
                '</span></a>';
            }).join('') + '</div>' +
            '<div class="dots" id="dots">' + vids.map(function (_v, i) {
              return '<button class="dot" data-on="' + (i === 0 ? 1 : 0) + '" data-i="' + i + '" aria-label="Slide ' + (i + 1) + '"></button>';
            }).join('') + '</div>';

          var slides = box.querySelectorAll('.slide');
          var dots = box.querySelectorAll('.dot');
          var at = 0, timer = null;

          // A thumbnail that won't load would otherwise sit there as a black
          // rectangle. Drop that slide instead, and hide the whole section if
          // none of them load at all.
          var alive = slides.length;
          box.querySelectorAll('.slide img').forEach(function (img, i) {
            img.addEventListener('error', function () {
              slides[i].remove(); dots[i].remove();
              if (--alive <= 0) { stop(); box.innerHTML = ''; return; }
              slides = box.querySelectorAll('.slide');
              dots = box.querySelectorAll('.dot');
              show(0);
            });
          });

          function show(i) {
            at = (i + slides.length) % slides.length;
            for (var k = 0; k < slides.length; k++) {
              slides[k].setAttribute('data-on', k === at ? '1' : '0');
              dots[k].setAttribute('data-on', k === at ? '1' : '0');
            }
          }
          function play() { stop(); timer = setInterval(function () { show(at + 1); }, 5000); }
          function stop() { if (timer) { clearInterval(timer); timer = null; } }

          box.querySelector('#dots').addEventListener('click', function (e) {
            var d = e.target.closest('.dot'); if (!d) return;
            stop(); show(Number(d.dataset.i));
          });
          // A swipe moves a slide; touching at all stops the carousel.
          var x0 = null;
          var strip = box.querySelector('#slides');
          strip.addEventListener('touchstart', function (e) { stop(); x0 = e.touches[0].clientX; }, { passive: true });
          strip.addEventListener('touchend', function (e) {
            if (x0 === null) return;
            var dx = e.changedTouches[0].clientX - x0;
            if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1));
            x0 = null;
          });
          // Don't animate in a background tab.
          document.addEventListener('visibilitychange', function () { document.hidden ? stop() : play(); });
          play();
        } catch (e) { /* offline or no videos — the rest of home is unaffected */ }
      }

      async function loadDaily() {
        try {
          var d = await DGG.API.get('/story/daily');
          var pct = d.target_value ? Math.round((d.progress / d.target_value) * 100) : 0;
          document.getElementById('daily').innerHTML =
            '<div class="artcard" style="--art:url(\'/img/cards/daily.webp\')">' +
              '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
              '<span class="artcard__body">' +
                '<span class="artcard__eyebrow">Daily challenge</span>' +
                '<span class="artcard__title">' + esc(d.title) + '</span>' +
                '<span class="artcard__sub">' + esc(d.description || '') + '</span>' +
              '</span>' +
              '<span class="artcard__meta">' +
                (d.completed ? 'Done ✓' : '+' + (d.xp_reward || 0) + ' XP') +
              '</span>' +
              '<span class="artcard__body" style="max-width:100%;padding-top:0">' +
                '<span class="meter-row" style="display:flex;justify-content:space-between">' +
                  '<span class="caption" style="color:rgba(255,255,255,.75)">Progress</span>' +
                  '<span class="caption" style="color:rgba(255,255,255,.75)">' + (d.progress || 0) + '/' + (d.target_value || 0) + '</span>' +
                '</span>' +
                '<span class="meter" style="display:block;background:rgba(255,255,255,.22)">' +
                  '<span class="meter__fill" style="display:block;width:' + Math.max(0, Math.min(100, pct)) + '%"></span>' +
                '</span>' +
              '</span>' +
            '</div>';
        } catch (e) { /* no daily challenge available */ }
      }

      DGG.API.get('/home/state').then(function (s) {
        if (!s || s.authenticated === false) { location.replace('/login'); return; }
        render(s);
      }).catch(function (e) {
        content.className = 'screen';
        content.innerHTML = '<div class="error">' + esc(e.message || 'Could not load home') + '</div>';
      });
    })();
  </script>
</body>
</html>
