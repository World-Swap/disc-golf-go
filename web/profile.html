<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Profile · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w13" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title">Profile</span>
      <button class="pill" id="logout">Log out</button>
    </header>
    <div id="content" class="loading">Loading…</div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('profile');
      var esc = DGG.esc, API = DGG.API;
      var content = document.getElementById('content');
      document.getElementById('logout').addEventListener('click', function () { DGG.logout(); });

      function meter(pct) { return '<div class="meter"><div class="meter__fill" style="width:' + Math.max(0, Math.min(100, pct)) + '%"></div></div>'; }

      API.get('/players/me').then(function (p) {
        var tier = (p.skill_tier && p.skill_tier.title) || 'Rookie';
        var tierPct = (p.skill_tier_progress && p.skill_tier_progress.pct) || 0;
        var ts = p.training_stats || {};
        content.className = 'screen stack';
        content.innerHTML =
          '<div>' +
            '<p class="section-label">' + esc(tier) + ' · ' + esc(p.level_title || '') + '</p>' +
            '<h1 class="h-display">' + esc((p.display_name || 'Player').toUpperCase()) + '<span class="mark" style="width:40%"></span></h1>' +
            (p.username ? '<p class="row__sub" style="margin-top:8px">@' + esc(p.username) + '</p>' : '') +
          '</div>' +

          '<div>' +
            '<div class="meter-row"><span class="caption">' + (p.xp || 0) + ' XP · ' + esc(tier) + ' tier</span><span class="caption">' + tierPct + '%</span></div>' +
            meter(tierPct) +
          '</div>' +

          // Level, then the two training numbers that were stranded in a second
          // row far down the page. Gold, Badges and Check-ins are gone: gold is
          // spent nowhere, badges are RPG-era, and check-ins are not something
          // this app asks anyone to do. The economy still exists in the shop and
          // the vault — it is just not what Profile should lead with.
          '<div class="stats">' +
            '<div class="stat"><div class="stat__num">' + (p.level || 1) + '</div><div class="stat__label">Level</div></div>' +
            '<div class="stat"><div class="stat__num">' + (ts.training_streak_days || 0) + '</div><div class="stat__label">Streak</div></div>' +
            '<div class="stat"><div class="stat__num">' + (p.best_streak || 0) + '</div><div class="stat__label">Best</div></div>' +
          '</div>' +

          '<div>' +
            '<p class="section-label">Training</p>' +
            '<div class="card">' +
              '<div class="meter-row"><span class="caption">' + (ts.lessons_completed || 0) + ' of ' + (ts.total_lessons || 0) + ' lessons</span>' +
              '<span class="caption">' + (ts.categories_mastered || 0) + ' mastered</span></div>' +
              meter(ts.total_lessons ? Math.round((ts.lessons_completed / ts.total_lessons) * 100) : 0) +
            '</div>' +
            // The two places this page sends you carry the same feature art
            // as the cards on Home, so a destination looks like itself
            // wherever you reach it from.
            '<div class="stack" style="margin-top:12px">' +
              '<a class="artcard" href="/ranks" style="--art:url(\'/img/cards/ranks.webp\')">' +
                '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
                '<span class="artcard__body">' +
                  '<span class="artcard__eyebrow">Rankings</span>' +
                  '<span class="artcard__title">See where you stand →</span>' +
                  '<span class="artcard__sub">Where you place on every board</span>' +
                '</span></a>' +
              '<a class="artcard" href="/training" style="--art:url(\'/img/cards/training.webp\')">' +
                '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
                '<span class="artcard__body">' +
                  '<span class="artcard__eyebrow">Continue training</span>' +
                  '<span class="artcard__title">Train now →</span>' +
                  '<span class="artcard__sub">' +
                    (ts.total_lessons ? ((ts.total_lessons - (ts.lessons_completed || 0)) + ' lessons left') : 'Browse all lessons') +
                  '</span>' +
                '</span></a>' +
              '<a class="artcard" href="/lounge" style="--art:url(\'/img/cards/lounge.webp\')">' +
                '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
                '<span class="artcard__body">' +
                  '<span class="artcard__eyebrow">Players Lounge</span>' +
                  '<span class="artcard__title">New videos →</span>' +
                  '<span class="artcard__sub" id="loungeSub">The newest disc golf videos, daily</span>' +
                '</span></a>' +
            '</div>' +
          '</div>' +

          '<div>' +
            '<p class="section-label">Account</p>' +
            '<div class="rows">' +
              '<a class="row" href="/settings"><span class="row__glyph">⚙</span><div class="row__body"><div class="row__title">Account &amp; settings</div></div><span class="row__meta">›</span></a>' +
              // "Inventory" is RPG-era and there is none: the vault's two tabs are My
              // Library (lessons) and Creators (their videos). The glyph follows the
              // tab bar's film clapper for the same reason the tab stopped being a
              // diamond — the vault holds videos.
              '<a class="row" href="/vault"><span class="row__glyph">🎬</span><div class="row__body"><div class="row__title">Vault &amp; creators</div></div><span class="row__meta">›</span></a>' +
              '<a class="row" href="/delete-account"><span class="row__glyph">⊘</span><div class="row__body"><div class="row__title">Delete account</div></div><span class="row__meta">›</span></a>' +
            '</div>' +
          '</div>';

        DGG.loungeSub();   // name the newest upload on the lounge card
      }).catch(function (e) {
        content.className = 'screen'; content.innerHTML = '<div class="error">' + esc(e.message || 'Could not load profile') + '</div>';
      });
    })();
  </script>
</body>
</html>
