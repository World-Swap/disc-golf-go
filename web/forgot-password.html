<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Reset Password · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w16" />
</head>
<body>
  <main class="app">
    <div class="auth">
      <h1 class="h-display">RESET<span class="mark" style="width:40%"></span></h1>
      <p class="caption" style="margin:16px 0 32px">We'll email you a reset link</p>
      <div class="error" id="err"></div>
      <div id="done" hidden><div class="card"><p style="font-family:var(--font-mono);font-size:12px;color:var(--color-frost);line-height:1.5">If an account exists for that email, a reset link is on its way.</p></div></div>
      <form id="form">
        <label class="field"><span class="field__label">Email</span>
          <input class="input" type="email" name="email" required placeholder="you@email.com" /></label>
        <button class="btn btn--block" id="submit">Send Reset Link</button>
      </form>
      <p class="formnote"><a href="/login">Back to log in</a></p>
    </div>
  </main>
  <script src="/js/app.js?v=w12"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = document.getElementById('err'); err.textContent = '';
      var btn = document.getElementById('submit'); btn.disabled = true; btn.textContent = 'Sending…';
      try {
        await DGG.API.post('/auth/forgot-password', { email: new FormData(this).get('email') });
        this.hidden = true; document.getElementById('done').hidden = false;
      } catch (ex) { err.textContent = ex.message || 'Something went wrong'; btn.disabled = false; btn.textContent = 'Send Reset Link'; }
    });
  </script>
</body>
</html>
