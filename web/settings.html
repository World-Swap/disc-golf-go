<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Settings · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w15" />
  <style>
    .toggle { width:44px; height:24px; border:1px solid var(--hair-strong); border-radius:12px; position:relative; flex:none; background:var(--color-void); transition:border-color 120ms,background 120ms; }
    .toggle::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--color-ash); transition:transform 140ms,background 140ms; }
    .toggle[aria-pressed="true"] { background:var(--color-bone); border-color:var(--color-bone); }
    .toggle[aria-pressed="true"]::after { transform:translateX(20px); background:var(--color-void); }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><a class="topbar__title" href="/profile">‹ Profile</a><span class="pill" id="saved" hidden>Saved</span></header>
    <div class="screen stack">
      <div><h1 class="h-title">Account</h1></div>
      <div id="account" class="loading">Loading…</div>
      <div><h1 class="h-title" style="margin-top:8px">Notifications</h1></div>
      <div id="content" class="loading">Loading…</div>
    </div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('profile');
      var esc = DGG.esc, API = DGG.API;
      var content = document.getElementById('content');
      var saved = document.getElementById('saved');
      var TOGGLES = [
        ['tips_enabled', 'Daily training tips'],
        ['reminders_enabled', 'Training reminders'],
        ['mission_alerts_enabled', 'Mission alerts'],
        ['achievement_alerts_enabled', 'Achievement alerts'],
        ['push_enabled', 'Push notifications'],
      ];
      var FREQ = ['daily', 'every_2_days', 'weekly'];

      function flash() { saved.hidden = false; clearTimeout(flash.t); flash.t = setTimeout(function () { saved.hidden = true; }, 1200); }
      async function save(patch) { try { await API.put('/training/notifications/settings', patch); flash(); } catch (e) {} }

      // ── Profile photo / club logo ──
      // The browser does the resizing. A phone camera photo is 3-5MB and 4000px
      // wide; what is wanted here is a 256px square, so it is drawn to a canvas
      // and re-encoded before it is ever sent. That keeps the request small,
      // keeps the stored row to tens of kilobytes, and means the server never
      // has to decode an arbitrary image to find out how big it is.
      var PHOTO_PX = 256;

      function photoBlock(p) {
        var src = p.profile_photo_url || '';
        return '<div class="pf">' +
            '<div class="pf__shot" id="pfShot">' +
              (src ? '<img src="' + esc(src) + '" alt="" />' : '<span class="pf__empty">No photo</span>') +
            '</div>' +
            '<div class="pf__side">' +
              '<div class="field__label">Photo or logo</div>' +
              '<div class="pf__btns">' +
                '<button class="btn btn--ghost btn--sm" id="pfPick" type="button">Choose image</button>' +
                '<button class="btn btn--ghost btn--sm" id="pfClear" type="button"' + (src ? '' : ' hidden') + '>Remove</button>' +
              '</div>' +
              '<p class="pf__hint" id="pfHint">Square works best. PNG, JPEG or WebP.</p>' +
            '</div>' +
            '<input type="file" id="pfFile" accept="image/png,image/jpeg,image/webp" hidden />' +
          '</div>';
      }

      // Draw the image into a square canvas, cropping the long side from the
      // CENTRE rather than squashing it -- a stretched logo looks broken in a
      // way a cropped one does not.
      function squareDataUrl(file) {
        return new Promise(function (resolve, reject) {
          var img = new Image();
          var url = URL.createObjectURL(file);
          img.onload = function () {
            URL.revokeObjectURL(url);
            var side = Math.min(img.width, img.height);
            var c = document.createElement('canvas');
            c.width = c.height = PHOTO_PX;
            var g = c.getContext('2d');
            g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, PHOTO_PX, PHOTO_PX);
            // WebP where it is supported, JPEG otherwise. toDataURL returns a
            // PNG when it does not recognise the type, so the result is checked
            // rather than assumed -- a 256px PNG is ~4x the bytes of the WebP.
            var out = c.toDataURL('image/webp', 0.85);
            if (out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/jpeg', 0.85);
            resolve(out);
          };
          img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That file is not an image we can read')); };
          img.src = url;
        });
      }

      function wirePhoto(p) {
        var file = document.getElementById('pfFile'), shot = document.getElementById('pfShot');
        var hint = document.getElementById('pfHint'), clear = document.getElementById('pfClear');
        document.getElementById('pfPick').addEventListener('click', function () { file.click(); });

        file.addEventListener('change', async function () {
          var f = this.files && this.files[0];
          this.value = '';            // so picking the same file twice still fires
          if (!f) return;
          hint.textContent = 'Preparing…';
          try {
            var data = await squareDataUrl(f);
            hint.textContent = 'Uploading…';
            var res = await API.post('/players/me/photo', { image: data });
            // The returned URL carries the save time, so this cannot show a
            // cached copy of the photo being replaced.
            shot.innerHTML = '<img src="' + esc(res.profile_photo_url) + '" alt="" />';
            p.profile_photo_url = res.profile_photo_url;
            clear.hidden = false;
            hint.textContent = 'Saved';
            flash();
          } catch (e) {
            hint.textContent = e.message || 'That image could not be saved';
          }
        });

        clear.addEventListener('click', async function () {
          hint.textContent = 'Removing…';
          try {
            await API.del('/players/me/photo');
            shot.innerHTML = '<span class="pf__empty">No photo</span>';
            p.profile_photo_url = null;
            clear.hidden = true;
            hint.textContent = 'Square works best. PNG, JPEG or WebP.';
            flash();
          } catch (e) { hint.textContent = e.message || 'Could not remove that'; }
        });
      }

      // ── Account: edit display name + username ──
      var account = document.getElementById('account');
      API.get('/players/me').then(function (p) {
        account.className = 'card';
        account.innerHTML =
          photoBlock(p) +
          // One name, not two. There was a Display name AND a Username here,
          // which meant maintaining two of them and deciding which one a board
          // should show. The username IS the name now; the server keeps the
          // display_name column in step with it, because 30-odd files read that
          // column and none of them should have to care.
          '<label class="field"><span class="field__label">Username</span>' +
            '<input class="input" id="un" maxlength="20" autocapitalize="none" autocomplete="off" value="' + esc(p.username || '') + '" placeholder="skyhyzer" /></label>' +
          '<p class="field__label" style="font-weight:400;color:var(--color-ash);margin:-8px 0 12px">3–20 characters · letters, numbers, underscores</p>' +
          '<div id="acctMsg" class="error" hidden style="margin-bottom:12px"></div>' +
          '<button class="btn btn--block" id="acctSave">Save changes</button>';

        wirePhoto(p);
        var un = document.getElementById('un');
        var msg = document.getElementById('acctMsg'), btn = document.getElementById('acctSave');
        function showErr(t) { msg.textContent = t; msg.hidden = false; }
        btn.addEventListener('click', async function () {
          msg.hidden = true;
          var user = un.value.trim();
          if (!/^[a-zA-Z0-9_]{3,20}$/.test(user)) return showErr('Username must be 3–20 characters: letters, numbers, underscores only.');
          if (user.toLowerCase() === (p.username || '')) { flash(); return; }
          btn.disabled = true; btn.textContent = 'Saving…';
          try {
            var updated = await API.put('/players/me', { username: user });
            p.display_name = updated.display_name; p.username = updated.username;
            un.value = updated.username || user;
            flash();
          } catch (e) {
            showErr(e.status === 409 ? 'That username is already taken.' : (e.message || 'Could not save.'));
          } finally { btn.disabled = false; btn.textContent = 'Save changes'; }
        });
      }).catch(function (e) { account.className = 'screen'; account.innerHTML = '<div class="error">' + esc(e.message || 'Error') + '</div>'; });

      API.get('/training/notifications/settings').then(function (s) {
        content.className = 'stack';
        var rows = TOGGLES.map(function (t) {
          return '<div class="row"><div class="row__body"><div class="row__title">' + esc(t[1]) + '</div></div>' +
            '<button class="toggle" data-key="' + t[0] + '" aria-pressed="' + (s[t[0]] ? 'true' : 'false') + '"></button></div>';
        }).join('');
        content.innerHTML =
          '<div class="rows">' + rows + '</div>' +
          '<div><p class="section-label">Tip frequency</p><div class="segbar" id="freq">' +
            FREQ.map(function (f) { return '<button class="seg" data-freq="' + f + '" aria-selected="' + (s.tips_frequency === f ? 'true' : 'false') + '">' + f.replace(/_/g, ' ') + '</button>'; }).join('') +
          '</div></div>' +
          // The way to report a bug. The endpoint existed for months with no
          // caller anywhere in web/, so there was no way to file one from the
          // app at all.
          // Report a problem, and the privacy policy. The policy page has
          // existed all along and NOTHING in the app linked to it -- it was
          // reachable only from the marketing site's footer, so a player inside
          // the app had no way to read what is collected about them. Settings is
          // where someone looks for it.
          '<div class="rows">' +
            '<a class="row" href="/feedback">' +
              '<div class="row__body"><div class="row__title">Report a problem →</div>' +
              '<div class="row__sub">Bugs, suggestions, anything that looks wrong</div></div></a>' +
            '<a class="row" href="/privacy">' +
              '<div class="row__body"><div class="row__title">Privacy policy →</div>' +
              '<div class="row__sub">What we collect, and the choices you have</div></div></a>' +
          '</div>';

        content.querySelectorAll('.toggle').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var on = this.getAttribute('aria-pressed') !== 'true';
            this.setAttribute('aria-pressed', on ? 'true' : 'false');
            var patch = {}; patch[this.getAttribute('data-key')] = on; save(patch);
          });
        });
        document.getElementById('freq').addEventListener('click', function (e) {
          var b = e.target.closest('.seg'); if (!b) return;
          [].forEach.call(this.children, function (c) { c.setAttribute('aria-selected', c === b ? 'true' : 'false'); });
          save({ tips_frequency: b.getAttribute('data-freq') });
        });
      }).catch(function (e) { content.className = 'screen'; content.innerHTML = '<div class="error">' + esc(e.message || 'Error') + '</div>'; });
    })();
  </script>
</body>
</html>
