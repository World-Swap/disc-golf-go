<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Courses · Disc Golf Go</title>
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/app.css" />
  <link rel="stylesheet" href="/styles/app-ui.css" />
</head>
<body>
  <main class="app">
    <header class="topbar"><span class="topbar__title">Courses</span><span class="pill" id="count">—</span></header>
    <div class="screen stack">
      <div><h1 class="h-display">COURS<br />ES<span class="mark" style="width:34%"></span></h1></div>
      <input class="input" id="search" type="search" placeholder="Search course, city, or state…" autocomplete="off" />
      <div id="list" class="loading">Loading…</div>
    </div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('play');
      var esc = DGG.esc, API = DGG.API;
      var list = document.getElementById('list'), count = document.getElementById('count');
      var timer = null;

      async function load(search) {
        try {
          var d = await API.get('/courses?limit=100' + (search ? '&search=' + encodeURIComponent(search) : ''));
          var courses = d.courses || [];
          count.textContent = courses.length + (courses.length === 100 ? '+' : '');
          list.className = '';
          if (!courses.length) { list.innerHTML = '<div class="loading">No courses found</div>'; return; }
          list.innerHTML = '<div class="rows">' + courses.map(function (c) {
            var rating = c.pdga_rating || c.dgcoursereview_rating;
            return '<div class="row"><span class="row__glyph">◎</span>' +
              '<div class="row__body"><div class="row__title">' + esc(c.name) + '</div>' +
              '<div class="row__sub">' + esc([c.city, c.state].filter(Boolean).join(', ')) + (c.holes ? ' · ' + c.holes + ' holes' : '') + '</div></div>' +
              (rating ? '<span class="row__meta">' + esc(rating) + '★</span>' : '') + '</div>';
          }).join('') + '</div>';
        } catch (e) { list.className = 'screen'; list.innerHTML = '<div class="error">' + esc(e.message || 'Could not load courses') + '</div>'; }
      }

      document.getElementById('search').addEventListener('input', function () {
        var v = this.value.trim();
        clearTimeout(timer);
        timer = setTimeout(function () { load(v); }, 250);
      });
      load('');
    })();
  </script>
</body>
</html>
