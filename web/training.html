<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Training · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w15" />
  <style>
    /* Same video row as the Players Lounge: 16:9 thumbnail, wrapping title.
       This block must sit AFTER app-ui.css -- .row__title there is nowrap +
       ellipsis, and a video's title is the whole reason to press it. */
    .vthumb { flex: none; width: 80px; height: 45px; border-radius: 4px;
              object-fit: cover; background: #e8e2d8; margin-right: 12px; }
    .vrow .row__title { white-space: normal; overflow: visible; text-overflow: clip;
                        line-height: 1.25; }

    /* The written lesson body. Prose, so it is set at a size somebody can
       actually read a paragraph in -- NOT the mono 12px the generic
       content_body `sections` branch uses, which is small print. */
    .lb { margin: 0 0 6px; font-size: 15px; line-height: 1.65; color: var(--color-ink); }
    .lb--why { font-size: 16px; }
    .lsteps { margin: 0; padding: 0; list-style: none; counter-reset: lstep; }
    .lsteps li { position: relative; counter-increment: lstep; padding: 0 0 12px 32px;
                 font-size: 15px; line-height: 1.6; color: var(--color-ink); }
    .lsteps li:last-child { padding-bottom: 0; }
    .lsteps li::before { content: counter(lstep); position: absolute; left: 0; top: 1px;
                         width: 22px; height: 22px; border-radius: 50%;
                         background: var(--color-orange); color: #fff;
                         font-size: 12px; font-weight: 700; line-height: 22px;
                         text-align: center; }
    .lfault { display: flex; gap: 10px; padding: 12px 0;
              border-top: 1px solid var(--color-hairline); }
    .lfault:first-child { border-top: 0; padding-top: 0; }
    .lfault__x { flex: none; width: 18px; font-weight: 700; color: var(--color-orange);
                 line-height: 1.55; }
    .lfault__t { margin: 0; font-size: 15px; line-height: 1.55; color: var(--color-ink);
                 font-weight: 600; }
    .lfault__f { margin: 4px 0 0; font-size: 14px; line-height: 1.55;
                 color: var(--color-ash); }
    .ldrill { border: 1px solid var(--color-orange); }
    /* Uploads from the channels, kept visually apart from coached lessons.
       Lighter, flatter and without the XP/difficulty line a lesson row carries:
       the point is that it does not read as one. */
    .upnote { margin: 0 0 10px; font-size: 13px; line-height: 1.55; color: var(--color-ash); }
    .uprow { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0;
             border-top: 1px solid var(--color-hairline); text-decoration: none; }
    .uprow:first-of-type { border-top: 0; }
    .uprow__glyph { flex: none; width: 22px; font-size: 15px; line-height: 1.4;
                    color: var(--color-ash); }
    .uprow__body { min-width: 0; flex: 1; }
    /* The same inline-span trap as the article preview card, walked into again
       one commit later: .uprow__body is a flex ITEM, not a flex container, so
       the title and channel inside it stay inline and run together as
       "…In Disc GolfLatitude 64". Flex blockifies children, not grandchildren. */
    .uprow__title, .uprow__sub { display: block; }
    .uprow__title { margin: 0 0 2px; font-size: 15px; line-height: 1.35;
                    color: var(--color-ink); overflow-wrap: anywhere; }
    .uprow__sub { margin: 0; font-size: 12px; line-height: 1.45; color: var(--color-ash); }
    .uprow__meta { flex: none; color: var(--color-ash); }

    /* The banner at the top of an upload's own page. */
    .upbanner { margin: 0 0 4px; padding: 12px 14px; border-radius: 10px;
                background: var(--color-peach); }
    .upbanner__t { margin: 0 0 4px; font-size: 13px; font-weight: 700;
                   color: var(--color-ink); }
    .upbanner__d { margin: 0; font-size: 13px; line-height: 1.55; color: var(--color-ash); }

    .ldrill__reps { display: inline-block; margin: 0 0 10px; padding: 4px 10px;
                    border-radius: 999px; background: var(--color-orange); color: #fff;
                    font-size: 12px; font-weight: 700; line-height: 1.4; }

    /* Article link preview. The article stays a LINK -- this card shows the
       publisher's own title and description so a reader can tell whether it is
       worth the tap, which the old one-line row could not.
       There is deliberately no publisher image: see
       scripts/fetch-article-previews.js. The square is our own mark, built
       from the site's initial, so the card has the shape of a preview without
       hotlinking anybody's artwork or making the player's browser call them. */
    .lprev { display: flex; gap: 12px; align-items: flex-start; width: 100%;
             padding: 14px; margin-bottom: 10px; text-decoration: none;
             border: 1px solid var(--color-hairline); border-radius: 10px;
             background: var(--color-white); }
    .lprev:last-child { margin-bottom: 0; }
    .lprev:hover, .lprev:focus-visible { border-color: var(--color-orange); }
    .lprev__mark { flex: none; width: 44px; height: 44px; border-radius: 8px;
                   background: var(--color-peach); color: var(--color-orange);
                   font-size: 18px; font-weight: 800; line-height: 44px;
                   text-align: center; text-transform: uppercase; }
    .lprev__body { min-width: 0; flex: 1; }
    /* display:block is load-bearing: these are spans inside an <a>, and inline
       elements ignore the margins below, which ran every line together. */
    .lprev__site, .lprev__title, .lprev__desc, .lprev__go { display: block; }
    .lprev__site { margin: 0 0 3px; font-size: 11px; font-weight: 700;
                   letter-spacing: .04em; text-transform: uppercase;
                   color: var(--color-ash); }
    .lprev__title { margin: 0 0 4px; font-size: 15px; font-weight: 700;
                    line-height: 1.3; color: var(--color-ink);
                    overflow-wrap: anywhere; }
    .lprev__desc { margin: 0 0 6px; font-size: 13px; line-height: 1.5;
                   color: var(--color-ash); overflow-wrap: anywhere; }
    .lprev__go { margin: 0; font-size: 12px; font-weight: 700;
                 color: var(--color-orange); overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title" id="crumb">Training</span>
      <a class="pill" href="/training" id="hubLink" hidden>All lessons</a>
    </header>
    <div id="content" class="loading">Loading…</div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('training');
      var esc = DGG.esc, API = DGG.API;
      var content = document.getElementById('content');
      var crumb = document.getElementById('crumb');
      var hubLink = document.getElementById('hubLink');

      function meter(pct) { return '<div class="meter"><div class="meter__fill" style="width:' + Math.max(0, Math.min(100, pct)) + '%"></div></div>'; }
      function q(name) { return new URLSearchParams(location.search).get(name); }
      function go(params) { location.href = '/training' + (params ? '?' + params : ''); }
      function fail(e) { content.className = 'screen'; content.innerHTML = '<div class="error">' + esc(e.message || 'Error') + '</div>'; }

      // ── Hub: categories + recommended lesson ──
      async function renderHub() {
        crumb.textContent = 'Training'; hubLink.hidden = true;
        var data = await API.get('/training/categories');

        // The path REPLACES the old recommendation card, which ran off XP tier
        // and completion order -- one rigid line through the library that sent
        // a 400ft driver who three-putts to Grip Basics. It sits above the
        // categories rather than instead of them: all thirteen stay browsable
        // underneath, because a path is a suggestion and not a cage.
        var pathWrap = '';
        try {
          var P = await API.get('/training/path');
          pathWrap = P.needs_assessment ? askCard() : pathBlock(P);
        } catch (e) {}

        var cats = (data.categories || []).map(function (c) {
          var pct = c.lesson_count ? Math.round((c.completed_count / c.lesson_count) * 100) : 0;
          // Each category carries its own feature art (scripts/generate-category-art.js).
          // The meter sits outside the artcard because .artcard is an <a> whose
          // body is spans, and the meter is a div.
          return '<div>' +
            '<a class="artcard" href="/training?cat=' + esc(c.slug) + '"' +
              ' style="--art:url(\'/img/cards/cat/' + esc(c.slug) + '.webp\')">' +
              '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
              '<span class="artcard__body">' +
                '<span class="artcard__eyebrow">' +
                  (c.completed_count || 0) + ' / ' + (c.lesson_count || 0) + ' lessons' +
                  // Counted and named separately. Rolled into the lesson total
                  // this overstated the library and left every category looking
                  // permanently unfinished, because uploads keep arriving.
                  (c.video_count ? ' \u00b7 ' + c.video_count + ' videos' : '') + '</span>' +
                '<span class="artcard__title">' + esc(c.name) + '\u00a0\u2192</span>' +
              '</span>' +
              '<span class="artcard__meta">' + pct + '%</span></a>' +
            '<div style="height:10px"></div>' + meter(pct) + '</div>';
        }).join('');

        content.className = 'screen stack';
        content.innerHTML =
          '<div><p class="section-label">Skill up</p><h1 class="h-display">TRAIN<span class="mark" style="width:44%"></span></h1></div>' +
          pathWrap +
          // The categories come FIRST. They are the curated path of
          // progression the app is selling; the fresh channel uploads are a
          // nice-to-have beside them, so they sit underneath rather than
          // pushing the library below the fold.
          '<div><p class="section-label">Categories</p><div class="stack">' + cats + '</div></div>' +
          '<div id="fresh"></div>';
        loadFresh();
      }

      // Shown until a player has answered the four questions. An artcard, not
      // a quiet row: this is the single thing on the page most worth pressing
      // for someone who has not done it, and the card treatment is what the
      // app uses for "press me".
      function askCard() {
        return '<a class="artcard" href="/assessment?from=training"' +
            ' style="--art:url(\'/img/cards/training.webp\')">' +
          '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
          '<span class="artcard__body">' +
            '<span class="artcard__eyebrow">4 questions</span>' +
            '<span class="artcard__title">Build your path\u00a0→</span>' +
            '<span class="artcard__sub">Tell us where you are and what is costing you ' +
              'strokes, and we will put the lessons in order.</span>' +
          '</span></a>';
      }

      function lessonRow(l) {
        // A path lesson carries the REASON it was picked. Without it the list
        // is indistinguishable from any other list of lessons, and the whole
        // point is that these were chosen for this player.
        var href = l.id ? '/training?cat=' + esc(l.category_slug) + '&lesson=' + l.id
                        : '/training?cat=' + esc(l.category_slug);
        return '<a class="row" href="' + href + '" style="text-decoration:none">' +
          '<span class="row__glyph">' + esc(l.category_icon || '▸') + '</span>' +
          '<div class="row__body">' +
            '<div class="row__title">' + esc(l.title) + '</div>' +
            '<div class="row__sub">' + esc(l.reason || l.category_name) + '</div>' +
          '</div>' +
          '<span class="row__meta">+' + (l.xp_reward || 0) + '</span></a>';
      }

      function pathBlock(P) {
        // Finishing all 134 is the honest empty case, and it is a result rather
        // than a bug: say so and send them somewhere, instead of rendering an
        // empty box under a heading that promises lessons.
        if (P.library_complete) {
          return '<div class="card">' +
            '<p class="card__eyebrow">Your path</p>' +
            '<div class="row__title" style="white-space:normal;margin-top:6px">' +
              'You have finished every lesson in the library.</div>' +
            '<div class="row__sub">All 134 of them. New lessons land here when they ship — ' +
              'until then, the newest coaching videos are below.</div>' +
            '</div>';
        }

        var chips = (P.focus || []).map(function (f) {
          return '<a class="pill" href="/training?cat=' + esc(f.slug) + '"' +
            ' style="text-decoration:none">' + esc(f.name) + '</a>';
        }).join('');

        return '<div>' +
            '<div class="meter-row">' +
              '<p class="section-label" style="margin:0">Your path</p>' +
              '<a class="caption" href="/assessment?from=training">Retake</a>' +
            '</div>' +
            (chips ? '<div class="chips" style="margin-bottom:12px">' + chips + '</div>' : '') +
            '<div class="rows">' + P.lessons.map(lessonRow).join('') + '</div>' +
          '</div>' +
          tournamentBlock(P.tournament);
      }

      // Only for a player who said they are signed up for an event. Everyone
      // else never sees competition content they did not ask for.
      function tournamentBlock(t) {
        if (!t || !t.weeks || !t.weeks.length) return '';
        var days = t.days_away === 0 ? 'Today' :
                   t.days_away === 1 ? 'Tomorrow' : t.days_away + ' days away';
        return '<div>' +
          '<div class="meter-row">' +
            '<p class="section-label" style="margin:0">' + esc(t.event) + '</p>' +
            '<span class="caption">' + esc(days) + '</span>' +
          '</div>' +
          t.weeks.map(function (w) {
            return '<p class="caption" style="margin:12px 0 6px">' + esc(w.label) + '</p>' +
              '<div class="rows">' + w.lessons.map(lessonRow).join('') + '</div>';
          }).join('') +
          '</div>';
      }

      // ── New training videos ──
      // Fresh instruction pulled from the coaching channels, as opposed to the
      // library below it, which is curated lesson by lesson. Only uploads that
      // pass the instructional filter reach this list -- the rounds, reviews
      // and vlogs from the same channels go to the Players Lounge instead.
      //
      // It loads after the hub is already on screen: this is a nice-to-have
      // beside the lessons, and it must never delay them or break the page if
      // the feed is empty.
      function when(iso) {
        var d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
        if (!isFinite(d)) return '';
        return d <= 0 ? 'today' : d === 1 ? 'yesterday'
             : d < 7 ? d + ' days ago'
             : d < 30 ? Math.floor(d / 7) + 'w ago' : Math.floor(d / 30) + 'mo ago';
      }

      async function loadFresh() {
        var host = document.getElementById('fresh');
        if (!host) return;
        var d;
        try { d = await API.get('/videos/teaching'); } catch (e) { return; }
        var vids = d.videos || [];
        if (!vids.length) return;

        var SHOWN = 5;
        function row(v) {
          return '<a class="row vrow" href="' + esc(v.url) + '" target="_blank" rel="noopener">' +
            '<img class="vthumb" src="' + esc(v.thumbnail) + '" alt="" loading="lazy" width="80" height="45">' +
            '<div class="row__body"><div class="row__title">' + esc(v.title) + '</div>' +
            '<div class="row__sub" style="text-transform:none;letter-spacing:0">' +
              esc(v.channel_name) + ' \u00b7 ' + when(v.published_at) + '</div></div></a>';
        }
        function paint(all) {
          host.innerHTML = '<p class="section-label">New training videos</p>' +
            '<div class="rows">' + (all ? vids : vids.slice(0, SHOWN)).map(row).join('') + '</div>' +
            (!all && vids.length > SHOWN
              ? '<button class="btn btn--ghost btn--block" id="moreFresh" style="margin-top:8px">' +
                'Show ' + (vids.length - SHOWN) + ' more</button>'
              : '');
          var b = document.getElementById('moreFresh');
          if (b) b.addEventListener('click', function () { paint(true); });
        }
        paint(false);
      }

      // ── Category: lessons list ──
      async function renderCategory(slug) {
        var data = await API.get('/training/categories/' + encodeURIComponent(slug) + '/lessons');
        crumb.textContent = data.category.name; hubLink.hidden = false;
        var all = data.lessons || [];
        // A generated row is a channel's recent upload, filed by what its title
        // names. Nobody has watched it and nothing is written about it, so it
        // goes in its own block rather than in the lesson list -- in the same
        // list it reads as a coached lesson, which is the thing it is not.
        var lessons = all.filter(function (l) { return !l.is_generated; });
        var uploads = all.filter(function (l) { return l.is_generated; });

        var rows = lessons.map(function (l) {
          return '<a class="row" href="/training?cat=' + esc(slug) + '&lesson=' + l.id + '">' +
            '<span class="row__glyph">' + (l.completed ? '✓' : '▷') + '</span>' +
            '<div class="row__body"><div class="row__title">' + esc(l.title) + '</div>' +
            '<div class="row__sub">' + esc(l.difficulty || '') + ' · +' + (l.xp_reward || 0) + ' XP</div></div>' +
            (l.completed ? '<span class="pill pill--done">Done</span>' : '<span class="row__meta">›</span>') + '</a>';
        }).join('');

        // No difficulty and no XP on these rows: a difficulty nothing graded is
        // a false badge, and leading with the reward frames an upload as a
        // thing to tick off. The channel is the useful fact, so it leads.
        var ups = uploads.map(function (l) {
          return '<a class="uprow" href="/training?cat=' + esc(slug) + '&lesson=' + l.id + '">' +
            '<span class="uprow__glyph" aria-hidden="true">▶</span>' +
            '<span class="uprow__body">' +
              '<span class="uprow__title">' + esc(l.title) + '</span>' +
              '<span class="uprow__sub">' + esc(l.youtube_channel || 'Channel upload') +
              (l.completed ? ' · watched' : '') + '</span>' +
            '</span><span class="uprow__meta">›</span></a>';
        }).join('');

        content.className = 'screen stack';
        content.innerHTML =
          '<div><p class="section-label">' + esc(data.category.skill_level || 'Category') + '</p>' +
          '<h1 class="h-title">' + esc(data.category.name) + '</h1></div>' +
          '<div class="rows">' + rows + '</div>' +
          (uploads.length
            ? '<div><p class="section-label">From the channels</p>' +
              '<p class="upnote">Recent uploads from the channels this library draws on, filed by topic. ' +
              'Nobody here has watched them, so they come with no notes or drills \u2014 they are not coached lessons.</p>' +
              '<div class="card">' + ups + '</div></div>'
            : '') +
          shareRow('Share these lessons', slug, null);
        wireShare();
      }

      // Shares the PUBLIC page on discgolfgo.com, never this one. A friend who
      // taps a /training link lands on a login wall; the .com library is free
      // and needs no account, so it is the only link worth sending.
      function shareRow(label, categorySlug, lessonSlug) {
        return '<p style="text-align:center;margin:4px 0 0">' +
          '<button class="btn btn--ghost" id="shareBtn" type="button" ' +
          'data-cat="' + esc(categorySlug) + '"' +
          (lessonSlug ? ' data-lesson="' + esc(lessonSlug) + '"' : '') +
          '>' + esc(label) + '</button></p>';
      }

      function wireShare() {
        var btn = document.getElementById('shareBtn'); if (!btn) return;
        btn.addEventListener('click', function () {
          DGG.share({
            url: DGG.learnUrl(btn.getAttribute('data-cat'), btn.getAttribute('data-lesson')),
            title: 'Disc Golf Go',
            text: 'Free disc golf lessons, no signup needed.',
            btn: btn
          });
        });
      }

      // ── Lesson: content + complete ──
      async function renderLesson(slug, id) {
        var l = await API.get('/training/lessons/' + encodeURIComponent(id));
        crumb.textContent = l.category_name || 'Lesson'; hubLink.hidden = false;
        content.className = 'screen stack';
        // An upload reached directly -- from a search, a share, or the block at
        // the foot of a category -- has to say what it is on its own page too.
        // Separating them in the list is no use if the page they lead to is
        // dressed as a lesson.
        var gen = !!l.generated_from_video;
        content.innerHTML =
          '<div><p class="section-label">' + esc(l.category_name || '') +
            (gen ? ' · from the channels' : ' · +' + (l.xp_reward || 0) + ' XP') + '</p>' +
          '<h1 class="h-title">' + esc(l.title) + '</h1></div>' +
          (gen
            ? '<div class="upbanner"><p class="upbanner__t">A channel upload, not a coached lesson</p>' +
              '<p class="upbanner__d">' +
              esc(l.youtube_channel ? 'Posted by ' + l.youtube_channel + '. ' : '') +
              'We file recent uploads from the channels this library draws on by what their titles cover. ' +
              'Nobody here has watched this one, so there are no notes or drills with it.</p></div>'
            : (l.description ? '<p style="font-size:14px;line-height:1.55;color:var(--color-ash)">' + esc(l.description) + '</p>' : '')) +
          videoPane(l) +
          renderContent(l) +
          '<div id="resources"></div>' +
          '<div id="cta"></div>' +
          (l.slug ? shareRow('Share this lesson', l.category_slug || slug, l.slug) : '');
        loadResources(id);
        wireVideo(id);
        wireShare();
        engage(id, 'opened');
        wireEngagement(id);
        var cta = document.getElementById('cta');
        if (l.is_completed) {
          cta.innerHTML = '<div class="pill pill--done" style="width:100%;justify-content:center;padding:12px">Completed ✓</div>' +
            (l.next_lesson ? '<a class="btn btn--ghost btn--block" style="margin-top:12px" href="/training?cat=' + esc(slug) + '&lesson=' + l.next_lesson.id + '">Next lesson →</a>' : '');
        } else {
          cta.innerHTML = '<button class="btn btn--block" id="done">Mark Complete · +' + (l.xp_reward || 0) + ' XP</button>';
          document.getElementById('done').addEventListener('click', async function () {
            var b = this; b.disabled = true; b.textContent = 'Saving…';
            try {
              var r = await API.post('/training/completions', { lesson_id: Number(id) });
              var bonus = r.bonus_xp ? ' (+' + r.bonus_xp + ' bonus)' : '';
              b.className = 'pill pill--done'; b.style.width = '100%'; b.style.justifyContent = 'center'; b.style.padding = '12px';
              b.textContent = '+' + (r.xp_awarded || 0) + ' XP' + bonus + ' · Done ✓';
              if (l.next_lesson) cta.insertAdjacentHTML('beforeend', '<a class="btn btn--ghost btn--block" style="margin-top:12px" href="/training?cat=' + esc(slug) + '&lesson=' + l.next_lesson.id + '">Next lesson →</a>');
            } catch (ex) {
              b.disabled = false;
              b.textContent = 'Mark Complete · +' + (l.xp_reward || 0) + ' XP';
              // The server says WHY and, when it is only a matter of waiting,
              // how long. Showing that beats a bare "Retry" the player cannot act on.
              var msg = (ex && ex.data && ex.data.error) || (ex && ex.message) || 'Could not save that.';
              var note = document.getElementById('gate-note');
              if (!note) {
                note = document.createElement('p');
                note.id = 'gate-note';
                note.style.cssText = 'margin:10px 0 0;font-size:13px;line-height:1.5;color:var(--color-ash)';
                cta.appendChild(note);
              }
              note.textContent = msg;
            }
          });
        }
      }

      // A heading over a block of the written body.
      function lbHead(t) { return '<p class="section-label">' + esc(t) + '</p>'; }

      // The WRITTEN lesson: why it matters, the method, the faults, a drill with
      // a rep count. Rendered ahead of the generic shapes below because a lesson
      // that has one of these should never fall through to three bare tips --
      // which is what the whole library was until these were written.
      function renderWritten(cb) {
        var out = '';
        if (cb.why) out += lbHead('Why it matters') + '<p class="lb lb--why">' + esc(cb.why) + '</p>';
        if (Array.isArray(cb.how) && cb.how.length) {
          out += lbHead('How to do it') + '<ol class="lsteps">' +
            cb.how.map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('') + '</ol>';
        }
        if (Array.isArray(cb.wrong) && cb.wrong.length) {
          out += lbHead('What goes wrong') + '<div>' + cb.wrong.map(function (w) {
            return '<div class="lfault"><span class="lfault__x" aria-hidden="true">\u2715</span><div>' +
              '<p class="lfault__t">' + esc(w.fault) + '</p>' +
              '<p class="lfault__f">' + esc(w.fix) + '</p></div></div>';
          }).join('') + '</div>';
        }
        if (cb.drill && cb.drill.body) {
          out += lbHead('Drill' + (cb.drill.name ? ' \u00b7 ' + cb.drill.name : '')) +
            '<div class="card ldrill">' +
            (cb.drill.reps ? '<span class="ldrill__reps">' + esc(cb.drill.reps) + '</span>' : '') +
            '<p class="lb">' + esc(cb.drill.body) + '</p></div>';
        }
        // The three tips stay, as a recap to scan on the course rather than as
        // the lesson itself.
        if (Array.isArray(cb.tips) && cb.tips.length) {
          out += lbHead('Key points') + '<div class="rows">' + cb.tips.map(function (t) {
            return '<div class="row"><span class="row__glyph">\u25b8</span><div class="row__body"><div class="row__sub" style="text-transform:none;letter-spacing:0;font-size:15px;line-height:1.5;color:var(--color-ink)">' + esc(t) + '</div></div></div>';
          }).join('') + '</div>';
        }
        return out;
      }

      // Basic content_body renderer (tip_card / guide / list / text).
      function renderContent(l) {
        var cb = l.content_body;
        if (!cb) return '';
        try { if (typeof cb === 'string') cb = JSON.parse(cb); } catch (e) { return '<div class="card"><p style="font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--color-frost)">' + esc(cb) + '</p></div>'; }
        if (cb.why || cb.drill || Array.isArray(cb.how)) return renderWritten(cb);
        var out = '';
        if (Array.isArray(cb.sections)) {
          out = cb.sections.map(function (s) {
            return '<div class="card">' + (s.heading ? '<div class="row__title" style="margin-bottom:8px">' + esc(s.heading) + '</div>' : '') +
              '<p style="font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--color-frost)">' + esc(s.body || s.text || '') + '</p></div>';
          }).join('<div style="height:14px"></div>');
        } else if (cb.body || cb.text) {
          out = '<div class="card"><p style="font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--color-frost)">' + esc(cb.body || cb.text) + '</p></div>';
        } else if (Array.isArray(cb.tips || cb.points)) {
          out = '<div class="rows">' + (cb.tips || cb.points).map(function (t) { return '<div class="row"><span class="row__glyph">▸</span><div class="row__body"><div class="row__sub" style="text-transform:none;letter-spacing:0;font-size:16px;line-height:1.5;color:var(--color-ink)">' + esc(t) + '</div></div></div>'; }).join('') + '</div>';
        }
        return out;
      }

      // Extract a YouTube video id from watch / youtu.be / embed URLs.
      function ytId(url) {
        if (!url) return '';
        var m = String(url).match(/(?:v=|youtu\.be\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
        return m ? m[1] : '';
      }

      // Inline video PREVIEW PANE — thumbnail + play button; taps to the player.
      function videoPane(l) {
        if (!l.youtube_url) return '';
        var id = ytId(l.youtube_url);
        var title = esc(l.youtube_title || l.title);
        var chan = esc(l.youtube_channel || 'YouTube');
        if (!id) {
          // No embeddable id (e.g. a channel link) — fall back to an open card.
          return '<a class="card card--tap" href="' + esc(l.youtube_url) + '" target="_blank" rel="noopener" style="display:block">' +
            '<p class="card__eyebrow">▶ Watch — pro instruction</p>' +
            '<div class="h-title" style="margin-top:8px">' + title + '</div>' +
            '<p class="row__sub" style="margin-top:8px;text-transform:none;letter-spacing:0">' + chan + ' ↗</p></a>';
        }
        var thumb = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
        return '<div class="vpane" id="vpane" data-id="' + id + '" role="button" tabindex="0" aria-label="Play video: ' + title + '">' +
            '<div class="vpane__thumb" style="background-image:url(' + thumb + ')">' +
              '<span class="vpane__play" aria-hidden="true">▶</span>' +
            '</div>' +
            '<div class="vpane__meta">' +
              '<div class="vpane__eyebrow">Pro instruction</div>' +
              '<div class="vpane__title">' + title + '</div>' +
              '<div class="vpane__chan">' + chan + '</div>' +
            '</div>' +
          '</div>';
      }

      // Swap the preview pane for the embedded player on tap.
      //
      // `lessonId` is passed in so the play itself reports engagement. It used
      // to rely on wireEngagement's delegated listener, which matches
      // `a[href],button` -- and the pane is a DIV carrying role="button", so the
      // match failed and watching the video registered NOTHING. The player was
      // then told to "watch the video or open one of the links first" by a page
      // whose video they were already watching.
      //
      // Reporting it here ties the signal to the event instead of to the markup
      // shape, so restyling the pane cannot silently break the gate again.
      function wireVideo(lessonId) {
        var p = document.getElementById('vpane');
        if (!p) return;
        var reported = false;
        function play() {
          var id = p.getAttribute('data-id');
          if (!reported) { reported = true; engage(lessonId, 'resource_opened', 'video'); }
          p.innerHTML = '<div class="vpane__frame"><iframe src="https://www.youtube.com/embed/' + id +
            '?autoplay=1&rel=0&playsinline=1" title="Lesson video" frameborder="0" ' +
            'allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
          p.classList.add('vpane--playing');
        }
        p.addEventListener('click', play);
        p.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } });
      }

      function resIcon(t) { return t === 'video' ? '▷' : (t === 'report' || t === 'study' || t === 'article' ? '▤' : '◆'); }

      // ── Engagement ──────────────────────────────────────────────────────
      // Completing a lesson requires having actually opened it and touched the
      // video or one of the links. These calls are what tell the server that
      // happened; the server keeps the clock, so nothing here claims a duration.
      // Fire-and-forget on purpose: a failed signal must never block the page.
      function engage(id, event, detail) {
        try {
          API.post('/training/lessons/' + encodeURIComponent(id) + '/engagement',
                   { event: event, detail: detail || null })['catch'](function () {});
        } catch (e) { /* never let a signal break the lesson */ }
      }

      // One delegated listener rather than per-element handlers, so links added
      // later by loadResources() are covered without re-wiring anything.
      function wireEngagement(id) {
        content.addEventListener('click', function (ev) {
          var a = ev.target && ev.target.closest && ev.target.closest('a[href],button');
          if (!a) return;
          var href = a.getAttribute('href') || '';
          // No #playvid exists any more; the embedded pane reports itself from
          // the wireVideo play handler. This still covers the fallback card, which
          // is a real <a> out to YouTube when a URL has no embeddable id.
          var isVideo = /youtube\.com|youtu\.be/.test(href);
          // Matched on data-resource, NOT on a CSS class. The previous version
          // tested `classList.contains('row')`, and the moment articles became
          // preview cards instead of rows it would have silently stopped
          // reporting -- stranding the completion gate exactly the way the
          // video pane did when it became a <div role="button">. The attribute
          // states intent, so restyling cannot break the signal again.
          var isResource = a.getAttribute && a.getAttribute('data-resource') !== null;
          if (isVideo) engage(id, 'resource_opened', 'video');
          else if (isResource) engage(id, 'resource_opened', href.slice(0, 200));
        });
      }

      // Blogs / reports / research from pros & companies for the lesson.
      // The letter shown on a preview card's square. Our own mark rather than
      // the publisher's logo, for the same reason their image is not used.
      function siteInitial(p) {
        // From the DOMAIN, not the site name: a UDisc article showed "R",
        // because they call the blog Release Point. The domain is what the
        // reader recognises and where the link actually goes.
        var src = (p.domain || p.site || '').replace(/^(www|blog|en)\./i, '');
        return (src.match(/[a-z0-9]/i) || ['?'])[0];
      }

      // An article rendered as a link PREVIEW: the publisher's own title and
      // description, credited to them, with the link going to their page. The
      // point is that a reader can tell what is behind the link before tapping
      // it -- the old row showed our paraphrase and a name, which is why these
      // were being ignored.
      function previewCard(r) {
        var p = r.preview;
        return '<a class="lprev" data-resource="article" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
          '<span class="lprev__mark" aria-hidden="true">' + esc(siteInitial(p)) + '</span>' +
          '<span class="lprev__body">' +
            '<span class="lprev__site">' + esc(p.site) + '</span>' +
            '<span class="lprev__title">' + esc(p.title) + '</span>' +
            '<span class="lprev__desc">' + esc(p.description) + '</span>' +
            '<span class="lprev__go">Read on ' + esc(p.domain) + ' \u2192</span>' +
          '</span></a>';
      }

      // No preview for this url, so the old row stands. Not a failure state:
      // one article (a Wikipedia profile) publishes no description at all.
      function plainRow(r) {
        var by = [r.author, r.credentials].filter(Boolean).join(' · ') || (r.resource_type || 'Resource');
        return '<a class="row" data-resource="' + esc(r.resource_type || 'link') + '" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
          '<span class="row__glyph">' + resIcon(r.resource_type) + '</span>' +
          '<div class="row__body"><div class="row__title">' + esc(r.title) + '</div>' +
          '<div class="row__sub" style="text-transform:none;letter-spacing:0">' + esc(by) + '</div></div>' +
          '<span class="row__meta">↗</span></a>';
      }

      async function loadResources(id) {
        try {
          var rs = await API.get('/training/lessons/' + encodeURIComponent(id) + '/resources');
          if (!rs || !rs.length) return;
          var cards = rs.filter(function (r) { return r.preview; });
          var rows = rs.filter(function (r) { return !r.preview; });
          document.getElementById('resources').innerHTML =
            '<p class="section-label">Read &amp; research</p>' +
            cards.map(previewCard).join('') +
            (rows.length ? '<div class="rows"' + (cards.length ? ' style="margin-top:10px"' : '') + '>'
              + rows.map(plainRow).join('') + '</div>' : '');
        } catch (e) { /* no resources */ }
      }

      var lesson = q('lesson'), cat = q('cat');
      var view = lesson ? renderLesson(cat, lesson) : cat ? renderCategory(cat) : renderHub();
      Promise.resolve(view).catch(fail);
    })();
  </script>
</body>
</html>
