<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Training · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w14" />
  <style>
    /* Same video row as the Players Lounge: 16:9 thumbnail, wrapping title.
       This block must sit AFTER app-ui.css -- .row__title there is nowrap +
       ellipsis, and a video's title is the whole reason to press it. */
    .vthumb { flex: none; width: 80px; height: 45px; border-radius: 4px;
              object-fit: cover; background: #e8e2d8; margin-right: 12px; }
    .vrow .row__title { white-space: normal; overflow: visible; text-overflow: clip;
                        line-height: 1.25; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title" id="crumb">Training</span>
      <a class="pill" href="/training" id="hubLink" hidden>All lessons</a>
    </header>
    <div id="content" class="loading">Loading…</div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
    (function () {
      if (!DGG.requireAuth()) return;
      DGG.tabbar('training');
      var esc = DGG.esc, API = DGG.API;
      var content = document.getElementById('content');
      var crumb = document.getElementById('crumb');
      var hubLink = document.getElementById('hubLink');

      function meter(pct) { return '<div class="meter"><div class="meter__fill" style="width:' + Math.max(0, Math.min(100, pct)) + '%"></div></div>'; }
      function q(name) { return new URLSearchParams(location.search).get(name); }
      function go(params) { location.href = '/training' + (params ? '?' + params : ''); }
      function fail(e) { content.className = 'screen'; content.innerHTML = '<div class="error">' + esc(e.message || 'Error') + '</div>'; }

      // ── Hub: categories + recommended lesson ──
      async function renderHub() {
        crumb.textContent = 'Training'; hubLink.hidden = true;
        var data = await API.get('/training/categories');
        var recWrap = '';
        try {
          var rec = await API.get('/training/recommendations');
          var top = (rec.recommendations || []).find(function (r) { return r.type === 'lesson'; });
          if (top && top.lesson) {
            // Carry the art of the lesson's OWN category, so the recommendation
            // is the colour of the thing it recommends and matches the cards
            // right below it. It used to be the generic training.webp, which
            // after the category art was redrawn left this card the only one
            // on the page in the old style -- and it said nothing about the
            // lesson. Falls back to the generic art if a slug is ever missing,
            // since a broken --art would leave a bare dark card.
            var recArt = top.lesson.category_slug
              ? '/img/cards/cat/' + top.lesson.category_slug + '.webp'
              : '/img/cards/training.webp';
            recWrap = '<a class="artcard" href="/training?cat=' + esc(top.lesson.category_slug) +
                '&lesson=' + top.lesson.id + '" style="--art:url(\'' + esc(recArt) + '\')">' +
              '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
              '<span class="artcard__body">' +
                '<span class="artcard__eyebrow">' + esc(top.reason || 'Recommended') + '</span>' +
                '<span class="artcard__title">' + esc(top.lesson.title) + '\u00a0→</span>' +
                '<span class="artcard__sub">' + esc(top.lesson.category_name || '') + '</span>' +
              '</span>' +
              '<span class="artcard__meta">+' + (top.lesson.xp_reward || 0) + ' XP</span></a>';
          }
        } catch (e) {}

        var cats = (data.categories || []).map(function (c) {
          var pct = c.lesson_count ? Math.round((c.completed_count / c.lesson_count) * 100) : 0;
          // Each category carries its own feature art (scripts/generate-category-art.js).
          // The meter sits outside the artcard because .artcard is an <a> whose
          // body is spans, and the meter is a div.
          return '<div>' +
            '<a class="artcard" href="/training?cat=' + esc(c.slug) + '"' +
              ' style="--art:url(\'/img/cards/cat/' + esc(c.slug) + '.webp\')">' +
              '<span class="artcard__art"></span><span class="artcard__scrim"></span>' +
              '<span class="artcard__body">' +
                '<span class="artcard__eyebrow">' +
                  (c.completed_count || 0) + ' / ' + (c.lesson_count || 0) + ' lessons</span>' +
                '<span class="artcard__title">' + esc(c.name) + '\u00a0\u2192</span>' +
              '</span>' +
              '<span class="artcard__meta">' + pct + '%</span></a>' +
            '<div style="height:10px"></div>' + meter(pct) + '</div>';
        }).join('');

        content.className = 'screen stack';
        content.innerHTML =
          '<div><p class="section-label">Skill up</p><h1 class="h-display">TRAIN<span class="mark" style="width:44%"></span></h1></div>' +
          recWrap +
          // The categories come FIRST. They are the curated path of
          // progression the app is selling; the fresh channel uploads are a
          // nice-to-have beside them, so they sit underneath rather than
          // pushing the library below the fold.
          '<div><p class="section-label">Categories</p><div class="stack">' + cats + '</div></div>' +
          '<div id="fresh"></div>';
        loadFresh();
      }

      // ── New training videos ──
      // Fresh instruction pulled from the coaching channels, as opposed to the
      // library below it, which is curated lesson by lesson. Only uploads that
      // pass the instructional filter reach this list -- the rounds, reviews
      // and vlogs from the same channels go to the Players Lounge instead.
      //
      // It loads after the hub is already on screen: this is a nice-to-have
      // beside the lessons, and it must never delay them or break the page if
      // the feed is empty.
      function when(iso) {
        var d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
        if (!isFinite(d)) return '';
        return d <= 0 ? 'today' : d === 1 ? 'yesterday'
             : d < 7 ? d + ' days ago'
             : d < 30 ? Math.floor(d / 7) + 'w ago' : Math.floor(d / 30) + 'mo ago';
      }

      async function loadFresh() {
        var host = document.getElementById('fresh');
        if (!host) return;
        var d;
        try { d = await API.get('/videos/teaching'); } catch (e) { return; }
        var vids = d.videos || [];
        if (!vids.length) return;

        var SHOWN = 5;
        function row(v) {
          return '<a class="row vrow" href="' + esc(v.url) + '" target="_blank" rel="noopener">' +
            '<img class="vthumb" src="' + esc(v.thumbnail) + '" alt="" loading="lazy" width="80" height="45">' +
            '<div class="row__body"><div class="row__title">' + esc(v.title) + '</div>' +
            '<div class="row__sub" style="text-transform:none;letter-spacing:0">' +
              esc(v.channel_name) + ' \u00b7 ' + when(v.published_at) + '</div></div></a>';
        }
        function paint(all) {
          host.innerHTML = '<p class="section-label">New training videos</p>' +
            '<div class="rows">' + (all ? vids : vids.slice(0, SHOWN)).map(row).join('') + '</div>' +
            (!all && vids.length > SHOWN
              ? '<button class="btn btn--ghost btn--block" id="moreFresh" style="margin-top:8px">' +
                'Show ' + (vids.length - SHOWN) + ' more</button>'
              : '');
          var b = document.getElementById('moreFresh');
          if (b) b.addEventListener('click', function () { paint(true); });
        }
        paint(false);
      }

      // ── Category: lessons list ──
      async function renderCategory(slug) {
        var data = await API.get('/training/categories/' + encodeURIComponent(slug) + '/lessons');
        crumb.textContent = data.category.name; hubLink.hidden = false;
        var rows = (data.lessons || []).map(function (l) {
          return '<a class="row" href="/training?cat=' + esc(slug) + '&lesson=' + l.id + '">' +
            '<span class="row__glyph">' + (l.completed ? '✓' : '▷') + '</span>' +
            '<div class="row__body"><div class="row__title">' + esc(l.title) + '</div>' +
            '<div class="row__sub">' + esc(l.difficulty || '') + ' · +' + (l.xp_reward || 0) + ' XP</div></div>' +
            (l.completed ? '<span class="pill pill--done">Done</span>' : '<span class="row__meta">›</span>') + '</a>';
        }).join('');
        content.className = 'screen stack';
        content.innerHTML =
          '<div><p class="section-label">' + esc(data.category.skill_level || 'Category') + '</p>' +
          '<h1 class="h-title">' + esc(data.category.name) + '</h1></div>' +
          '<div class="rows">' + rows + '</div>' +
          shareRow('Share these lessons', slug, null);
        wireShare();
      }

      // Shares the PUBLIC page on discgolfgo.com, never this one. A friend who
      // taps a /training link lands on a login wall; the .com library is free
      // and needs no account, so it is the only link worth sending.
      function shareRow(label, categorySlug, lessonSlug) {
        return '<p style="text-align:center;margin:4px 0 0">' +
          '<button class="btn btn--ghost" id="shareBtn" type="button" ' +
          'data-cat="' + esc(categorySlug) + '"' +
          (lessonSlug ? ' data-lesson="' + esc(lessonSlug) + '"' : '') +
          '>' + esc(label) + '</button></p>';
      }

      function wireShare() {
        var btn = document.getElementById('shareBtn'); if (!btn) return;
        btn.addEventListener('click', function () {
          DGG.share({
            url: DGG.learnUrl(btn.getAttribute('data-cat'), btn.getAttribute('data-lesson')),
            title: 'Disc Golf Go',
            text: 'Free disc golf lessons, no signup needed.',
            btn: btn
          });
        });
      }

      // ── Lesson: content + complete ──
      async function renderLesson(slug, id) {
        var l = await API.get('/training/lessons/' + encodeURIComponent(id));
        crumb.textContent = l.category_name || 'Lesson'; hubLink.hidden = false;
        content.className = 'screen stack';
        content.innerHTML =
          '<div><p class="section-label">' + esc(l.category_name || '') + ' · +' + (l.xp_reward || 0) + ' XP</p>' +
          '<h1 class="h-title">' + esc(l.title) + '</h1></div>' +
          (l.description ? '<p style="font-size:14px;line-height:1.55;color:var(--color-ash)">' + esc(l.description) + '</p>' : '') +
          videoPane(l) +
          renderContent(l) +
          '<div id="resources"></div>' +
          '<div id="cta"></div>' +
          (l.slug ? shareRow('Share this lesson', l.category_slug || slug, l.slug) : '');
        loadResources(id);
        wireVideo();
        wireShare();
        var cta = document.getElementById('cta');
        if (l.is_completed) {
          cta.innerHTML = '<div class="pill pill--done" style="width:100%;justify-content:center;padding:12px">Completed ✓</div>' +
            (l.next_lesson ? '<a class="btn btn--ghost btn--block" style="margin-top:12px" href="/training?cat=' + esc(slug) + '&lesson=' + l.next_lesson.id + '">Next lesson →</a>' : '');
        } else {
          cta.innerHTML = '<button class="btn btn--block" id="done">Mark Complete · +' + (l.xp_reward || 0) + ' XP</button>';
          document.getElementById('done').addEventListener('click', async function () {
            var b = this; b.disabled = true; b.textContent = 'Saving…';
            try {
              var r = await API.post('/training/completions', { lesson_id: Number(id) });
              var bonus = r.bonus_xp ? ' (+' + r.bonus_xp + ' bonus)' : '';
              b.className = 'pill pill--done'; b.style.width = '100%'; b.style.justifyContent = 'center'; b.style.padding = '12px';
              b.textContent = '+' + (r.xp_awarded || 0) + ' XP' + bonus + ' · Done ✓';
              if (l.next_lesson) cta.insertAdjacentHTML('beforeend', '<a class="btn btn--ghost btn--block" style="margin-top:12px" href="/training?cat=' + esc(slug) + '&lesson=' + l.next_lesson.id + '">Next lesson →</a>');
            } catch (ex) { b.disabled = false; b.textContent = 'Retry'; }
          });
        }
      }

      // Basic content_body renderer (tip_card / guide / list / text).
      function renderContent(l) {
        var cb = l.content_body;
        if (!cb) return '';
        try { if (typeof cb === 'string') cb = JSON.parse(cb); } catch (e) { return '<div class="card"><p style="font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--color-frost)">' + esc(cb) + '</p></div>'; }
        var out = '';
        if (Array.isArray(cb.sections)) {
          out = cb.sections.map(function (s) {
            return '<div class="card">' + (s.heading ? '<div class="row__title" style="margin-bottom:8px">' + esc(s.heading) + '</div>' : '') +
              '<p style="font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--color-frost)">' + esc(s.body || s.text || '') + '</p></div>';
          }).join('<div style="height:14px"></div>');
        } else if (cb.body || cb.text) {
          out = '<div class="card"><p style="font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--color-frost)">' + esc(cb.body || cb.text) + '</p></div>';
        } else if (Array.isArray(cb.tips || cb.points)) {
          out = '<div class="rows">' + (cb.tips || cb.points).map(function (t) { return '<div class="row"><span class="row__glyph">▸</span><div class="row__body"><div class="row__sub" style="text-transform:none;letter-spacing:0;font-size:16px;line-height:1.5;color:var(--color-ink)">' + esc(t) + '</div></div></div>'; }).join('') + '</div>';
        }
        return out;
      }

      // Extract a YouTube video id from watch / youtu.be / embed URLs.
      function ytId(url) {
        if (!url) return '';
        var m = String(url).match(/(?:v=|youtu\.be\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
        return m ? m[1] : '';
      }

      // Inline video PREVIEW PANE — thumbnail + play button; taps to the player.
      function videoPane(l) {
        if (!l.youtube_url) return '';
        var id = ytId(l.youtube_url);
        var title = esc(l.youtube_title || l.title);
        var chan = esc(l.youtube_channel || 'YouTube');
        if (!id) {
          // No embeddable id (e.g. a channel link) — fall back to an open card.
          return '<a class="card card--tap" href="' + esc(l.youtube_url) + '" target="_blank" rel="noopener" style="display:block">' +
            '<p class="card__eyebrow">▶ Watch — pro instruction</p>' +
            '<div class="h-title" style="margin-top:8px">' + title + '</div>' +
            '<p class="row__sub" style="margin-top:8px;text-transform:none;letter-spacing:0">' + chan + ' ↗</p></a>';
        }
        var thumb = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
        return '<div class="vpane" id="vpane" data-id="' + id + '" role="button" tabindex="0" aria-label="Play video: ' + title + '">' +
            '<div class="vpane__thumb" style="background-image:url(' + thumb + ')">' +
              '<span class="vpane__play" aria-hidden="true">▶</span>' +
            '</div>' +
            '<div class="vpane__meta">' +
              '<div class="vpane__eyebrow">Pro instruction</div>' +
              '<div class="vpane__title">' + title + '</div>' +
              '<div class="vpane__chan">' + chan + '</div>' +
            '</div>' +
          '</div>';
      }

      // Swap the preview pane for the embedded player on tap.
      function wireVideo() {
        var p = document.getElementById('vpane');
        if (!p) return;
        function play() {
          var id = p.getAttribute('data-id');
          p.innerHTML = '<div class="vpane__frame"><iframe src="https://www.youtube.com/embed/' + id +
            '?autoplay=1&rel=0&playsinline=1" title="Lesson video" frameborder="0" ' +
            'allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
          p.classList.add('vpane--playing');
        }
        p.addEventListener('click', play);
        p.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } });
      }

      function resIcon(t) { return t === 'video' ? '▷' : (t === 'report' || t === 'study' || t === 'article' ? '▤' : '◆'); }

      // Blogs / reports / research from pros & companies for the lesson.
      async function loadResources(id) {
        try {
          var rs = await API.get('/training/lessons/' + encodeURIComponent(id) + '/resources');
          if (!rs || !rs.length) return;
          document.getElementById('resources').innerHTML =
            '<p class="section-label">Read &amp; research</p><div class="rows">' +
            rs.map(function (r) {
              var by = [r.author, r.credentials].filter(Boolean).join(' · ') || (r.resource_type || 'Resource');
              return '<a class="row" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
                '<span class="row__glyph">' + resIcon(r.resource_type) + '</span>' +
                '<div class="row__body"><div class="row__title">' + esc(r.title) + '</div>' +
                '<div class="row__sub" style="text-transform:none;letter-spacing:0">' + esc(by) + '</div></div>' +
                '<span class="row__meta">↗</span></a>';
            }).join('') + '</div>';
        } catch (e) { /* no resources */ }
      }

      var lesson = q('lesson'), cat = q('cat');
      var view = lesson ? renderLesson(cat, lesson) : cat ? renderCategory(cat) : renderHub();
      Promise.resolve(view).catch(fail);
    })();
  </script>
</body>
</html>
