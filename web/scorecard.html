<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Scorecard · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w17" />
  <style>
    /* Hole rows: par on the left, a big stroke stepper on the right. Targets
       are deliberately large — this is tapped outdoors, one-handed, mid-round. */
    .sc-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
              border-top: 1px solid var(--hair, #eee); }
    .sc-row:first-child { border-top: 0; }
    /* The blank card's masthead: the logo and the words, and nothing that
       claims to know where you are. */
    .sc-blank { text-align: center; padding: 18px 0 2px; }
    .sc-logo { display: block; margin: 0 auto 10px; border-radius: 12px; }
    .sc-blank__name { margin: 0; font-family: var(--font-display, system-ui); font-weight: 800;
                      font-size: 20px; letter-spacing: .01em; color: var(--color-ink, #202020); }
    .sc-blank__sub { margin: 2px 0 0; font-size: 11px; letter-spacing: .14em;
                     text-transform: uppercase; color: #8a8279; }
    .sc-where { width: 100%; font: inherit; font-size: 16px; /* 16px stops iOS
                  zooming the page when the field takes focus */
                padding: 11px 13px; margin-top: 10px; border: 1px solid #ddd5c9;
                border-radius: 11px; background: #fff; color: var(--color-ink, #202020); }
    .sc-counts { display: flex; gap: 8px; margin-top: 10px; }
    .sc-counts .btn { flex: 1; }
    .sc-custom { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; }
    .sc-custom .sc-where { margin-top: 0; }
    .sc-custom .btn { flex: none; }
    .sc-hole { width: 34px; font-family: var(--font-display, system-ui); font-weight: 800; font-size: 17px; }
    .sc-par { flex: 1; font-size: 12px; color: #8a8279; text-align: left;
               border: 0; background: none; font-family: inherit; cursor: pointer;
               padding: 6px 0; /* a real tap target without moving the row */ }
    .sc-par b { font-weight: 700; color: var(--color-ink, #202020); }
    .sc-step { display: flex; align-items: center; gap: 6px; }
    .sc-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #ddd5c9;
              background: #fff; font-size: 20px; font-weight: 700; color: #202020; }
    .sc-btn:active { background: #f2ece4; }
    .sc-val { width: 42px; text-align: center; font-family: var(--font-display, system-ui);
              font-weight: 800; font-size: 19px; }
    .sc-val[data-state="under"] { color: #2e7d57; }
    .sc-val[data-state="over"]  { color: #d9500a; }
    .sc-val[data-state="empty"] { color: #c5bcb1; }
    .sc-tot { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
    /* Quiet, and deliberately not a full-width button: leaving without a score
       is the rare choice, not one to invite. */
    .sc-discard { display: block; margin: 12px 0 0; padding: 0; border: 0; background: none;
                  font: inherit; font-size: 12px; color: #b4402a; text-decoration: underline;
                  cursor: pointer; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="topbar__title">Scorecard</span>
      <span class="pill" id="vs">—</span>
    </header>

    <div id="content" class="loading">Loading…</div>

    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w15"></script>
  <script>
  (function () {
    'use strict';
    if (!DGG.requireAuth()) return;
    DGG.tabbar('play');
    var esc = DGG.esc, API = DGG.API;
    var content = document.getElementById('content');
    var qs = new URLSearchParams(location.search);
    var courseId = qs.get('course');
    var cardId = qs.get('card');
    var card = null;          // the open scorecard
    // ?name= is how a LIVE course arrives: the map knows it, our table has no
    // id for it, so the name is all there is -- and the name is all a blank
    // card needs.
    var courseName = qs.get('name') || '';

    function vsPar(strokes, par) { return strokes - par; }
    function fmtVs(n) { return n === 0 ? 'E' : (n > 0 ? '+' + n : String(n)); }

    // ------------------------------------------------------------ setup view
    // A BLANK CARD. The old version demanded ?course=<id>, looked the course
    // up in our table and refused if it was not there -- so the scorecard only
    // worked at the 1,532 places we happen to know about, which is the whole
    // problem the pivot is fixing. Now it is a card you fill in standing on
    // the first tee: a name if you want one, however many holes are in front
    // of you, every hole par 3 until you say otherwise.
    //
    // A ?course= is still honoured when it is given, because check-in and
    // "your best round here" key on that id -- it just is not required.
    async function chooseRound() {
      var suggested = 18;
      if (courseId) {
        // Best effort. A course we cannot load is not an error any more; it
        // just means you get the blank card you would otherwise have had.
        try {
          var course = await API.get('/courses/' + encodeURIComponent(courseId));
          courseName = course.name || '';
          suggested = parseInt(course.holes, 10) || 18;
        } catch (e) { courseId = null; }
      }

      var counts = [9, 18, 21, 24];
      if (counts.indexOf(suggested) < 0) counts.unshift(suggested);

      content.className = 'screen stack';
      content.innerHTML =
        '<div class="sc-blank">' +
          '<img class="sc-logo" src="/img/logo-mark.png" alt="Disc Golf Go" width="52" height="52" />' +
          '<p class="sc-blank__name">Disc Golf Go</p>' +
          '<p class="sc-blank__sub">Scorecard</p>' +
        '</div>' +
        '<div class="card">' +
          '<p class="card__eyebrow">Where are you playing?</p>' +
          '<input class="sc-where" id="where" type="text" maxlength="80" ' +
            'placeholder="Course name (optional)" value="' + esc(courseName) + '" />' +
          '<p class="card__eyebrow" style="margin-top:16px">How many holes?</p>' +
          '<div class="sc-counts">' +
            counts.map(function (n) {
              return '<button class="btn btn--ghost" data-holes="' + n + '">' + n + '</button>';
            }).join('') +
          '</div>' +
          '<div class="sc-custom">' +
            '<input class="sc-where" id="custom" type="number" inputmode="numeric" min="1" max="36" ' +
              'placeholder="or any number up to 36" />' +
            '<button class="btn btn--ghost" id="customGo">Start</button>' +
          '</div>' +
          '<p class="row__sub" style="margin-top:14px;text-transform:none;letter-spacing:0">' +
            'Every hole starts at par 3. Tap a hole\u2019s par on the card to make it a 4 or a 5.' +
          '</p>' +
        '</div>';

      content.querySelectorAll('[data-holes]').forEach(function (b) {
        b.addEventListener('click', function () { start(Number(this.dataset.holes), b); });
      });
      var go = document.getElementById('customGo');
      go.addEventListener('click', function () {
        var n = parseInt(document.getElementById('custom').value, 10);
        // Said rather than silently clamped: a player who typed 40 should be
        // told the limit, not handed a 36-hole card they did not ask for.
        if (!isFinite(n) || n < 1 || n > 36) {
          document.getElementById('custom').focus();
          return say('Pick a number of holes between 1 and 36');
        }
        start(n, go);
      });
    }

    function say(msg) {
      var old = document.getElementById('scsay');
      if (old) old.remove();
      content.insertAdjacentHTML('afterbegin', '<div class="error" id="scsay">' + esc(msg) + '</div>');
    }

    async function start(holes, btn) {
      var label = btn.textContent;
      btn.disabled = true; btn.textContent = '\u2026';
      var whereEl = document.getElementById('where');
      var typed = whereEl ? whereEl.value.trim() : '';
      try {
        var body = { holes: holes };
        if (courseId) body.course_id = Number(courseId);
        if (typed) body.course_name = typed;
        card = await API.post('/scorecards', body);
        history.replaceState(null, '', '/scorecard?card=' + card.id);
        renderCard();
      } catch (e) {
        say(e.message || 'Could not start the round');
        btn.disabled = false; btn.textContent = label;
      }
    }

    // ------------------------------------------------------------- card view
    function renderCard() {
      var holes = card.hole_scores || [];
      var name = card.course_name || courseName;
      content.className = 'screen stack';
      content.innerHTML =
        '<div><p class="section-label">Round in progress</p><h1 class="h-title">' + esc(name) + '</h1></div>' +
        '<div class="card"><div class="sc-tot">' +
          '<span class="caption">Total</span>' +
          '<span><b id="tot" style="font-size:22px">' + (card.strokes || 0) + '</b> ' +
          '<span class="row__meta" id="totvs"></span></span>' +
        '</div>' +
        // The way out sits here rather than under the holes: a card you
        // started and never scored is exactly the one you want to leave, and
        // on an 18-hole card the buttons below are a long scroll away.
        '<button class="sc-discard" id="discard">Discard round</button>' +
        '</div>' +
        '<div class="rows" id="holes">' + holes.map(holeRow).join('') + '</div>' +
        '<button class="btn btn--block" id="finish">Finish round</button>' +
        '<p class="row__sub" id="finish-hint" style="text-transform:none;letter-spacing:0;margin:8px 0 0;text-align:center"></p>' +
        '<a class="btn btn--ghost btn--block" href="/checkin" style="margin-top:8px">Back to Play</a>';

      content.querySelectorAll('[data-step]').forEach(function (b) {
        b.addEventListener('click', function () {
          step(Number(this.dataset.hole), Number(this.dataset.step));
        });
      });
      content.querySelectorAll('[data-par]').forEach(function (b) {
        b.addEventListener('click', function () { cyclePar(Number(this.dataset.par)); });
      });
      document.getElementById('finish').addEventListener('click', finish);
      document.getElementById('discard').addEventListener('click', discard);
      paintTotals();
    }

    function holeRow(h) {
      return '<div class="sc-row">' +
        '<span class="sc-hole">' + h.hole_number + '</span>' +
        // Par is a BUTTON, not a label: nobody has surveyed the course for us,
        // so the player is the only source for which holes are 4s and 5s.
        // It cycles 3 -> 4 -> 5 -> 3, because those are the only pars that
        // occur often enough to be worth a tap each.
        '<button class="sc-par" data-par="' + h.hole_number + '" ' +
          'aria-label="Hole ' + h.hole_number + ' par ' + h.par + ', tap to change">Par ' +
          '<b id="p' + h.hole_number + '">' + h.par + '</b></button>' +
        '<span class="sc-step">' +
          '<button class="sc-btn" data-hole="' + h.hole_number + '" data-step="-1" aria-label="One fewer stroke">−</button>' +
          '<span class="sc-val" id="h' + h.hole_number + '">—</span>' +
          '<button class="sc-btn" data-hole="' + h.hole_number + '" data-step="1" aria-label="One more stroke">+</button>' +
        '</span></div>';
    }

    // Stepping a hole with no score yet starts at its par, which is the
    // score you want most often and saves two taps on nearly every hole.
    async function step(holeNumber, delta) {
      var h = (card.hole_scores || []).filter(function (x) { return x.hole_number === holeNumber; })[0];
      if (!h) return;
      var next = h.strokes == null ? (delta > 0 ? h.par : h.par - 1) : h.strokes + delta;
      if (next < 1) next = null;               // stepping below 1 clears the hole
      if (next !== null && next > 20) return;
      var prev = h.strokes;
      h.strokes = next;                        // optimistic: the round shouldn't wait on a network
      paintHole(h); paintTotals();
      try {
        var r = await API.post('/scorecards/' + card.id + '/holes', { hole_number: holeNumber, strokes: next });
        card.strokes = r.total_strokes;
        paintTotals();
      } catch (e) {
        h.strokes = prev; paintHole(h); paintTotals();   // put it back if the save failed
      }
    }

    // Same optimistic shape as step(): paint first, save after, put it back
    // if the save fails. A round must never wait on the network.
    async function cyclePar(holeNumber) {
      var h = (card.hole_scores || []).filter(function (x) { return x.hole_number === holeNumber; })[0];
      if (!h || card.completed) return;
      var prev = h.par;
      h.par = h.par >= 5 ? 3 : h.par + 1;
      paintPar(h); paintHole(h); paintTotals();
      try {
        await API.post('/scorecards/' + card.id + '/par', { hole_number: holeNumber, par: h.par });
      } catch (e) {
        h.par = prev; paintPar(h); paintHole(h); paintTotals();
      }
    }

    function paintPar(h) {
      var el = document.getElementById('p' + h.hole_number);
      if (el) el.textContent = h.par;
    }

    function paintHole(h) {
      var el = document.getElementById('h' + h.hole_number);
      if (!el) return;
      el.textContent = h.strokes == null ? '—' : h.strokes;
      el.dataset.state = h.strokes == null ? 'empty'
        : h.strokes < h.par ? 'under' : h.strokes > h.par ? 'over' : 'level';
    }

    // Totals count only the holes actually played, so a round abandoned at
    // hole 7 doesn't read as 11 under par.
    function paintTotals() {
      var played = (card.hole_scores || []).filter(function (h) { return h.strokes != null; });
      var strokes = played.reduce(function (a, h) { return a + h.strokes; }, 0);
      var par = played.reduce(function (a, h) { return a + h.par; }, 0);
      var tot = document.getElementById('tot');
      if (tot) tot.textContent = strokes;
      var vs = fmtVs(vsPar(strokes, par));
      var totvs = document.getElementById('totvs');
      if (totvs) totvs.textContent = played.length ? vs + ' · ' + played.length + ' holes' : 'not started';
      document.getElementById('vs').textContent = played.length ? vs : '—';

      var btn = document.getElementById('finish');
      var hint = document.getElementById('finish-hint');
      if (btn) btn.disabled = !played.length;
      if (hint) {
        hint.textContent = played.length ? ''
          : 'Score a hole to finish this round — or discard it if you did not play.';
      }
    }

    async function discard() {
      if (!confirm('Discard this round? Nothing is saved and it leaves your rounds.')) return;
      var btn = document.getElementById('discard');
      btn.disabled = true; btn.textContent = 'Discarding…';
      try {
        await API.del('/scorecards/' + card.id);
        location.href = '/checkin';
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Discard round';
        content.insertAdjacentHTML('afterbegin',
          '<div class="error">' + esc(e.message || 'Could not discard that round') + '</div>');
      }
    }

    async function finish() {
      var btn = document.getElementById('finish');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        var r = await API.post('/scorecards/' + card.id + '/finish');
        content.className = 'screen stack';
        content.innerHTML =
          '<div class="card">' +
            '<p class="card__eyebrow">Round complete</p>' +
            '<div class="h-display" style="margin:10px 0">' + fmtVs(r.vs_par) + '</div>' +
            '<p class="row__sub">' + r.strokes + ' strokes over ' + r.holes_played +
              (r.holes_played === 1 ? ' hole · par ' : ' holes · par ') + r.par_played + '</p>' +
          '</div>' +
          '<a class="btn btn--block" href="/checkin">Back to Play</a>' +
          '<a class="btn btn--ghost btn--block" href="/game' + (card.course_id ? '?course=' + card.course_id : '') + '" style="margin-top:8px">Play this course in Throw Lab</a>';
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Finish round';
        content.insertAdjacentHTML('afterbegin', '<div class="error">' + esc(e.message || 'Could not save') + '</div>');
      }
    }

    // ---------------------------------------------------------------- boot
    (async function () {
      if (cardId) {
        try {
          card = await API.get('/scorecards/' + encodeURIComponent(cardId));
          renderCard();
          (card.hole_scores || []).forEach(paintHole);
          paintTotals();
          return;
        } catch (e) { /* fall through to starting a new one */ }
      }
      // No course and no card is the NORMAL way in now, not a dead end: a
      // blank card is the thing this page is. The old copy sent the player
      // back to Play to pick from a list that may not contain where they are
      // standing.
      return chooseRound();
    })();
  })();
  </script>
</body>
</html>
