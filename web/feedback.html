<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Report a problem · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w13" />
  <style>
    .hint{font-family:var(--font-display);font-size:13px;line-height:1.55;color:var(--color-ash);margin:0;}
    .ctx{font-family:var(--font-mono);font-size:11px;line-height:1.7;color:var(--color-ash);
      background:var(--color-mint);border-radius:10px;padding:10px 12px;margin:0;}
    .ok{text-align:center;padding:34px 0;}
    .ok__mark{font-size:34px;line-height:1;margin-bottom:12px;}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><a class="topbar__title" href="/settings">‹ Settings</a></header>
    <div class="screen stack" id="screen">
      <div>
        <h1 class="h-title">Report a problem</h1>
        <p class="hint">Tell us what happened and what you expected instead. If it was on a
          particular screen or course, say which — it is usually the difference between a
          bug we can reproduce and one we cannot.</p>
      </div>

      <div class="error" id="err" hidden></div>

      <div class="segbar" id="cat">
        <button class="seg" data-cat="Bug Report" aria-selected="true">Bug</button>
        <button class="seg" data-cat="Suggestion" aria-selected="false">Suggestion</button>
        <button class="seg" data-cat="Feedback" aria-selected="false">Feedback</button>
      </div>

      <label class="field"><span class="field__label">What happened?</span>
        <textarea class="input" id="message" rows="7"
          placeholder="I tapped Start on the daily tournament and the screen stayed blank."></textarea></label>

      <label class="field"><span class="field__label">Email (optional — only so we can reply)</span>
        <input class="input" id="email" type="email" inputmode="email" autocapitalize="none"
          placeholder="you@example.com" /></label>

      <p class="ctx" id="ctx"></p>

      <button class="btn btn--block" id="send">Send report</button>
    </div>
    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
    (function () {
      DGG.tabbar('profile');
      var esc = DGG.esc, API = DGG.API;
      var screen = document.getElementById('screen');
      var err = document.getElementById('err');
      var category = 'Bug Report';

      // Sent with the report. Shown to the reporter first, because a form that
      // quietly collects device details is worse than one that says so.
      var context = {
        page: location.pathname + location.search,
        platform: navigator.platform || '',
        screen: window.innerWidth + 'x' + window.innerHeight,
        app_version: (document.querySelector('script[src*="app.js"]') || {}).src || ''
      };
      context.app_version = (/[?&]v=([\w.]+)/.exec(context.app_version) || [])[1] || 'unknown';
      document.getElementById('ctx').textContent =
        'Sent with this report: app ' + context.app_version + ' · ' + context.screen +
        ' · ' + (context.platform || 'unknown device') + ' · your browser version';

      document.getElementById('cat').addEventListener('click', function (e) {
        var b = e.target.closest('.seg'); if (!b) return;
        [].forEach.call(this.children, function (c) {
          c.setAttribute('aria-selected', c === b ? 'true' : 'false');
        });
        category = b.getAttribute('data-cat');
      });

      function fail(msg) { err.hidden = false; err.textContent = msg; }

      document.getElementById('send').addEventListener('click', async function () {
        var btn = this;
        var message = document.getElementById('message').value.trim();
        var email = document.getElementById('email').value.trim();
        err.hidden = true;

        // Check here as well as on the server, so the shortest possible report
        // does not cost a round trip to be told it is too short.
        if (message.length < 10) { fail('Please add a little more detail — at least a sentence.'); return; }

        btn.disabled = true; btn.textContent = 'Sending…';
        try {
          await API.post('/feedback', {
            category: category, message: message,
            email: email || null, context: context
          });
          screen.innerHTML =
            '<div class="ok"><div class="ok__mark">✓</div>' +
            '<h1 class="h-title">Thanks — got it</h1>' +
            '<p class="hint">' + (email
              ? 'If we need more detail we will reply to ' + esc(email) + '.'
              : 'Add an email next time if you would like a reply.') + '</p>' +
            '<p style="margin-top:18px"><a class="btn btn--block" href="/home">Back to Home</a></p></div>';
          window.scrollTo(0, 0);
        } catch (e) {
          fail(e.status === 429
            ? 'That is a lot of reports in one hour. Try again a bit later.'
            : (e.message || 'Could not send that. Please try again.'));
          btn.disabled = false; btn.textContent = 'Send report';
        }
      });
    })();
  </script>
</body>
</html>
