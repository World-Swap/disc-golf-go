<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Throw Lab · Disc Golf Go</title>
  <meta name="theme-color" content="#f7f4ef" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w6" />
  <link rel="stylesheet" href="/styles/app.css?v=w6" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w6" />
  <style>
    /* The game owns the whole screen: no page scroll, canvas sized to the
       viewport. Everything here is scoped to this page. */
    html, body { overscroll-behavior: none; touch-action: manipulation; }
    body { background: #f7f4ef; }
    .g-wrap { position: relative; width: 100%; max-width: 520px; margin: 0 auto;
              background: #f7f4ef; user-select: none;
              padding: 0 0 78px; }     /* bottom pad clears the fixed tab bar */
    #g-canvas { display: block; width: 100%; touch-action: none; }

    /* HUD strip above the field */
    .g-hud { display: flex; align-items: center; justify-content: space-between;
             gap: 8px; padding: calc(14px + env(safe-area-inset-top, 0px)) 14px 8px; }
    .g-hud__block { text-align: center; flex: 1; }
    .g-hud__num { font-family: var(--font-display, system-ui); font-weight: 800;
                  font-size: 20px; line-height: 1; color: #202020; }
    .g-hud__lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
                  color: #8a8279; margin-top: 3px; }

    /* Disc picker */
    .g-bag { display: flex; gap: 8px; padding: 0 14px 10px; }
    .g-disc { flex: 1; border: 1px solid #ddd5c9; background: #fff; border-radius: 10px;
              padding: 8px 4px; text-align: center; cursor: pointer; }
    .g-disc[aria-pressed="true"] { border-color: #fc6414; background: #fff3ec; }
    .g-disc__n { font-weight: 800; font-size: 13px; color: #202020; }
    .g-disc__f { font-size: 10px; color: #8a8279; margin-top: 2px; }
    .g-disc__d { font-size: 10px; font-weight: 700; color: #fc6414; margin-top: 2px; }

    /* Prompt / result banner under the field */
    .g-msg { min-height: 58px; padding: 10px 16px 14px; text-align: center; }
    .g-msg__big { font-family: var(--font-display, system-ui); font-weight: 800;
                  font-size: 17px; color: #202020; }
    .g-msg__sub { font-size: 13px; color: #6d655c; margin-top: 3px; }
    .g-msg__sub b { color: #fc6414; }
  </style>
</head>
<body>
  <main class="app">
    <div class="g-wrap">
      <div class="g-hud">
        <div class="g-hud__block"><div class="g-hud__num" id="h-hole">1</div><div class="g-hud__lbl">Hole</div></div>
        <div class="g-hud__block"><div class="g-hud__num" id="h-par">3</div><div class="g-hud__lbl">Par</div></div>
        <div class="g-hud__block"><div class="g-hud__num" id="h-throws">0</div><div class="g-hud__lbl">Throws</div></div>
        <div class="g-hud__block"><div class="g-hud__num" id="h-dist">—</div><div class="g-hud__lbl">To basket</div></div>
        <div class="g-hud__block"><div class="g-hud__num" id="h-total">E</div><div class="g-hud__lbl">Total</div></div>
      </div>

      <div class="g-bag" id="bag"></div>

      <canvas id="g-canvas" width="520" height="700" aria-label="Disc golf hole"></canvas>

      <div class="g-msg">
        <div class="g-msg__big" id="msg-big">Tap to start your power</div>
        <div class="g-msg__sub" id="msg-sub">Stop the bar high for distance — but don't overpower the disc</div>
      </div>
    </div>

    <nav id="tabbar"></nav>
  </main>

  <script src="/js/app.js?v=w6"></script>
  <script>
  (function () {
    'use strict';
    if (!DGG.requireAuth()) return;
    DGG.tabbar('play');

    // ---------------------------------------------------------------- setup
    var cv = document.getElementById('g-canvas');
    var ctx = cv.getContext('2d');
    var ORANGE = '#fc6414', INK = '#202020', BONE = '#f7f4ef', GREEN = '#2e7d57';

    // Fit the canvas to the viewport minus the HUD/message chrome, on a device
    // pixel ratio so the art stays crisp on phones.
    function resize() {
      var wrap = cv.parentElement;
      var w = wrap.clientWidth;
      var h = Math.max(300, window.innerHeight - 322);
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = w * dpr; cv.height = h * dpr;
      cv.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = w; H = h;
    }
    var W = 520, H = 700;

    // ----------------------------------------------------------- the discs
    // Every distance in this game is in FEET — that's how course data is
    // recorded and how disc golfers talk about a hole.
    // Flight numbers, simplified: speed caps distance, turn drifts right at
    // high power (RHBH), fade always pulls left at the end. Overpowering a
    // fast disc is the classic beginner mistake, so the model punishes it.
    var DISCS = [
      { key: 'putter', name: 'Putter', max: 105, speed: 2, turn: 0.0, fade: 0.8, spread: 0.5, flight: '2 · 3 · 0 · 1' },
      { key: 'mid',    name: 'Mid',    max: 205, speed: 5, turn: 0.6, fade: 1.6, spread: 1.0, flight: '5 · 5 · −1 · 1' },
      { key: 'driver', name: 'Driver', max: 320, speed: 9, turn: 1.8, fade: 3.4, spread: 1.7, flight: '9 · 5 · −2 · 3' },
    ];
    var PX_PER_FT = 0.67;      // how far across the field a foot of drift reads
    var IN_THE_CHAINS = 10;    // feet: close enough to have holed out
    var disc = DISCS[2];

    // -------------------------------------------------------------- state
    var S = { hole: 1, par: 3, throws: 0, total: 0, holeLen: 0, ballX: 0, ballY: 0,
              phase: 'ready', power: 0, angle: 0, t: 0, dir: 1, flight: null, done: false };
    var HOLES = 3;
    var COURSE = null;   // { name, holes: [{ par, feet }] } when playing a real course
    var CARD = [];       // { par, strokes } per finished hole — what the server scores
    var SUBMITTED = false;

    // Round lengths: a quick round is a short session, a course round is the
    // full 18, looping the course's own holes when it has fewer.
    var QUICK_LENGTHS = [3, 6, 9];
    var COURSE_LENGTHS = [3, 6, 9, 18];

    // Typical throwing distance for a hole of each par, used when a course
    // knows its par but not its hole lengths.
    function lengthForPar(par) {
      if (par >= 5) return Math.round(640 + Math.random() * 180);
      if (par === 4) return Math.round(410 + Math.random() * 200);
      return Math.round(200 + Math.random() * 180);
    }

    // Build a playable round from whatever the course record actually has.
    // hole_details is free-form JSONB across 3,550 courses, so read it
    // defensively and fall back to par-shaped holes rather than trusting it.
    function buildCourse(c) {
      var count = Math.min(parseInt(c.holes, 10) || 18, 18);
      var totalPar = parseInt(c.par, 10) || count * 3;
      var details = Array.isArray(c.hole_details) ? c.hole_details : null;
      var holes = [];
      for (var i = 0; i < count; i++) {
        var d = details && details[i] && typeof details[i] === 'object' ? details[i] : null;
        var par = d ? parseInt(d.par, 10) : NaN;
        if (!(par >= 2 && par <= 6)) par = Math.max(3, Math.round(totalPar / count));
        // Feet are the native unit. A *_ft field is already feet; an
        // unlabelled number of 120 or less must be metres, since no disc golf
        // hole is 120 ft — that's a long putt, not a hole.
        var feet = NaN;
        if (d && parseFloat(d.distance_ft) > 0) feet = Math.round(parseFloat(d.distance_ft));
        else {
          var raw = d ? parseFloat(d.distance || d.length) : NaN;
          if (raw > 0) feet = raw <= 120 ? Math.round(raw * 3.28084) : Math.round(raw);
        }
        if (!(feet >= 80 && feet <= 1100)) feet = lengthForPar(par);
        holes.push({ par: par, feet: feet });
      }
      return { name: c.name || 'Course', holes: holes };
    }

    function newHole() {
      var h = COURSE ? COURSE.holes[S.hole - 1] : null;
      S.holeLen = h ? h.feet : Math.round(230 + Math.random() * 200);
      S.par = h ? h.par : 3;
      S.throws = 0; S.ballX = 0; S.ballY = S.holeLen;
      S.phase = 'ready'; S.flight = null;
      autoDisc(); paintBag(); hud();
      say('Tap to start your power',
          (COURSE ? COURSE.name + ' · ' : '') + 'Hole ' + S.hole + ' — ' + S.holeLen + ' ft, par ' + S.par);
    }

    // Pick the sensible disc for the distance left, the way a player would.
    function autoDisc() {
      var d = Math.sqrt(S.ballX * S.ballX + S.ballY * S.ballY);
      disc = d <= 100 ? DISCS[0] : d <= 200 ? DISCS[1] : DISCS[2];
    }

    // ------------------------------------------------------------ throwing
    // Power and angle are each chosen by stopping a sweeping bar: tap to
    // start, tap to lock. Two taps, one thumb, no dragging.
    function tap() {
      if (S.phase === 'ready')       { S.phase = 'power';  S.power = 0; S.dir = 1; say('Tap to lock power', ''); }
      else if (S.phase === 'power')  { S.phase = 'angle';  S.angle = -1; S.dir = 1;
                                       say('Tap to set your angle', 'Middle is flat — the edges are hyzer and anhyzer'); }
      else if (S.phase === 'angle')  { release(); }
      else if (S.phase === 'result') { nextThrow(); }
      else if (S.phase === 'holeEnd'){ S.hole++; if (S.hole > HOLES) endGame(); else newHole(); }
      else if (S.phase === 'gameEnd'){ S.hole = 1; S.total = 0; CARD = []; SUBMITTED = false; newHole(); }
    }

    function release() {
      S.throws++;
      var power = S.power;                       // 0..1
      var angle = S.angle;                       // -1 hyzer .. +1 anhyzer

      // The meter maps to a range that suits the shot. A putter throttled to
      // its full 32 m would put an 8 m putt at 25% power — the fast, twitchy
      // bottom of the bar, where no amount of skill lands it. Putting scales
      // the bar to the putt in front of you, so a good putt sits mid-meter.
      var reach = disc.key === 'putter' ? Math.max(20, S.ballY * 1.7) : disc.max;
      var ratio = power * reach / (disc.speed * 36);      // >1 means overpowered

      // Distance: power drives it, but pushing past the disc's speed rating
      // costs you — the disc turns over instead of carrying.
      var carry = reach * power * (ratio > 1 ? (1 - (ratio - 1) * 0.55) : 1);
      carry *= 0.92 + Math.random() * 0.16;      // human variance

      // Lateral: angle sets the starting tilt, turn pushes right at high
      // power, fade always hauls it back left at the end.
      var turnPush = disc.turn * Math.max(0, ratio - 0.55) * 30;
      var fadePull = disc.fade * 18;
      var lateral  = angle * 46 + turnPush - fadePull * (0.55 + power * 0.5);
      lateral += (Math.random() - 0.5) * disc.spread * 20;
      // A disc only has time to drift if it's actually flying: soft touch
      // shots and putts hold their line far better than full-power throws.
      lateral *= Math.min(1, carry / (disc.max * 0.6));

      S.flight = { from: { x: S.ballX, y: S.ballY }, carry: carry, lateral: lateral,
                   ratio: ratio, power: power, angle: angle };
      S.t = 0; S.phase = 'flight';
    }

    // Flight resolved: work out where it stopped and what to say about it.
    function land() {
      var f = S.flight;
      var restY = f.from.y - f.carry;    // negative means past the basket
      var restX = f.from.x + f.lateral;

      var miss = Math.sqrt(restX * restX + restY * restY);
      if (miss < IN_THE_CHAINS) return holed();          // in the chains

      // The next throw is played from wherever it stopped, aimed at the
      // basket again — so the state is simply "how far away am I now".
      // Without this, a disc that sailed past the basket kept being thrown
      // in the same direction and the hole could never be finished.
      S.ballY = miss; S.ballX = 0;

      autoDisc(); paintBag(); S.phase = 'result';
      var note = coach(f, restX, restY);
      say(Math.round(miss) + ' ft to the basket', note);
      hud();

      // Mercy rule: nobody should be stuck on one hole forever.
      if (S.throws >= 8) {
        S.total += S.throws - S.par;
        CARD.push({ par: S.par, strokes: S.throws });
        S.phase = 'holeEnd';
        say('Picked up  ·  ' + S.throws + ' throws', 'Tap for the next hole'); hud();
      }
    }

    // One line on what that throw did — the seed of the coaching idea, kept
    // crude for now: the loudest fault wins.
    function coach(f, restX, restY) {
      if (f.ratio > 1.12) return 'You <b>overpowered</b> it — past its speed the disc turns over instead of carrying.';
      if (restX < -40)    return 'Big <b>fade</b> left. Aim further right, or throw a straighter disc.';
      if (restX > 40)     return 'It <b>turned over</b> right. Ease off, or add hyzer.';
      if (restY < -13) return 'Flew <b>past</b> the basket — that disc had more in it than the hole needed.';
      if (f.power < 0.45 && restY > 80) return 'Left it <b>short</b> — nothing wrong with the line.';
      return 'Good line. Tap to throw again.';
    }

    function holed() {
      var v = S.throws - S.par;
      S.total += v;
      CARD.push({ par: S.par, strokes: S.throws });
      var name = S.throws === 1 ? 'ACE!' : v <= -2 ? 'Eagle!' : v === -1 ? 'Birdie!' :
                 v === 0 ? 'Par' : v === 1 ? 'Bogey' : '+' + v;
      S.phase = 'holeEnd'; S.ballY = 0; S.ballX = 0;
      hud();
      say(name + '  ·  ' + S.throws + ' throws', S.hole < HOLES ? 'Tap for the next hole' : 'Tap for your card');
    }

    function endGame() {
      S.phase = 'gameEnd';
      var t = S.total;
      var headline = 'Round complete: ' + (t === 0 ? 'even par' : (t > 0 ? '+' + t : t));
      say(headline, 'Saving your round…');
      submitRound(headline);
    }

    // Send the card up and report what it earned. The round is only ever sent
    // once, and a failure is never fatal — the player can keep playing.
    function submitRound(headline) {
      if (SUBMITTED || !CARD.length) return;
      SUBMITTED = true;
      var body = { mode: COURSE ? 'course' : 'quick', holes: CARD.slice() };
      if (COURSE && COURSE.id) body.course_id = COURSE.id;
      DGG.API.post('/game/rounds', body).then(function (r) {
        var bits = [];
        if (r.xp_earned) bits.push('+' + r.xp_earned + ' XP');
        (r.challenges_completed || []).forEach(function (c) { bits.push('✅ ' + c.title); });
        (r.new_badges || []).forEach(function (b) { bits.push('🏅 ' + (b.name || 'Badge')); });
        if (r.xp_capped) bits.push('daily XP limit reached');
        say(headline, bits.length ? bits.join(' · ') : 'Tap to play again');
      }).catch(function () {
        say(headline, 'Round saved locally — tap to play again');
      });
    }

    function nextThrow() { S.phase = 'ready'; say('Tap to start your power', ''); }

    // ----------------------------------------------------------- rendering
    // Everything is drawn with flat shapes in the brand palette — the same
    // charcoal-and-orange look as the logo. No images, no sprite sheets.
    // Metres represented by the visible field — grows if a throw leaves the
    // player further from the basket than the tee was.
    function fieldLen() { return Math.max(S.holeLen, S.ballY, 1); }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = BONE; ctx.fillRect(0, 0, W, H);

      var cx = W / 2, top = 90, bottom = H - 60;

      // Fairway: a green corridor narrowing toward the basket, rough either side.
      ctx.fillStyle = 'rgba(46,125,87,0.13)';
      ctx.beginPath();
      ctx.moveTo(cx - 118, bottom + 20); ctx.lineTo(cx + 118, bottom + 20);
      ctx.lineTo(cx + 62, top - 10); ctx.lineTo(cx - 62, top - 10);
      ctx.closePath(); ctx.fill();

      // Distance bands every 25 m, so the throw has a sense of scale.
      ctx.strokeStyle = 'rgba(32,32,32,0.10)'; ctx.lineWidth = 1;
      ctx.fillStyle = 'rgba(32,32,32,0.30)'; ctx.font = '10px system-ui';
      for (var m = 100; m < fieldLen(); m += 100) {
        var y = bottom - (bottom - top) * (m / fieldLen());
        ctx.beginPath(); ctx.moveTo(cx - 110, y); ctx.lineTo(cx + 110, y); ctx.stroke();
        ctx.fillText(m + ' ft', cx + 114, y + 3);
      }

      basket(cx, top);
      if (S.phase !== 'flight') lie(cx, bottom);
      if (S.phase === 'flight') flight(cx, top, bottom);
      if (S.phase === 'power') powerBar();
      if (S.phase === 'angle') angleBar();
    }

    // The logo, drawn in primitives: charcoal band, chains, tray, pole.
    function basket(x, y) {
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.roundRect(x - 26, y - 34, 52, 11, 4); ctx.fill();     // top band
      ctx.strokeStyle = INK; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      for (var i = -2; i <= 2; i++) {                                            // chains
        ctx.beginPath(); ctx.moveTo(x + i * 10, y - 21); ctx.lineTo(x + i * 10, y + 6); ctx.stroke();
      }
      ctx.beginPath();                                                           // tray
      ctx.moveTo(x - 30, y + 8); ctx.lineTo(x + 30, y + 8);
      ctx.lineTo(x + 20, y + 26); ctx.lineTo(x - 20, y + 26);
      ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
      ctx.fillRect(x - 3.5, y + 26, 7, 22);                                      // pole
    }

    // The disc at rest, with the off-line offset shown honestly.
    function lie(cx, bottom) {
      var y = S.ballY <= 0 ? 90 : bottom - (bottom - 90) * (1 - S.ballY / fieldLen());
      var x = cx + S.ballX * PX_PER_FT;
      discSprite(x, y, 1);
    }

    function flight(cx, top, bottom) {
      var f = S.flight, t = S.t;
      var fromY = bottom - (bottom - top) * (1 - f.from.y / fieldLen());
      var travelled = f.carry * t;
      var remaining = Math.max(0, f.from.y - travelled);
      var y = bottom - (bottom - top) * (1 - remaining / fieldLen());
      // Lateral arrives progressively: turn early, fade late.
      var shape = f.lateral * (0.35 * t + 0.65 * Math.pow(t, 2.2));
      var x = cx + (f.from.x + shape) * PX_PER_FT;
      var lift = 1 + 0.55 * Math.sin(Math.PI * t);         // height illusion
      ctx.strokeStyle = 'rgba(252,100,20,0.28)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx + f.from.x * PX_PER_FT, fromY); ctx.lineTo(x, y); ctx.stroke();
      discSprite(x, y, lift);
    }

    // The mark itself: orange ellipse with a light ring, as in the logo.
    function discSprite(x, y, scale) {
      ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
      ctx.fillStyle = ORANGE;
      ctx.beginPath(); ctx.ellipse(0, 0, 13, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = BONE; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(0, 0, 7.5, 3, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    function powerBar() {
      var w = 26, h = H * 0.45, x = 18, y = (H - h) / 2;
      ctx.fillStyle = 'rgba(32,32,32,0.08)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 13); ctx.fill();
      var fh = h * S.power;
      ctx.fillStyle = S.power > 0.86 ? '#d9500a' : ORANGE;
      ctx.beginPath(); ctx.roundRect(x, y + h - fh, w, fh, 13); ctx.fill();
      ctx.fillStyle = INK; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(Math.round(S.power * 100) + '%', x + w / 2, y + h + 18);
      ctx.textAlign = 'left';
    }

    function angleBar() {
      var w = W * 0.6, h = 22, x = (W - w) / 2, y = H - 44;
      ctx.fillStyle = 'rgba(32,32,32,0.08)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 11); ctx.fill();
      ctx.fillStyle = INK; ctx.font = '700 10px system-ui';
      ctx.fillText('HYZER', x - 2, y - 6); ctx.fillText('ANHYZER', x + w - 46, y - 6);
      var mx = x + w * ((S.angle + 1) / 2);
      ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.roundRect(mx - 4, y - 4, 8, h + 8, 4); ctx.fill();
    }

    // -------------------------------------------------------------- loop
    var last = performance.now();
    function frame(now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (S.phase === 'power') {
        S.power += S.dir * dt * 1.25;
        if (S.power >= 1) { S.power = 1; S.dir = -1; }
        if (S.power <= 0) { S.power = 0; S.dir = 1; }
      } else if (S.phase === 'angle') {
        S.angle += S.dir * dt * 1.9;
        if (S.angle >= 1) { S.angle = 1; S.dir = -1; }
        if (S.angle <= -1) { S.angle = -1; S.dir = 1; }
      } else if (S.phase === 'flight') {
        S.t += dt * 0.75;
        if (S.t >= 1) { S.t = 1; land(); }
      }
      draw(); requestAnimationFrame(frame);
    }

    // --------------------------------------------------------------- chrome
    function hud() {
      document.getElementById('h-hole').textContent = S.hole;
      document.getElementById('h-par').textContent = S.par;
      document.getElementById('h-throws').textContent = S.throws;
      document.getElementById('h-dist').textContent =
        S.phase === 'holeEnd' ? 'IN'
          : Math.round(Math.sqrt(S.ballX * S.ballX + S.ballY * S.ballY));
      document.getElementById('h-total').textContent =
        S.total === 0 ? 'E' : (S.total > 0 ? '+' + S.total : S.total);
    }

    function say(big, sub) {
      document.getElementById('msg-big').textContent = big;
      document.getElementById('msg-sub').innerHTML = sub || '';
    }

    function paintBag() {
      document.getElementById('bag').innerHTML = DISCS.map(function (d) {
        return '<button class="g-disc" data-k="' + d.key + '" aria-pressed="' + (d.key === disc.key) + '">' +
               '<div class="g-disc__n">' + d.name + '</div>' +
               '<div class="g-disc__f">' + d.flight + '</div>' +
               '<div class="g-disc__d">' + d.max + ' ft</div></button>';
      }).join('');
    }

    document.getElementById('bag').addEventListener('click', function (e) {
      var b = e.target.closest('.g-disc'); if (!b) return;
      if (S.phase !== 'ready' && S.phase !== 'result') return;   // no swapping mid-throw
      DISCS.forEach(function (d) { if (d.key === b.dataset.k) disc = d; });
      if (S.phase === 'result') S.phase = 'ready';
      paintBag();
    });

    // One tap target: the canvas. Pointer events cover touch and mouse both.
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); tap(); });
    window.addEventListener('resize', resize);

    // Length picker, shown before the first throw of a round.
    function askLength(lengths, sub, onPick) {
      var bag = document.getElementById('bag');
      bag.innerHTML = lengths.map(function (n) {
        return '<button class="g-disc" data-len="' + n + '"><div class="g-disc__n">' + n + '</div>' +
               '<div class="g-disc__f">holes</div></button>';
      }).join('');
      say('How many holes?', sub);
      bag.querySelectorAll('[data-len]').forEach(function (b) {
        b.addEventListener('click', function () { onPick(Number(this.dataset.len)); });
      });
    }

    // ?course=<id> plays a real course; ?holes=<n> skips the picker.
    function boot() {
      var qs = new URLSearchParams(location.search);
      var courseId = qs.get('course');
      var asked = parseInt(qs.get('holes'), 10);

      if (!courseId) {
        if (QUICK_LENGTHS.indexOf(asked) !== -1) { HOLES = asked; newHole(); return; }
        askLength(QUICK_LENGTHS, 'Quick round — no course, just throws', function (n) {
          HOLES = n; newHole();
        });
        return;
      }

      say('Loading the course…', '');
      DGG.API.get('/courses/' + encodeURIComponent(courseId)).then(function (c) {
        COURSE = buildCourse(c);
        COURSE.id = Number(courseId);
        document.title = COURSE.name + ' · Disc Golf Go';
        var start = function (n) { HOLES = n; layoutCourse(n); newHole(); };
        if (COURSE_LENGTHS.indexOf(asked) !== -1) return start(asked);
        askLength(COURSE_LENGTHS, COURSE.name, start);
      }).catch(function () {
        // Offline or a bad id — still give the player a round to throw.
        say('Could not load that course', 'Playing a quick round instead');
        HOLES = 3; newHole();
      });
    }

    // Stretch or trim the course's holes to the chosen length. A 9-hole course
    // played over 18 is two loops, which is exactly how it's played for real.
    function layoutCourse(n) {
      var src = COURSE.holes.slice();
      if (!src.length) return;
      var out = [];
      for (var i = 0; i < n; i++) out.push(src[i % src.length]);
      COURSE.holes = out;
    }

    resize(); boot(); requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
