<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Throw Lab · Disc Golf Go</title>
  <meta name="theme-color" content="#f7f4ef" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w13" />
  <style>
    /* The game owns the whole screen: no page scroll, canvas sized to the
       viewport. Everything here is scoped to this page. */
    html, body { overscroll-behavior: none; touch-action: manipulation; }
    body { background: #f7f4ef; }
    /* The game owns the screen, so the app's tab-bar gutter is given back. */
    .app { padding-bottom: 0 !important; }
    /* No tab bar here, so the bottom band only has to cover the system
       navigation itself — the 12px it adds elsewhere is the floating bar's
       gap, which this page does not have. */
    .app::after { height: var(--sab); }
    .g-wrap { position: relative; width: 100%; max-width: 520px; margin: 0 auto;
              background: #f7f4ef; user-select: none; padding: 0 0 6px; }

    .g-top { display: flex; align-items: center; justify-content: space-between; gap: 10px;
             padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 2px; }
    .g-back { border: 1px solid #ddd5c9; background: #fff; border-radius: 10px;
              padding: 7px 12px; font-size: 12px; font-weight: 700; color: #202020; }
    .g-back:active { background: #f2ece4; }
    .g-where { font-size: 11px; color: #8a8279; text-align: right;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #g-canvas { display: block; width: 100%; touch-action: none; }

    /* HUD strip above the field */
    .g-hud { display: flex; align-items: center; justify-content: space-between;
             gap: 8px; padding: 6px 14px 8px; }
    .g-hud__block { text-align: center; flex: 1; }
    .g-hud__num { font-family: var(--font-display, system-ui); font-weight: 800;
                  font-size: 20px; line-height: 1; color: #202020; }
    .g-hud__lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
                  color: #8a8279; margin-top: 3px; }

    /* Which way you are throwing. A forehand mirrors every curve the disc
       makes, so this is a real choice and not a cosmetic one. */
    .g-hand { display: flex; gap: 6px; padding: 0 14px 7px; }
    .g-hand button { flex: 1; border: 1px solid #ddd5c9; background: #fff; border-radius: 9px;
                     padding: 6px 4px; font: inherit; font-size: 11.5px; font-weight: 700;
                     color: #8a8279; cursor: pointer; }
    .g-hand button[aria-pressed="true"] { border-color: #fc6414; background: #fff3ec; color: #202020; }

    /* Disc picker */
    .g-bag { display: flex; gap: 8px; padding: 0 14px 10px; }
    .g-disc { flex: 1; min-width: 0; border: 1px solid #ddd5c9; background: #fff;
              border-radius: 10px; padding: 8px 3px; text-align: center; cursor: pointer; }
    .g-disc[aria-pressed="true"] { border-color: #fc6414; background: #fff3ec; }
    .g-disc__n { font-weight: 800; font-size: 13px; color: #202020; line-height: 1.15; }
    .g-disc__f { font-size: 9.5px; color: #8a8279; margin-top: 2px; white-space: nowrap; }
    .g-disc__d { font-size: 10px; font-weight: 700; color: #fc6414; margin-top: 1px; }
    /* The two ways out of a finished round. Taller than a disc chip because
       they are the only thing to press on the screen. */
    .g-disc--act { padding: 12px 4px; }
    .g-disc--act .g-disc__n { font-size: 14px; }
    .g-disc--act .g-disc__f { font-size: 10px; }
    .g-disc--act:first-child { border-color: #fc6414; background: #fc6414; }
    .g-disc--act:first-child .g-disc__n { color: #fff; font-size: 14px; }
    .g-disc--act:first-child .g-disc__f { color: rgba(255,255,255,0.8); }
    /* Only ever while the card is still posting. */
    .g-disc--act[disabled] { opacity: .5; cursor: default; }

    /* Prompt / result banner under the field.
       The height is FIXED, not fitted to the text. Every tap changes this
       message -- "Tap to start your power" carries a coaching line, "Tap to
       lock power" does not -- and when the block resized itself the canvas
       above it was re-measured and re-sized on every single tap, so the hole
       jumped between looking at it and throwing. Reserving one big line plus
       two sub lines (21 + 3 + 34 + 24 of padding) means the ordinary throw
       cycle never changes the chrome at all. The line heights are stated
       rather than inherited so that number is the same on every device. */
    .g-msg { min-height: 82px; padding: 10px 16px 14px; text-align: center; }
    .g-how { list-style: none; margin: 0 16px 14px; padding: 12px 14px; display: grid; gap: 7px;
             background: #f7f4ef; border: 1px solid #e6dfd5; border-radius: 14px; }
    /* `display: grid` outranks the UA's `[hidden] { display: none }`, so the
       strip stayed on screen through the round until this said otherwise. */
    .g-how[hidden] { display: none; }
    .g-how li { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: #4a443d; }
    .g-how b { flex: none; width: 19px; height: 19px; border-radius: 50%; background: #fc6414;
               color: #fff; font-size: 11px; display: grid; place-items: center; }
    .g-msg__big { font-family: var(--font-display, system-ui); font-weight: 800;
                  font-size: 17px; line-height: 21px; color: #202020; }
    /* Clamped to the two lines the block reserves, so a long coaching line
       cannot push the field's height around mid-round. */
    .g-msg__sub { font-size: 13px; line-height: 17px; color: #6d655c; margin-top: 3px;
                  display: -webkit-box; -webkit-box-orient: vertical;
                  -webkit-line-clamp: 2; overflow: hidden; }
    .g-msg__sub b { color: #fc6414; }
  </style>
</head>
<body>
  <main class="app">
    <div class="g-wrap">
      <div class="g-top">
        <button class="g-back" id="back" type="button">← Menu</button>
        <span class="g-where" id="where"></span>
      </div>

      <div class="g-hud">
        <div class="g-hud__block"><div class="g-hud__num" id="h-hole">1</div><div class="g-hud__lbl">Hole</div></div>
        <div class="g-hud__block"><div class="g-hud__num" id="h-par">3</div><div class="g-hud__lbl">Par</div></div>
        <div class="g-hud__block"><div class="g-hud__num" id="h-throws">0</div><div class="g-hud__lbl">Throws</div></div>
        <div class="g-hud__block"><div class="g-hud__num" id="h-dist">—</div><div class="g-hud__lbl">To basket</div></div>
        <div class="g-hud__block"><div class="g-hud__num" id="h-total">E</div><div class="g-hud__lbl">Total</div></div>
      </div>

      <div class="g-hand" id="hand">
        <button type="button" data-hand="1" aria-pressed="true">Backhand</button>
        <button type="button" data-hand="-1" aria-pressed="false">Forehand</button>
      </div>
      <div class="g-bag" id="bag"></div>

      <canvas id="g-canvas" width="520" height="700" aria-label="Disc golf hole"></canvas>

      <div class="g-msg">
        <div class="g-msg__big" id="msg-big">Tap to start your power</div>
        <div class="g-msg__sub" id="msg-sub">Stop the bar high for distance — but don't overpower the disc</div>
      </div>

      <!-- Every throw is the same three taps. Shown on the picker, because
           nothing else on screen says how the game is actually played. -->
      <ol class="g-how" id="how" hidden>
        <li><b>1</b> Tap to start the power bar</li>
        <li><b>2</b> Tap again to lock your power</li>
        <li><b>3</b> Tap to set your angle — then watch the fade</li>
      </ol>
    </div>

  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
  (function () {
    'use strict';
    if (!DGG.requireAuth()) return;
    // No tab bar while playing: the field takes the screen and there is one
    // way out, back to where the player came from.
    document.getElementById('back').addEventListener('click', function () {
      // Walking out mid-round loses it, and on a tournament attempt the entry
      // is already spent -- so leaving asks first once a throw has been made.
      // Before the first throw, and once the round is over, it just goes.
      if (roundUnderway()) {
        var msg = !ENTRY
          ? 'Leave this round? Your score will not be saved.'
          : ENTRY.daily
            ? 'Leave this daily round? Your entry for today is already used \u2014 the next one is at midnight UTC.'
            : 'Leave this tournament round? The entry is already used \u2014 you will not get it back.';
        if (!confirm(msg)) return;
      }
      if (history.length > 1) history.back(); else location.href = '/checkin';
    });

    /** A round is underway once it has begun and has not yet been carded. */
    function roundUnderway() {
      return S.phase !== 'choose' && S.phase !== 'gameEnd' &&
             (S.hole > 1 || S.throws > 0 || CARD.length > 0);
    }

    // ---------------------------------------------------------------- setup
    var cv = document.getElementById('g-canvas');
    var ctx = cv.getContext('2d');
    var ORANGE = '#fc6414', INK = '#202020', BONE = '#f7f4ef', GREEN = '#2e7d57';

    // The device pixel ratio the field is drawn at, capped at 2: past that the
    // extra pixels cost more in fill rate than they return on a phone.
    function DPR() { return Math.min(window.devicePixelRatio || 1, 2); }

    // Fit the canvas to the viewport minus the HUD/message chrome, on a device
    // pixel ratio so the art stays crisp on phones.
    // The canvas takes whatever is left after the real chrome, measured rather
    // than guessed: the disc picker is a line taller than the hole picker, so a
    // fixed height pushed the prompt under the tab bar the moment you chose a
    // round length.
    function resize() {
      var wrap = cv.parentElement;
      var w = wrap.clientWidth;
      var hud = document.querySelector('.g-hud');
      var bag = document.getElementById('bag');
      var msg = document.querySelector('.g-msg');
      var bar = document.querySelector('.g-top');
      var how = document.getElementById('how');
      var hand = document.getElementById('hand');
      var chrome = (hand ? hand.offsetHeight : 0) +
                   (hud ? hud.offsetHeight : 60) + (bag ? bag.offsetHeight : 60) +
                   (msg ? msg.offsetHeight : 58) + (bar ? bar.offsetHeight : 44) +
                   (how && !how.hidden ? how.offsetHeight : 0) + 14;
      // The system navigation overlaps the bottom of the viewport on Android,
      // so that strip is not ours to draw in: without this the message line
      // sits behind the back and home buttons.
      var sab = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0;
      var h = Math.max(240, window.innerHeight - chrome - sab);
      // Nothing to do if the field is already this size -- and it matters that
      // we do nothing, because assigning cv.width CLEARS the canvas. resize()
      // is called after every message change, so without this guard the hole
      // was wiped and redrawn at a new height on every tap.
      if (w === W && h === H && cv.width === Math.round(w * DPR())) return;
      var dpr = DPR();
      cv.width = w * dpr; cv.height = h * dpr;
      cv.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = w; H = h;
    }
    var W = 520, H = 700;

    // ----------------------------------------------------------- the discs
    // Every distance in this game is in FEET — that's how course data is
    // recorded and how disc golfers talk about a hole.
    //
    // The four numbers are the real ones disc golf uses, in the usual order
    // (speed · glide · turn · fade). They are not decoration: every one of
    // them is read by the flight model below, and the bag is built so that no
    // disc is strictly better than another.
    //
    //   speed  what arm speed the disc WANTS. Throw it slower and it flies
    //          more overstable; throw it faster and it flies more understable.
    //   glide  how far it carries for the power you put in.
    //   turn   rightward drift while it is still fast (negative = turns more).
    //   fade   leftward hook as it slows. Always arrives. RHBH throughout.
    // Four, which is what a beginner is told to carry and as many as fits a
    // phone without the chips going to ellipses. Six was too many to read and
    // too many to choose between.
    var DISCS = [
      { key: 'putter',  name: 'Putter',  max: 115, speed: 2,  glide: 3, turn:  0, fade: 1 },
      { key: 'mid',     name: 'Mid',     max: 230, speed: 5,  glide: 5, turn: -1, fade: 1 },
      { key: 'fairway', name: 'Fairway', max: 300, speed: 7,  glide: 5, turn: -2, fade: 2 },
      { key: 'driver',  name: 'Driver',  max: 385, speed: 11, glide: 5, turn: -1, fade: 3 }
    ];
    DISCS.forEach(function (d) {
      d.flight = d.speed + ' · ' + d.glide + ' · ' + d.turn + ' · ' + d.fade;
    });
    var FASTEST = 11;          // the speed rating a full-power throw matches
    var LONGEST = 385;         // the range a full-power throw covers, in feet

    // ------------------------------------------------------- flight model
    // Pure functions: no DOM, no canvas, no game state. Everything the throw
    // needs is passed in, so the whole model can be run headlessly a few
    // hundred thousand times to check what it does to a scorecard before it
    // is allowed anywhere near a leaderboard.

    /**
     * How fast the disc was thrown relative to what it wants. 1 is exactly
     * right. This is the heart of the model and the one thing the old one
     * had backwards: it only punished throwing too HARD. Real discs are
     * two-sided -- under its rated speed a disc flies MORE overstable and
     * dumps left early, over it the disc flies MORE understable and burns
     * right. Smashing a putter and feathering a bomber are both mistakes,
     * and they are opposite mistakes.
     */
    function speedRatio(effort, d) {
      return effort / Math.max(0.08, d.speed / FASTEST);
    }

    /**
     * How hard the throw actually was, as a fraction of what this disc can do.
     *
     * This is NOT the meter position, and the difference is the whole of the
     * putting bug. Inside the circle the bar is rescaled to the putt in front
     * of you, so half a bar is a gentle 20ft toss -- but the model was reading
     * the bar directly, deciding that anything past 17% was a putter thrown
     * three times too hard, and charging it both a carry penalty and a scatter
     * penalty. A 21ft putt at half power travelled 11.8ft.
     */
    function effortOf(o) {
      return (o.reach || o.disc.max) * o.power / LONGEST;
    }

    /**
     * Wind acts on the disc's airspeed, not on the player's arm, so a
     * headwind makes a disc behave as though it were thrown faster than it
     * was -- more understable -- and a tailwind as though thrown slower.
     * `head` is +1 straight into the player's face, -1 straight behind.
     */
    function windRatio(ratio, head) { return ratio * (1 + 0.45 * head); }

    /** Where the disc is, across the line to the basket, at time t of flight. */
    function lateralAt(t, f) {
      // Release BANK is a direction in space: a disc banked with its left
      // edge down drifts left, and that is true whichever way it is spinning.
      // So this term does not mirror with the hand -- what mirrors is which
      // bank you call a hyzer, because hyzer is defined by the ungripped edge
      // being the low one, and the grip is on the other side of the disc for
      // a forehand. Backhand hyzer banks left and finishes left; forehand
      // hyzer banks right and finishes right.
      var tilt = f.angle * f.tiltForce * t;
      // High-speed turn ARRIVES EARLY AND STAYS. It is a displacement, not a
      // wobble: a disc that turns right is further right for the rest of its
      // flight. Modelling it as a peak that returned to zero — which is what
      // this did first — left turn with no effect at all on where the disc
      // finished, and no amount of tuning would have shown it, because the
      // mid-flight bulge looked right on screen.
      var u = Math.min(1, t / 0.55);
      var hs = u * u * (3 - 2 * u);
      // Fade arrives later, and always arrives. The gap between the two
      // ramps is what draws the S.
      var v = Math.max(0, (t - 0.45) / 0.55);
      var ls = v * v * (3 - 2 * v);
      // Turn and fade ARE responses to spin, and a forehand spins the other
      // way -- RHBH is clockwise seen from above and turns right then fades
      // left; RHFH is counter-clockwise and turns left then fades right. So
      // these two mirror and the bank does not. `hand` is +1 backhand, -1
      // forehand.
      return tilt + f.hand * (f.turnForce * hs - f.fadeForce * ls) + f.crossForce * t * t;
    }

    /**
     * Resolve one throw into a flight. `rand` is injected so a simulation can
     * run it deterministically; the game passes Math.random.
     */
    function resolveThrow(o, rand) {
      rand = rand || Math.random;
      var d = o.disc;
      // Inside the circle the putter's full 115ft would put a 20ft putt at
      // 17% of the bar, where no amount of skill lands it. The meter is
      // scaled to the putt instead, so a good putt sits mid-meter.
      var reach = o.reach || d.max;
      var ratio = speedRatio(effortOf(o), d);
      var eff = windRatio(ratio, o.windHead);

      // Carry. Glide stretches it, a headwind eats it, a bad lie costs the
      // run-up, and overpowering bleeds distance because the disc is turning
      // instead of carrying.
      var over = Math.max(0, eff - 1);
      var carry = reach * o.power
        * (0.80 + d.glide * 0.04)
        * (1 - 0.30 * o.windHead)
        * o.liePower
        * (1 - 0.18 * Math.min(1.6, over))
        * (o.hand === -1 ? 0.93 : 1);
      // Dispersion grows with the throw. A 20ft putt is repeatable; a 350ft
      // bomb is not, which is where the risk in reaching for the big disc has
      // to come from — otherwise the longest disc is always the right answer.
      carry *= 1 + (rand() - 0.5) * (0.07 + 0.13 * o.power);

      // Turn only exists while the disc is fast, and grows hard once it is
      // thrown past its rating. Fade always arrives, and arrives harder the
      // slower the disc was thrown for what it is.
      // Every lateral force is a FRACTION OF THE FLIGHT, not a number of
      // feet. Drift accumulates over the distance the disc travels, so a
      // 20ft putt cannot fade as far as a 300ft drive — which is exactly
      // what a flat constant did, and it made putting from 30ft impossible
      // because the putt hooked 21ft left of a 10ft target.
      var span = Math.max(40, carry);
      var air = Math.min(1, carry / 90);     // no airtime, no shaping
      var turnForce = air * (-d.turn) * 0.105 * span * Math.max(0, Math.min(2.2, eff - 0.6));
      var fadeForce = air * d.fade * 0.075 * span * (1 + 0.85 * Math.max(0, Math.min(0.7, 1 - eff)));

      var f = {
        angle: o.angle, hand: o.hand === -1 ? -1 : 1,
        turnForce: turnForce, fadeForce: fadeForce,
        tiltForce: 0.26 * span,
        crossForce: o.windCross * 0.17 * span,
        carry: carry, ratio: ratio, eff: eff, power: o.power,
        from: { x: 0, y: o.distance }
      };
      // Scatter: a bad lie and a disc being muscled are both less repeatable.
      // Scaled to the throw rather than flat: a fixed 7ft of scatter is
      // nothing on a drive and most of a twenty-foot putt.
      f.scatter = (rand() - 0.5) * (o.hand === -1 ? 1.18 : 1) *
        (carry * 0.075 + 3 + 26 * (1 - o.liePower) + 11 * Math.min(1.6, over));
      return f;
    }

    /**
     * The hole's wind, seeded from the hole itself rather than rolled fresh.
     * This matters more than it looks: the weekly and daily tournaments put
     * the whole field on one course, so if the wind were random every player
     * would be ranked against a different hole. Seeded, everyone gets the
     * same conditions and the board means something.
     *
     * About a third of holes are calm -- wind every hole would stop being a
     * thing you read and start being noise.
     */
    function conditionsFor(key) {
      var a = unit(key + ':wind'), b = unit(key + ':dir');
      var strength = a < 0.34 ? 0 : (a - 0.34) / 0.66;
      var theta = b * Math.PI * 2;
      return {
        head: Math.cos(theta) * strength,      // +1 in your face, -1 behind
        cross: Math.sin(theta) * strength,     // +1 pushing right
        strength: strength
      };
    }

    /** Trees between the lie and the basket, in the throw's own frame. */
    function treesFor(key, distance) {
      if (distance < 95) return [];                     // nothing to shape around on a putt
      var n = 1 + Math.floor(unit(key + ':n') * 4);     // 1-4, evenly likely
      var span = Math.min(150, distance * 0.46);
      var out = [];
      for (var i = 0; i < n; i++) {
        var k = key + ':t' + i;
        // Each tree gets its own band of the hole, so four of them cannot
        // stack into a wall across the only line there is.
        var band = (i + unit(k + 'b') * 0.9) / n;
        out.push({
          y: distance * (0.26 + band * 0.48),
          x: (unit(k + 'x') - 0.5) * 2 * span,
          r: 15 + unit(k + 'r') * 11
        });
      }
      return out;
    }

    var HAZARD_RADIUS = 30;      // feet

    /**
     * A penalty area by the green, on a quarter of holes. Landing in it costs
     * a stroke and you play on from where it finished -- it is a hazard, not
     * an out-of-bounds re-throw, so it punishes the approach without ever
     * sending anyone back down the fairway.
     */
    function hazardFor(key) {
      if (unit(key + ':haz') >= 0.25) return null;
      var ring = 35 + unit(key + ':hr') * 75;
      var bearing = (unit(key + ':hb') - 0.5) * 2.4;
      return { y: ring * Math.cos(bearing), x: ring * Math.sin(bearing), r: HAZARD_RADIUS };
    }

    // ------------------------------------------------- the hole as a place
    // Trees and the hazard are features of the HOLE, not of the throw. They
    // are held in world feet with the basket at the origin and the tee
    // straight down the +y axis, and projected into each throw's own frame
    // when it is drawn or tested.
    //
    // They used to be re-rolled after every single throw, which is what made
    // a tree reappear somewhere else the moment you hit one. Worse for the
    // tournament: the stored layout only covered the tee, so from the second
    // shot on the whole field was back to generating its own.

    /** The frame of the throw about to be made: along the line to the basket. */
    function frameOf() {
      var d = Math.sqrt(S.pos.x * S.pos.x + S.pos.y * S.pos.y) || 1;
      var u = { x: S.pos.x / d, y: S.pos.y / d };     // basket -> player
      return { d: d, u: u, right: { x: u.y, y: -u.x } };
    }

    /** A world point as the current throw sees it: y from the basket, x across. */
    function toFrame(p, fr) {
      return { x: p.x * fr.right.x + p.y * fr.right.y,
               y: p.x * fr.u.x + p.y * fr.u.y, r: p.r };
    }

    /** And back again, once the disc has come to rest. */
    function toWorld(p, fr) {
      return { x: fr.u.x * p.y + fr.right.x * p.x,
               y: fr.u.y * p.y + fr.right.y * p.x };
    }

    /** Re-project the hole's fixed furniture for wherever the player stands. */
    function refreshFrame() {
      var fr = frameOf();
      S.trees = (S.holeTrees || []).map(function (t) { return toFrame(t, fr); });
      S.hazard = S.holeHazard ? toFrame(S.holeHazard, fr) : null;
      S.ballY = fr.d; S.ballX = 0;
    }

    /** Did the throw finish inside the hazard? */
    function inHazard(rest) {
      if (!S.hazard) return false;
      var dx = rest.x - S.hazard.x, dy = rest.y - S.hazard.y;
      return Math.sqrt(dx * dx + dy * dy) < S.hazard.r;
    }

    /**
     * The first tree the flight actually hits, or null. The path is already

      // row was created with and keeps them for every shot, not just the tee.
      S.holeTrees = fixed ? fixed.trees.slice() : treesFor(S.holeKey, S.holeLen);
      S.holeHazard = fixed ? (fixed.hazard || null) : hazardFor(S.holeKey);
      S.pos = { x: 0, y: S.holeLen };
      refreshFrame();
      resetHand();
      S.lie = { name: 'tee', power: 1 };
      S.penalty = 0;
      pickArt();
      autoDisc(); paintBag(); hud();
      say('Tap to start your power',
          (COURSE ? COURSE.name + ' · ' : '') + 'Hole ' + S.hole + ' — ' + S.holeLen +
          ' ft, par ' + S.par + treeWord() + hazardWord() + windWord());
    }

    // Pick the sensible disc for the distance left, the way a player would.
    /**
     * Suggest the disc whose range suits the shot. Only a suggestion — the
     * whole bag stays tappable, and the right answer is often not the longest
     * disc that reaches, because a disc thrown under its speed fades early.
     */
    function autoDisc() {
      var d = S.ballY;
      disc = d <= 95 ? DISCS[0] : d <= 200 ? DISCS[1] : d <= 290 ? DISCS[2] : DISCS[3];
    }

    /**
     * The angle bar in words, for the hand being thrown. A hyzer finishes the
     * way the disc fades — left off a backhand, right off a forehand — so the
     * two ends of the bar swap names when the hand does.
     */
    function angleWord() {
      return S.hand === -1
        ? 'Middle is flat — left is anhyzer, right is hyzer (forehand finishes right)'
        : 'Middle is flat — left is hyzer, right is anhyzer (backhand finishes left)';
    }

    /** Trees, named rather than left to be guessed at. */
    function treeWord() {
      var n = S.trees ? S.trees.length : 0;
      return n ? ' · ' + n + (n === 1 ? ' tree' : ' trees') + ' to miss' : '';
    }

    /** The hazard, named — a penalty you cannot see coming is just a tax. */
    function hazardWord() { return S.hazard ? ' · hazard by the green (+1)' : ''; }

    /** How the wind reads in words, for the line under the prompt. */
    function windWord() {
      var w = S.wind;
      if (!w || w.strength < 0.12) return ' · calm';
      var mph = Math.round(4 + w.strength * 14);
      var dir = Math.abs(w.head) > Math.abs(w.cross)
        ? (w.head > 0 ? 'headwind' : 'tailwind')
        : (w.cross > 0 ? 'crosswind →' : 'crosswind ←');
      return ' · ' + mph + ' mph ' + dir;
    }

    // ------------------------------------------------------------ throwing
    // Power and angle are each chosen by stopping a sweeping bar: tap to
    // start, tap to lock. Two taps, one thumb, no dragging.
    function tap() {
      // While choosing a length, the field is not live — the player has to
      // answer the picker above it.
      if (S.phase === 'choose') return;
      if (S.phase === 'ready')       { S.phase = 'power';  S.power = 0; S.dir = 1; say('Tap to lock power', ''); }
      else if (S.phase === 'power')  { S.phase = 'angle';  S.angle = -1; S.dir = 1;
                                       say('Tap to set your angle', angleWord()); }
      else if (S.phase === 'angle')  { release(); }
      else if (S.phase === 'result') { nextThrow(); }
      else if (S.phase === 'holeEnd'){ S.hole++; if (S.hole > HOLES) endGame(); else newHole(); }
      // 'gameEnd' deliberately does nothing. It used to restart the round on
      // the next tap, which wiped the card with no warning -- and on a
      // tournament entry dropped the player into a round that could never be
      // posted, because the entry was already spent. Leaving a round is now
      // an explicit button.
      else if (S.phase === 'gameEnd'){ return; }
    }

    function release() {
      S.throws++;
      var lie = S.lie || { name: 'tee', power: 1 };
      // The putter's meter is scaled to the putt in front of you, and anchored
      // so that HALF THE BAR IS THE PUTT -- which is the only mapping a player
      // can read off the screen. Everything else uses the disc's own range.
      var reach = (disc.key === 'putter' && S.ballY < 95) ? Math.max(34, S.ballY * 2.35) : 0;
      var f = resolveThrow({
        disc: disc, power: S.power, angle: S.angle, hand: S.hand,
        windHead: S.wind.head, windCross: S.wind.cross,
        liePower: lie.power, distance: S.ballY, reach: reach
      });
      S.flight = f;
      S.hit = hitTree(f, S.trees);
      S.t = 0; S.phase = 'flight';
    }

    // Flight resolved: work out where it stopped and what to say about it.
    function land() {
      var f = S.flight, rest, spat = false;

      if (S.hit) {
        // Into a tree. It drops short of where it hit and off to one side --
        // and it is pushed clear of the canopy, because a disc resting
        // against the trunk it just hit is both wrong to look at and, before
        // this, impossible to play out of.
        var t = S.hit.t, tr = S.hit.tree;
        rest = { x: lateralAt(t, f) + (Math.random() - 0.5) * 26,
                 y: f.from.y - f.carry * t + 10 + Math.random() * 24 };
        var dx = rest.x - tr.x, dy = rest.y - tr.y;
        var away = Math.sqrt(dx * dx + dy * dy) || 1;
        var clear = tr.r + 14;
        if (away < clear) {
          rest.x = tr.x + (dx / away) * clear;
          rest.y = tr.y + (dy / away) * clear;
        }
      } else {
        rest = restOf(f);
      }

      var miss = Math.sqrt(rest.x * rest.x + rest.y * rest.y);

      if (!S.hit && inHazard(rest)) {
        // Deliberately checked before the chains: a disc that finds the
        // hazard has not found the basket, however close the two are.
      } else if (!S.hit && miss < IN_THE_CHAINS) {
        // Chains spit a hot putt straight back out. It is a real and
        // thoroughly demoralising event, and it is the reason nobody who
        // knows what they are doing rips a putt from inside the circle.
        var hot = f.power > 0.72 && f.from.y < 72;
        if (!(hot && Math.random() < 0.3)) return holed();
        rest = { x: (Math.random() - 0.5) * 28, y: 13 + Math.random() * 18 };
        miss = Math.sqrt(rest.x * rest.x + rest.y * rest.y);
        spat = true;
      }

      // A hazard costs a stroke and you play on from where it finished. It
      // is not an out-of-bounds re-throw: the penalty should punish a loose
      // approach, not send anyone back down the fairway to do it again.
      var wet = inHazard(rest);
      if (wet) { S.throws++; S.penalty++; }

      // Where it stopped, carried back out into the world, so the next throw
      // sees the SAME trees from wherever it now stands rather than a fresh
      // set conjured for the occasion.
      S.pos = toWorld(rest, frameOf());
      S.lie = lieFor(rest.x, false);
      refreshFrame();
      resetHand();
      miss = S.ballY;

      autoDisc(); paintBag(); S.phase = 'result';
      say(Math.round(miss) + ' ft to the basket  ·  ' + (wet ? 'hazard' : S.lie.name),
          wet ? 'In the <b>hazard</b> — one stroke, and you play it from there.'
              : coach(f, rest, spat));
      hud();

      // Mercy rule: nobody should be stuck on one hole forever.
      if (S.throws >= 8) {
        S.total += S.throws - S.par;
        CARD.push({ par: S.par, strokes: S.throws });
        S.phase = 'holeEnd';
        say('Picked up  ·  ' + S.throws + ' throws', 'Tap for the next hole'); hud();
      }
    }

    /**
     * One line on what that throw did. The loudest fault wins, and the order
     * matters: a tree is what happened even if the disc was also overpowered.
     *
     * This is feedback on the shot you just made, not a coaching claim --
     * Throw Lab is a game, and what it teaches is Throw Lab.
     */
    function coach(f, rest, spat) {
      if (S.hit) return 'Into the <b>trees</b>. There was no line there — shape it round, or take the gap.';
      if (f.from.y < 95 && S.lie && S.lie.name === 'trees') return 'Out of the <b>trees</b> and back in play.';
      if (spat)  return '<b>Spat out!</b> Too much heat on a putt from in close.';
      if (f.eff > 1.5)  return 'That disc is <b>too slow for that much arm</b> — it turned over instead of carrying.';
      if (f.eff < 0.62) return '<b>Not enough arm</b> for that disc, so it flew overstable and dumped left early.';
      if (S.wind.head > 0.45 && rest.x > 45) return 'The <b>headwind</b> made it act understable. More hyzer, or a stabler disc.';
      if (S.wind.head < -0.45 && rest.y > 90) return '<b>Tailwind</b> killed the lift — it dropped out of the air early.';
      if (Math.abs(S.wind.cross) > 0.5 && Math.abs(rest.x) > 50) return 'The <b>crosswind</b> carried it. Aim into the wind, not at the basket.';
      if (rest.x < -48) return 'Big <b>fade</b> left. Start it further right, or throw something straighter.';
      if (rest.x > 48)  return 'It <b>turned over</b> right. Ease off, or add hyzer.';
      if (rest.y < -16) return 'Flew <b>past</b> the basket — that disc had more in it than the hole needed.';
      if (f.power < 0.45 && rest.y > 80) return 'Left it <b>short</b> — nothing wrong with the line.';
      if (S.lie && S.lie.name === 'rough')  return 'In the <b>rough</b> — no run-up from there, so take something you can control.';
      if (S.lie && S.lie.name === 'trees')  return 'Under the <b>trees</b>. Getting back to the fairway is the shot.';
      return 'Good line. Tap to throw again.';
    }

    function holed() {
      var v = S.throws - S.par;
      S.total += v;
      CARD.push({ par: S.par, strokes: S.throws });
      var name = S.throws === 1 ? 'ACE!' : v <= -2 ? 'Eagle!' : v === -1 ? 'Birdie!' :
                 v === 0 ? 'Par' : v === 1 ? 'Bogey' : '+' + v;
      S.phase = 'holeEnd'; S.ballY = 0; S.ballX = 0;
      hud();
      say(name + '  ·  ' + S.throws + ' throws', S.hole < HOLES ? 'Tap for the next hole' : 'Tap for your card');
    }

    function endGame() {
      S.phase = 'gameEnd';
      var t = S.total;
      var headline = 'Round complete: ' + (t === 0 ? 'even par' : (t > 0 ? '+' + t : t));
      say(headline, 'Saving your round\u2026');
      // Posted BEFORE the buttons are drawn, so endOptions() has a promise to
      // hold them on. Drawn first, they were tappable while the POST was
      // still in flight.
      submitRound(headline);
      endOptions();
    }

    /** The ways out of a finished round, in the bag strip under the card. */
    function endOptions() {
      var bag = document.getElementById('bag');
      // A tournament entry is spent the moment the round starts, so replaying
      // here would be a round that can never be posted. The board is offered
      // instead of a Play again that would mislead.
      var buttons = ENTRY
        ? [['board', 'See the board', ENTRY.daily ? 'today' : 'this week'], ['leave', 'Done', 'back to Play']]
        : [['again', 'Play again', 'new round'], ['leave', 'Done', 'back to Play']];
      bag.innerHTML = buttons.map(function (b) {
        return '<button class="g-disc g-disc--act" data-act="' + b[0] + '" disabled>' +
               '<div class="g-disc__n">' + b[1] + '</div>' +
               '<div class="g-disc__f">' + b[2] + '</div></button>';
      }).join('');
      var acts = bag.querySelectorAll('[data-act]');
      // Held until the card has actually posted — the sub-line says "Saving
      // your round…" while they are.
      //
      // Leaving a finished round takes the page down with the POST still in
      // flight. The server completes the write either way, so the round was
      // never lost; what was lost was every read that followed it. Done
      // landed on a Play tab whose /api/tournament call overtook the finish
      // and so still offered "Finish round →" on an entry the server was in
      // the middle of scoring — and pressing that reached the game with
      // "That entry already has a score". See the board raced the same
      // write and showed a leaderboard without the round it was opened to
      // show, right until it was reloaded. The window is not small: counted
      // against a real Postgres, one tournament finish is 43 database round
      // trips — the whole game submit (scoring, XP, challenges, badges)
      // and four more queries before it answers — and against Neon every
      // one of those is a network hop.
      acts.forEach(function (b) {
        b.addEventListener('click', function () {
          var act = this.dataset.act;
          // Land on the board this entry was played on. A bare /ranks opens
          // on Training, so "See the board" after a daily round used to show
          // the lesson XP ranking instead of the round just posted.
          if (act === 'board') {
            location.href = '/ranks?board=' + (ENTRY.daily ? 'daily' : 'tournament');
            return;
          }
          if (act === 'leave') { location.href = '/checkin'; return; }
          replay();
        });
      });
      var release = function () { acts.forEach(function (b) { b.disabled = false; }); };
      // A post that FAILED releases them too: the player must still be able to
      // leave, and submitRound() has already said so on the sub-line.
      if (POSTED) POSTED.then(release, release); else release();
      setTimeout(resize, 0);
    }

    /** Start a fresh round of the same shape -- only ever from the button. */
    function replay() {
      S.hole = 1; S.total = 0; CARD = []; SUBMITTED = false;
      newHole();   // resets the art bag, since the round restarts at hole 1   // paintBag() puts the discs back over these buttons
    }

    // Send the card up and report what it earned. The round is only ever sent
    // once, and a failure is never fatal — the player can keep playing.
    var POSTED = null;         // this round's post, while it is in flight
    function submitRound(headline) {
      if (SUBMITTED || !CARD.length) return;
      SUBMITTED = true;
      // A tournament card is posted against its entry, which scores it through
      // the same game endpoint server-side and puts it on the week's board.
      var path = ENTRY ? TBASE + '/entries/' + ENTRY.id + '/finish' : '/game/rounds';
      var body = { holes: CARD.slice() };
      if (!ENTRY) {
        body.mode = COURSE ? 'course' : 'quick';
        if (COURSE && COURSE.id) body.course_id = COURSE.id;
      }
      POSTED = DGG.API.post(path, body).then(function (r) {
        var bits = [];
        if (r.xp_earned) bits.push('+' + r.xp_earned + ' XP');
        (r.challenges_completed || []).forEach(function (c) { bits.push('✅ ' + c.title); });
        (r.new_badges || []).forEach(function (b) { bits.push('🏅 ' + (b.name || 'Badge')); });
        if (r.xp_capped) bits.push('daily XP limit reached');
        if (ENTRY) {
          if (r.place) bits.unshift('🏆 ' + ordinal(r.place) + ' of ' + r.players);
          if (r.best && r.entry && r.best.vs_par !== r.entry.vs_par) {
            bits.push('best still ' + fmtVs(r.best.vs_par));
          }
          bits.push(r.entries_remaining ? r.entries_remaining + ' entry left' : 'no entries left this week');
        }
        say(headline, bits.length ? bits.join(' · ') : (ENTRY ? 'Score posted' : 'Tap to play again'));
      }).catch(function (e) {
        say(headline, ENTRY ? ((e && e.message) || 'Could not post that score') : 'Round saved locally — tap to play again');
      });
    }

    function nextThrow() {
      S.phase = 'ready';
      say('Tap to start your power', '');
    }

    /**
     * Back to backhand. A forehand is a decision you make for the shot in
     * front of you, not a mode you leave switched on — leaving it set is how
     * a player ends up flicking a putt they meant to throw normally.
     */
    function resetHand() { if (S.hand !== 1) { S.hand = 1; paintHand(); } }

    function fmtVs(n) { return n === 0 ? 'even' : (n > 0 ? '+' + n : String(n)); }
    function ordinal(n) {
      var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    // ----------------------------------------------------------- rendering
    // Everything is drawn with flat shapes in the brand palette — the same
    // charcoal-and-orange look as the logo. No images, no sprite sheets.
    // Metres represented by the visible field — grows if a throw leaves the
    // player further from the basket than the tee was.
    function fieldLen() { return Math.max(S.holeLen, S.ballY, 1); }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = BONE; ctx.fillRect(0, 0, W, H);

      var cx = W / 2, top = 90, bottom = H - 60;

      if (art) {
        // Cover the canvas without distorting the hole.
        var scale = Math.max(W / art.width, H / art.height);
        var dw = art.width * scale, dh = art.height * scale;
        ctx.drawImage(art, (W - dw) / 2, (H - dh) / 2, dw, dh);
      } else if (artSoft) {
        // The 5x7 preview, stretched over the whole field. Canvas smooths it
        // as it scales, which is the blur — no filter needed, and none is
        // used, because ctx.filter is not reliable across the WebViews this
        // runs in.
        ctx.drawImage(artSoft, 0, 0, PREVIEW_W, PREVIEW_H, 0, 0, W, H);
      } else {
        // No artwork (still loading, or it failed): the plain drawn fairway.
        ctx.fillStyle = 'rgba(46,125,87,0.13)';
        ctx.beginPath();
        ctx.moveTo(cx - 118, bottom + 20); ctx.lineTo(cx + 118, bottom + 20);
        ctx.lineTo(cx + 62, top - 10); ctx.lineTo(cx - 62, top - 10);
        ctx.closePath(); ctx.fill();
      }

      // Distance bands, so the throw has a sense of scale.
      //
      // These used to be plain white over the art, which assumed the art is
      // dark. Half of it is not: on `winter` and `desert` a white line at 0.22
      // and a white label at 0.65 are all but invisible against snow and sand.
      // Nor can one flat colour be picked per hole, because a single template
      // runs from bright fairway to black treeline and the bands cross both.
      //
      // So each band carries its own contrast rather than borrowing it: a dark
      // line under a light one, and a label filled white over a dark outline.
      // The glyph is then always light against dark whatever is behind it, and
      // the outline is what you read where the background is pale.
      var overArt = !!(art || artSoft);
      ctx.save();
      ctx.font = '10px system-ui';
      ctx.lineJoin = 'round';
      // Measured FROM THE BASKET, which is what the HUD counts and where the
      // trees and the hazard are anchored. They used to be measured from the
      // bottom of the field, so once you had moved up the hole a line marked
      // "100 ft" was 100ft from the tee you had left rather than from the
      // target you were throwing at.
      for (var m = 100; m < fieldLen(); m += 100) {
        var y = bottom - (bottom - top) * (1 - m / fieldLen());
        var label = m + ' ft';
        if (overArt) {
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(0,0,0,0.32)';
          ctx.beginPath(); ctx.moveTo(cx - 110, y + 1); ctx.lineTo(cx + 110, y + 1); ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.beginPath(); ctx.moveTo(cx - 110, y); ctx.lineTo(cx + 110, y); ctx.stroke();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = 'rgba(0,0,0,0.6)';
          ctx.strokeText(label, cx + 114, y + 3);
          ctx.fillStyle = '#fff';
        } else {
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(32,32,32,0.10)';
          ctx.beginPath(); ctx.moveTo(cx - 110, y); ctx.lineTo(cx + 110, y); ctx.stroke();
          ctx.fillStyle = 'rgba(32,32,32,0.30)';
        }
        ctx.fillText(label, cx + 114, y + 3);
      }
      ctx.restore();

      hazardShape(cx, top, bottom);
      treeShapes(cx, top, bottom);
      basket(cx, top);
      windArrow();
      if (S.phase !== 'flight' && S.phase !== 'choose') lie(cx, bottom);
      if (S.phase === 'flight') flight(cx, top, bottom);
      if (S.phase === 'angle') aimRay(cx, top, bottom);
      if (S.phase === 'power') powerBar();
      if (S.phase === 'angle') angleBar();
      // The finished round covers the hole: at the end you want your card,
      // not the fairway you have already played.
      if (S.phase === 'gameEnd') card();
    }

    /**
     * The trees standing between the lie and the basket. They are drawn
     * before the flight so the disc passes in front of them, and they are
     * the same objects the collision test uses — if you can see a gap, the
     * gap is really there.
     */
    function treeShapes(cx, top, bottom) {
      if (!S.trees || !S.trees.length || S.phase === 'choose') return;
      for (var i = 0; i < S.trees.length; i++) {
        var tr = S.trees[i];
        var y = bottom - (bottom - top) * (1 - Math.max(0, tr.y) / fieldLen());
        var x = cx + tr.x * PX_PER_FT;
        var r = Math.max(13, tr.r * PX_PER_FT);
        // Drawn as a canopy seen from above, not a disc: a plain dark circle
        // reads as a bug, and was asked about as "what are these black dots?".
        // A scalloped outline is what a tree looks like from the air, and the
        // bone rim under it is what makes it legible on art that is itself
        // full of dark trees.
        canopy(x, y + 2, r * 1.04, 'rgba(0,0,0,0.25)');
        canopy(x, y, r * 1.16, 'rgba(247,244,239,0.92)');
        canopy(x, y, r, '#1f3b2a');
        canopy(x - r * 0.26, y - r * 0.28, r * 0.34, 'rgba(247,244,239,0.18)');
      }
    }

    /**
     * The penalty area by the green. Drawn under the trees and the basket but
     * over the art, with a bone rim and a dashed edge so it reads as ground
     * you must not land on rather than as part of the photograph.
     */
    function hazardShape(cx, top, bottom) {
      var h = S.hazard;
      if (!h || S.phase === 'choose') return;
      var y = bottom - (bottom - top) * (1 - Math.max(0, h.y) / fieldLen());
      var x = cx + h.x * PX_PER_FT;
      var r = Math.max(14, h.r * PX_PER_FT);
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(20,74,130,0.42)'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(247,244,239,0.9)'; ctx.stroke();
      ctx.setLineDash([6, 5]); ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(20,74,130,0.95)'; ctx.stroke();
      ctx.restore();
    }

    /**
     * One lobed blob, filled as a single path so the lobes union rather than
     * showing their own edges inside the shape.
     */
    function canopy(x, y, r, fill) {
      ctx.beginPath();
      ctx.moveTo(x + r * 0.68, y); ctx.arc(x, y, r * 0.68, 0, Math.PI * 2);
      for (var i = 0; i < 7; i++) {
        var a = (i / 7) * Math.PI * 2;
        var lx = x + Math.cos(a) * r * 0.58, ly = y + Math.sin(a) * r * 0.58;
        ctx.moveTo(lx + r * 0.42, ly); ctx.arc(lx, ly, r * 0.42, 0, Math.PI * 2);
      }
      ctx.fillStyle = fill; ctx.fill();
    }

    /** Which way the wind is pushing, in the top corner of the field. */
    function windArrow() {
      var w = S.wind;
      if (!w || w.strength < 0.12) return;
      var x = W - 32, y = 32, len = 7 + w.strength * 9;
      // Screen y runs down the page and the player throws up it, so a
      // headwind -- blowing back at the player -- points DOWN.
      var ang = Math.atan2(w.head, w.cross);
      // On its own chip, because the corner it sits in is whatever the hole
      // art happens to put there -- snow on one template, black rock on the
      // next -- and a dark arrow on dark rock tells nobody anything.
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, 19, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(247,244,239,0.88)'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(32,32,32,0.35)'; ctx.stroke();
      ctx.translate(x, y); ctx.rotate(ang);
      ctx.strokeStyle = INK; ctx.fillStyle = INK;
      ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(len * 0.45, 0); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(len, 0); ctx.lineTo(len * 0.35, -5.5); ctx.lineTo(len * 0.35, 5.5);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    /**
     * Where the disc is pointed as the angle bar runs. Deliberately only the
     * release direction and only a short way out — the whole predicted curve
     * would hand the player the answer, and reading the flight is the game.
     */
    function aimRay(cx, top, bottom) {
      var fromY = S.ballY <= 0 ? top : bottom - (bottom - top) * (1 - S.ballY / fieldLen());
      var fromX = cx + S.ballX * PX_PER_FT;
      var reach = Math.min(130, (bottom - fromY) * 0.42 + 46);
      ctx.save();
      ctx.strokeStyle = 'rgba(252,100,20,0.5)';
      ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(fromX, fromY);
      ctx.lineTo(fromX + S.angle * reach * 0.5, fromY - reach);
      ctx.stroke();
      ctx.restore();
    }

    /** The round's card, hole by hole, over a scrim on the last hole's art. */
    function card() {
      ctx.fillStyle = 'rgba(32,32,32,0.86)';
      ctx.fillRect(0, 0, W, H);
      if (!CARD.length) return;

      // One column per hole, wrapped so 18 holes fit a phone as two rows.
      var perRow = CARD.length > 9 ? Math.ceil(CARD.length / 2) : CARD.length;
      var rows = Math.ceil(CARD.length / perRow);
      var colW = Math.min(46, (W - 32) / perRow);
      var gridW = colW * perRow;
      var rowH = 52;
      var top0 = (H - rows * rowH) / 2 + 8;

      ctx.textAlign = 'center';
      CARD.forEach(function (h, i) {
        var r = Math.floor(i / perRow), c = i % perRow;
        var x = (W - gridW) / 2 + c * colW + colW / 2;
        var y = top0 + r * rowH;
        var v = h.strokes - h.par;
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.font = '9px system-ui';
        ctx.fillText(String(i + 1), x, y);
        // Under par reads green, over par orange -- the same language the
        // record page uses for a score.
        ctx.fillStyle = v < 0 ? '#5fd39b' : v > 0 ? '#ff9a5c' : '#ffffff';
        ctx.font = '700 19px system-ui';
        ctx.fillText(String(h.strokes), x, y + 22);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.font = '9px system-ui';
        ctx.fillText('par ' + h.par, x, y + 36);
      });

      var strokes = CARD.reduce(function (a, h) { return a + h.strokes; }, 0);
      var par = CARD.reduce(function (a, h) { return a + h.par; }, 0);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = '11px system-ui';
      ctx.fillText(strokes + ' throws  \u00b7  par ' + par + '  \u00b7  ' + fmtVs(strokes - par),
                   W / 2, top0 + rows * rowH + 16);
      ctx.textAlign = 'start';
    }

    // The logo, drawn in primitives: charcoal band, chains, tray, pole.
    function basket(x, y) {
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.roundRect(x - 26, y - 34, 52, 11, 4); ctx.fill();     // top band
      ctx.strokeStyle = INK; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      for (var i = -2; i <= 2; i++) {                                            // chains
        ctx.beginPath(); ctx.moveTo(x + i * 10, y - 21); ctx.lineTo(x + i * 10, y + 6); ctx.stroke();
      }
      ctx.beginPath();                                                           // tray
      ctx.moveTo(x - 30, y + 8); ctx.lineTo(x + 30, y + 8);
      ctx.lineTo(x + 20, y + 26); ctx.lineTo(x - 20, y + 26);
      ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
      ctx.fillRect(x - 3.5, y + 26, 7, 22);                                      // pole
    }

    // The disc at rest, with the off-line offset shown honestly.
    function lie(cx, bottom) {
      var y = S.ballY <= 0 ? 90 : bottom - (bottom - 90) * (1 - S.ballY / fieldLen());
      var x = cx + S.ballX * PX_PER_FT;
      discSprite(x, y, 1);
    }

    /** Screen position of the disc at time t of the current flight. */
    function flightPoint(cx, top, bottom, t) {
      var f = S.flight;
      var remaining = Math.max(0, f.from.y - f.carry * t);
      return {
        x: cx + (f.from.x + lateralAt(t, f)) * PX_PER_FT,
        y: bottom - (bottom - top) * (1 - remaining / fieldLen())
      };
    }

    /**
     * The flight, drawn as the curve it actually is.
     *
     * This used to be a straight line from the lie to the disc, which threw
     * away the one shape disc golf is known for: out right as it turns, back
     * left as it fades. The path is parametric, so the trail is just that
     * same function sampled — what you watch is exactly what was scored.
     */
    function flight(cx, top, bottom) {
      var f = S.flight, t = S.t;
      ctx.strokeStyle = 'rgba(252,100,20,0.45)';
      ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      for (var i = 0; i <= 28; i++) {
        var tt = t * i / 28;
        var pt = flightPoint(cx, top, bottom, tt);
        if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
      var now = flightPoint(cx, top, bottom, t);
      // A height illusion, and the disc banks the way it was released.
      var lift = 1 + 0.5 * Math.sin(Math.PI * t);
      discSprite(now.x, now.y, lift, f.angle * 0.5 * (1 - t));
    }

    // The mark itself: orange ellipse with a light ring, as in the logo.
    function discSprite(x, y, scale, tilt) {
      ctx.save(); ctx.translate(x, y);
      if (tilt) ctx.rotate(tilt);
      ctx.scale(scale, scale);
      ctx.fillStyle = ORANGE;
      ctx.beginPath(); ctx.ellipse(0, 0, 13, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = BONE; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(0, 0, 7.5, 3, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // A label in its own dark pill, so text never has to fight the artwork.
    function chip(text, cx2, cy2, size) {
      ctx.font = '700 ' + (size || 11) + 'px system-ui';
      var w = ctx.measureText(text).width + 14;
      var h = (size || 11) + 10;
      ctx.fillStyle = 'rgba(14,11,9,0.82)';
      ctx.beginPath(); ctx.roundRect(cx2 - w / 2, cy2 - h / 2, w, h, h / 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, cx2, cy2 + 0.5);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }

    function powerBar() {
      var w = 34, h = H * 0.46, x = 16, y = (H - h) / 2;
      var pad = 7;

      // Panel behind the meter — the track alone was invisible over the art.
      ctx.fillStyle = 'rgba(14,11,9,0.72)';
      ctx.beginPath(); ctx.roundRect(x - pad, y - pad - 20, w + pad * 2, h + pad * 2 + 40, 16); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(x - pad, y - pad - 20, w + pad * 2, h + pad * 2 + 40, 16); ctx.stroke();

      chip('POWER', x + w / 2, y - 12, 10);

      // Track.
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.fill();

      // Quarter marks, so a target power is something you can aim at.
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
      for (var q = 1; q <= 3; q++) {
        var qy = y + h * (q / 4);
        ctx.beginPath(); ctx.moveTo(x + 5, qy); ctx.lineTo(x + w - 5, qy); ctx.stroke();
      }

      var fh = h * S.power;
      ctx.fillStyle = S.power > 0.86 ? '#d9500a' : ORANGE;
      ctx.beginPath(); ctx.roundRect(x, y + h - fh, w, fh, 14); ctx.fill();

      // The level itself, drawn as a bright rule across the fill.
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - 3, y + h - fh); ctx.lineTo(x + w + 3, y + h - fh); ctx.stroke();

      chip(Math.round(S.power * 100) + '%', x + w / 2, y + h + 14, 12);
    }

    function angleBar() {
      var w = Math.min(W - 40, 320), h = 26, x = (W - w) / 2, y = H - 104;
      var pad = 9;

      ctx.fillStyle = 'rgba(14,11,9,0.72)';
      ctx.beginPath(); ctx.roundRect(x - pad, y - pad - 16, w + pad * 2, h + pad * 2 + 16, 16); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(x - pad, y - pad - 16, w + pad * 2, h + pad * 2 + 16, 16); ctx.stroke();

      // Track.
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.beginPath(); ctx.roundRect(x, y, w, h, 13); ctx.fill();

      // Centre mark: flat, the line most shots want.
      ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + w / 2, y + 3); ctx.lineTo(x + w / 2, y + h - 3); ctx.stroke();

      // Which end is the hyzer swaps with the hand. The bar stays spatial --
      // left on it is always a disc banked left -- but for a forehand that
      // bank is the ANHYZER, so labelling the left end "hyzer" for both hands
      // was telling the player the opposite of what they were doing.
      ctx.font = '700 9px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillText(S.hand === -1 ? 'ANHYZER' : 'HYZER', x + 2, y - 8);
      ctx.textAlign = 'center'; ctx.fillText('FLAT', x + w / 2, y - 8);
      ctx.textAlign = 'right'; ctx.fillText(S.hand === -1 ? 'HYZER' : 'ANHYZER', x + w - 2, y - 8);
      ctx.textAlign = 'left';

      // The marker, outlined so it reads against track, panel and artwork.
      var mx = x + w * ((S.angle + 1) / 2);
      ctx.fillStyle = ORANGE;
      ctx.beginPath(); ctx.roundRect(mx - 5, y - 5, 10, h + 10, 5); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(mx - 5, y - 5, 10, h + 10, 5); ctx.stroke();
    }

    // -------------------------------------------------------------- loop
    var last = performance.now();
    function frame(now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (S.phase === 'power') {
        S.power += S.dir * dt * 1.25;
        if (S.power >= 1) { S.power = 1; S.dir = -1; }
        if (S.power <= 0) { S.power = 0; S.dir = 1; }
      } else if (S.phase === 'angle') {
        S.angle += S.dir * dt * 1.9;
        if (S.angle >= 1) { S.angle = 1; S.dir = -1; }
        if (S.angle <= -1) { S.angle = -1; S.dir = 1; }
      } else if (S.phase === 'flight') {
        S.t += dt * 0.75;
        if (S.t >= 1) { S.t = 1; land(); }
      }
      draw(); requestAnimationFrame(frame);
    }

    // --------------------------------------------------------------- chrome
    function hud() {
      var where = document.getElementById('where');
      if (where) {
        where.textContent = ENTRY
          ? (ENTRY.daily
              ? 'Daily · ' + (ENTRY.of > 1 ? 'entry ' + ENTRY.attempt + ' of ' + ENTRY.of : 'your entry')
              : 'Tournament · entry ' + ENTRY.attempt + ' of ' + ENTRY.of)
          : (COURSE ? COURSE.name : 'Throw Lab · quick round');
      }
      document.getElementById('h-hole').textContent = S.hole;
      document.getElementById('h-par').textContent = S.par;
      document.getElementById('h-throws').textContent = S.throws;
      document.getElementById('h-dist').textContent =
        S.phase === 'holeEnd' ? 'IN'
          : Math.round(Math.sqrt(S.ballX * S.ballX + S.ballY * S.ballY));
      document.getElementById('h-total').textContent =
        S.total === 0 ? 'E' : (S.total > 0 ? '+' + S.total : S.total);
    }

    function say(big, sub) {
      document.getElementById('msg-big').textContent = big;
      document.getElementById('msg-sub').innerHTML = sub || '';
      // A coaching line that wraps to two lines is taller than one that
      // doesn't, so the field has to give that space back.
      setTimeout(resize, 0);
    }

    function paintBag() {
      // The picker and the disc row are different heights, so re-measure.
      setTimeout(resize, 0);
      document.getElementById('bag').innerHTML = DISCS.map(function (d) {
        return '<button class="g-disc" data-k="' + d.key + '" aria-pressed="' + (d.key === disc.key) + '">' +
               '<div class="g-disc__n">' + d.name + '</div>' +
               '<div class="g-disc__f">' + d.flight + '</div>' +
               '<div class="g-disc__d">' + d.max + ' ft</div></button>';
      }).join('');
    }

    document.getElementById('hand').addEventListener('click', function (e) {
      var b = e.target.closest('[data-hand]'); if (!b) return;
      S.hand = Number(b.dataset.hand) === -1 ? -1 : 1;
      paintHand();
    });
    function paintHand() {
      document.querySelectorAll('#hand [data-hand]').forEach(function (b) {
        b.setAttribute('aria-pressed', String(Number(b.dataset.hand) === S.hand));
      });
    }

    document.getElementById('bag').addEventListener('click', function (e) {
      var b = e.target.closest('.g-disc'); if (!b) return;
      if (S.phase !== 'ready' && S.phase !== 'result') return;   // no swapping mid-throw
      DISCS.forEach(function (d) { if (d.key === b.dataset.k) disc = d; });
      if (S.phase === 'result') S.phase = 'ready';
      paintBag();
    });

    // One tap target: the canvas. Pointer events cover touch and mouse both.
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); tap(); });
    window.addEventListener('resize', resize);

    // Length picker, shown before the first throw of a round.
    function askLength(lengths, sub, onPick) {
      var bag = document.getElementById('bag');
      // 'choose' is a phase of its own. Without it a tap on the field ran
      // straight into a throw, on a hole that had never been set up — which
      // is why the round started on an empty field at the default length.
      S.phase = 'choose';
      previewArt();       // show the hole you are about to play, not a blank field
      hud();
      var how = document.getElementById('how');
      if (how) how.hidden = false;
      bag.innerHTML = lengths.map(function (n) {
        return '<button class="g-disc" data-len="' + n + '"><div class="g-disc__n">' + n + '</div>' +
               '<div class="g-disc__f">holes</div></button>';
      }).join('');
      say('How many holes?', sub);
      setTimeout(resize, 0);
      bag.querySelectorAll('[data-len]').forEach(function (b) {
        b.addEventListener('click', function () { onPick(Number(this.dataset.len)); });
      });
    }

    // ?entry=<id> plays a tournament attempt; ?course=<id> a real course;
    // ?holes=<n> skips the picker.
    function boot() {
      var qs = new URLSearchParams(location.search);
      var entryId = qs.get('entry');
      var courseId = qs.get('course');
      var asked = parseInt(qs.get('holes'), 10);

      if (entryId) {
        if (qs.get('kind') === 'daily') TBASE = '/tournament/daily';
        return bootTournament(entryId);
      }

      if (!courseId) {
        if (QUICK_LENGTHS.indexOf(asked) !== -1) { HOLES = asked; newHole(); return; }
        askLength(QUICK_LENGTHS, 'A throwing game — no real course needed', function (n) {
          HOLES = n; newHole();
        });
        return;
      }

      say('Loading the course…', '');
      DGG.API.get('/courses/' + encodeURIComponent(courseId)).then(function (c) {
        COURSE = buildCourse(c);
        COURSE.id = Number(courseId);
        document.title = COURSE.name + ' · Disc Golf Go';
        var start = function (n) { HOLES = n; layoutCourse(n); newHole(); };
        if (COURSE_LENGTHS.indexOf(asked) !== -1) return start(asked);
        askLength(COURSE_LENGTHS, COURSE.name + ' — its real holes, played in the game', start);
      }).catch(function () {
        // Offline or a bad id — still give the player a round to throw.
        say('Could not load that course', 'Playing a quick round instead');
        HOLES = 3; newHole();
      });
    }

    // A tournament attempt: the course and the length are both settled before
    // this page opens, so there is nothing to choose — it goes straight to the
    // first tee. The entry was spent when the Play tab took it.
    function bootTournament(entryId) {
      var daily = TBASE !== '/tournament';
      say('Loading the ' + (daily ? 'daily' : 'tournament') + '…', '');
      DGG.API.get(TBASE).then(function (t) {
        var mine = (t.me && t.me.entries) || [];
        var entry = mine.filter(function (e) { return String(e.id) === String(entryId); })[0];
        if (!entry) throw new Error('That entry is not yours.');
        if (entry.status !== 'in_progress') {
          throw new Error(entry.status === 'completed'
            ? 'That entry already has a score.'
            : 'That entry was used up.');
        }
        ENTRY = { id: entry.id, attempt: entry.attempt, week: t.week_key,
                  daily: daily, of: t.max_entries || 2 };
        // The holes this tournament was created with. Older tournaments have
        // none, and those fall back to generating their own — which is what
        // the game did before layouts were stored.
        LAYOUT = Array.isArray(t.layout) && t.layout.length ? t.layout : null;
        if (!t.course || !t.course.id) {
          throw new Error(daily ? 'Today has no course yet.' : 'This week has no course yet.');
        }
        return DGG.API.get('/courses/' + encodeURIComponent(t.course.id)).then(function (c) {
          COURSE = buildCourse(c);
          COURSE.id = Number(t.course.id);
          document.title = (daily ? 'Daily' : 'Tournament') + ' · ' + COURSE.name;
          HOLES = t.holes || 18;
          layoutCourse(HOLES);
          newHole();
        });
      }).catch(function (e) {
        say('Tournament unavailable', (e && e.message) || 'Could not load this week\'s round');
      });
    }

    // Stretch or trim the course's holes to the chosen length. A 9-hole course
    // played over 18 is two loops, which is exactly how it's played for real.
    function layoutCourse(n) {
      var src = COURSE.holes.slice();
      if (!src.length) return;
      var out = [];
      for (var i = 0; i < n; i++) out.push(src[i % src.length]);
      COURSE.holes = out;
    }

    resize(); paintHand(); primeArt(); boot(); requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
