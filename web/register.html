<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- App UI on discgolfgo.app. Not search content: these render as an empty
       shell to a crawler (the page is built client-side after an auth check),
       and the marketing story lives on discgolfgo.com. noindex rather than a
       robots.txt Disallow, because a disallowed page that is ALREADY indexed
       can never be re-crawled to discover it should be dropped. follow is kept
       so link equity still flows. -->
  <meta name="robots" content="noindex, follow" />
  <title>Create Account · Disc Golf Go</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="/styles/tokens.css?v=w10" />
  <link rel="stylesheet" href="/styles/app.css?v=w10" />
  <link rel="stylesheet" href="/styles/app-ui.css?v=w15" />
</head>
<body>
  <main class="app">
    <div class="auth">
      <h1 class="h-display">NEW<br />PLAYER<span class="mark" style="width:46%"></span></h1>
      <p class="caption" style="margin:16px 0 32px">Season 02 · 1,500+ courses</p>

      <div class="error" id="err"></div>

      <form id="form" autocomplete="on">
        <!-- One name. Signup used to ask for a display name AND a username
             before anyone had seen the app, which is two decisions at the point
             of highest drop-off for a distinction the app no longer makes. -->
        <label class="field">
          <span class="field__label">Username</span>
          <input class="input" name="username" required pattern="[a-zA-Z0-9_]{3,20}" placeholder="skyhyzer" autocapitalize="none" />
        </label>
        <label class="field">
          <span class="field__label">Email</span>
          <input class="input" type="email" name="email" inputmode="email" autocomplete="email" required placeholder="you@email.com" />
        </label>
        <label class="field">
          <span class="field__label">Password · 8+ characters</span>
          <input class="input" type="password" name="password" autocomplete="new-password" required minlength="8" placeholder="••••••••" />
        </label>
        <!-- Honeypot. Not display:none, which some bots detect and skip: it is
             moved off-screen, taken out of the tab order and hidden from
             assistive tech, so a person can neither see nor reach it while a
             crawler that fills every input still does. The server rejects any
             signup where it arrives non-empty. -->
        <div aria-hidden="true" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden">
          <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
        </div>
        <button class="btn btn--block" type="submit" id="submit">Create Account</button>
      </form>

      <p class="formnote">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>

  <script src="/js/app.js?v=w11"></script>
  <script>
    (function () {
      // Already signed in — a returning player, or one who reached this page by
      // a stale link. Confirm the token still works before sending them in; if
      // it doesn't, the API client clears it and this form is what they need.
      if (DGG.signedIn()) {
        DGG.API.get('/players/me')
          .then(function () { location.replace('/home'); })
          .catch(function () { /* stale or offline — show the form */ });
      }

      var form = document.getElementById('form');
      var err = document.getElementById('err');
      var submit = document.getElementById('submit');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        err.textContent = '';
        submit.disabled = true;
        submit.textContent = 'Creating…';
        try {
          var fd = new FormData(form);
          var body = {
            // The username is the name; the server stores it as the display
            // name too, so the boards keep reading one column.
            display_name: fd.get('username'),
            username: fd.get('username'),
            email: fd.get('email'),
            password: fd.get('password'),
            website: fd.get('website'),   // honeypot; empty for a real person
          };
          var ref = new URLSearchParams(location.search).get('ref');
          if (ref) body.referral_code = ref;
          var res = await DGG.API.post('/auth/signup', body);
          DGG.API.setToken(res.token);
          if (ref) { try { await DGG.API.post('/referrals/claim', { code: ref }); } catch (e2) {} }
          location.replace('/onboard');
        } catch (ex) {
          err.textContent = ex.message || 'Could not create account';
          submit.disabled = false;
          submit.textContent = 'Create Account';
        }
      });
    })();
  </script>
</body>
</html>
