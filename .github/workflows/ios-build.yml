name: Build iOS IPA & Upload to TestFlight

on:
  # Trigger manually from GitHub Actions tab
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight after build'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  # Also run on pushes to main when iOS-relevant files change
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'public/**'
      - 'package.json'
      - 'ios/**'

jobs:
  build-ios:
    name: Build iOS App & Upload to TestFlight
    runs-on: macos-latest  # Apple Silicon runner — Xcode 16 pre-installed

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install --include=dev

      # ── 3. Capacitor iOS platform ─────────────────────────────────────────
      - name: Initialize or sync iOS platform
        run: |
          if [ ! -d "ios" ]; then
            echo "iOS directory not found — running 'cap add ios'"
            npx cap add ios
          else
            echo "iOS directory exists — syncing"
          fi
          npx cap sync ios

      - name: Patch Info.plist with location permissions
        run: |
          chmod +x scripts/patch-ios-info-plist.sh
          bash scripts/patch-ios-info-plist.sh

      # ── 4. Code signing — decode secrets ─────────────────────────────────
      - name: Decode Distribution Certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > /tmp/distribution.p12

      - name: Decode Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision

      - name: Import Certificate into Keychain
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import the distribution certificate
          security import /tmp/distribution.p12 \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          # Allow codesign to access without password prompt
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Prevent keychain lock during build
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # Get the UUID from the profile and name the file accordingly
          PROFILE_UUID=$(security cms -D -i /tmp/profile.mobileprovision 2>/dev/null | \
            plutil -extract UUID raw - 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Print :UUID' \
            /dev/stdin <<< "$(security cms -D -i /tmp/profile.mobileprovision)")
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "Installed profile UUID: $PROFILE_UUID"

      # ── 5. Write App Store Connect API key ───────────────────────────────
      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > \
            ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      # ── 6. Write ExportOptions.plist ─────────────────────────────────────
      - name: Write ExportOptions.plist
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>the.discgolfgo.app</key>
              <string>${{ env.PROFILE_UUID }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      # ── 7. Build Xcode archive ────────────────────────────────────────────
      - name: Configure App target signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
        run: |
          gem install xcodeproj
          ruby << 'RUBYEOF'
          require "xcodeproj"
          proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
          proj.targets.each do |t|
            next unless t.name == "App"
            t.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_STYLE"] = "Manual"
              c.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              c.build_settings["DEVELOPMENT_TEAM"] = ENV["TEAM_ID"]
              c.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_UUID"]
            end
          end
          proj.save
          puts "App target signing configured"
          RUBYEOF

      - name: Build Xcode Archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive

      # ── 8. Export IPA ─────────────────────────────────────────────────────
      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ \
          

      # ── 9. Upload to TestFlight ───────────────────────────────────────────
      - name: Upload to TestFlight via App Store Connect API
        if: ${{ github.event.inputs.upload_testflight != 'false' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$(find build/ -name '*.ipa' | head -1)" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose 2>&1 | tail -30 || \
          xcrun altool --upload-app \
            --type ios \
            --file "$(find build/ -name '*.ipa' | head -1)" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1

      # ── 10. Upload IPA as artifact (always) ──────────────────────────────
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disc-golf-go-ios-${{ github.run_number }}
          path: build/*.ipa
          retention-days: 30
          if-no-files-found: warn

      # ── 11. Upload archive as artifact (for debugging) ───────────────────
      - name: Upload dSYM for crash reporting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disc-golf-go-dsym-${{ github.run_number }}
          path: build/App.xcarchive/dSYMs/
          retention-days: 90
          if-no-files-found: warn

      # ── 12. Cleanup sensitive files ───────────────────────────────────────
      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f /tmp/distribution.p12 /tmp/profile.mobileprovision
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/.appstoreconnect

      # ── 13. Build summary ─────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## iOS Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **App:** Disc Golf Go" >> $GITHUB_STEP_SUMMARY
          echo "🆔 **Bundle ID:** \`the.discgolfgo.app\`" >> $GITHUB_STEP_SUMMARY
          echo "🏗️ **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.upload_testflight }}" != "false" ]; then
            echo "🚀 **TestFlight upload triggered** — check App Store Connect for processing status (usually 5–15 min)" >> $GITHUB_STEP_SUMMARY
          else
            echo "📦 **IPA artifact uploaded** — TestFlight upload skipped (toggle on next run)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [App Store Connect](https://appstoreconnect.apple.com)" >> $GITHUB_STEP_SUMMARY
