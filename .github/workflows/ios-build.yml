name: Build iOS IPA & Upload to TestFlight

on:
  # Trigger manually from GitHub Actions tab
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight after build'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  # Also run on pushes to main when iOS-relevant files change
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'ios/**'
      - 'resources/**'
      - 'scripts/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build iOS App & Upload to TestFlight
    runs-on: macos-latest  # Apple Silicon runner — Xcode 16 pre-installed

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        # npm ci gives a clean, symlink-correct node_modules (npm install left
        # stale committed .bin stubs in place and broke `npx cap`)
        run: npm ci --include=dev

      # ── 3. Capacitor iOS platform ─────────────────────────────────────────
      - name: Initialize or sync iOS platform
        run: |
          # Check for Xcode workspace (not just ios/ dir — icons may be pre-seeded)
          if [ ! -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Xcode project not found — running 'cap add ios'"
            npx cap add ios
          else
            echo "Xcode project exists — syncing"
          fi
          npx cap sync ios

      - name: Inject app icon into asset catalog
        run: |
          # Capacitor 6 + Xcode 16 uses modern single-size AppIcon format:
          # one 1024x1024 PNG (AppIcon-1024x1024.png) + Contents.json with
          # "idiom": "universal", "platform": "ios". Xcode auto-generates
          # all smaller sizes at build time.
          #
          # IMPORTANT: Do NOT use @2x suffix — Xcode interprets it as a
          # 512pt retina asset, causing a size mismatch with the 1024x1024
          # declaration in Contents.json.
          #
          # This runs after cap add/sync so our icon wins over any defaults.
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          ICON_SRC="resources/AppIcon.appiconset"

          # Wipe any default/stale icons Capacitor may have placed
          rm -rf "${ICON_DEST}"
          mkdir -p "${ICON_DEST}"

          echo "Copying app icon from ${ICON_SRC} → ${ICON_DEST}"
          cp -f "${ICON_SRC}/AppIcon-1024x1024.png" "${ICON_DEST}/"
          cp -f "${ICON_SRC}/Contents.json" "${ICON_DEST}/"
          echo "Icon installed (Xcode 16 single-size format):"
          ls -la "${ICON_DEST}/"

      - name: Generate branded iOS splash screen
        run: |
          # Generates splash-2732x2732.png + Contents.json into the Xcode
          # asset catalog (ios/App/App/Assets.xcassets/Splash.imageset/).
          # Overwrites Capacitor's default blank/placeholder splash with the
          # DGG logo centered on dark teal (#0d2b33).
          node scripts/generate-ios-splash.js
          echo "Splash installed:"
          ls -la ios/App/App/Assets.xcassets/Splash.imageset/

      - name: Patch LaunchScreen.storyboard background color
        run: |
          # Sets the storyboard root view background to dark teal (#0d2b33)
          # so non-square screens don't show white bars around the splash image.
          chmod +x scripts/patch-ios-launch-storyboard.sh
          bash scripts/patch-ios-launch-storyboard.sh

      - name: Patch Info.plist with privacy permissions
        run: |
          chmod +x scripts/patch-ios-info-plist.sh
          bash scripts/patch-ios-info-plist.sh

      # ── 4. Code signing — decode secrets ─────────────────────────────────
      - name: Decode Distribution Certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > /tmp/distribution.p12

      - name: Decode Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision

      - name: Import Certificate into Keychain
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import the distribution certificate
          security import /tmp/distribution.p12 \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          # Allow codesign to access without password prompt
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Prevent keychain lock during build
          security set-keychain-settings -t 3600 -u build.keychain

          # Detect the exact codesigning identity name from the imported cert
          # (may be "Apple Distribution" or the older "iPhone Distribution").
          SIGN_IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep -oE '"[^"]*Distribution[^"]*"' | head -1 | tr -d '"')
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> $GITHUB_ENV
          echo "Signing identity: $SIGN_IDENTITY"

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # Get the UUID from the profile and name the file accordingly
          PROFILE_UUID=$(security cms -D -i /tmp/profile.mobileprovision 2>/dev/null | \
            plutil -extract UUID raw - 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Print :UUID' \
            /dev/stdin <<< "$(security cms -D -i /tmp/profile.mobileprovision)")
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "Installed profile UUID: $PROFILE_UUID"
          # Extract the development team from the same profile — the Xcode
          # project has no DEVELOPMENT_TEAM baked in, so the build must be told.
          TEAM_ID=$(security cms -D -i /tmp/profile.mobileprovision 2>/dev/null | \
            plutil -extract TeamIdentifier.0 raw - 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' \
            /dev/stdin <<< "$(security cms -D -i /tmp/profile.mobileprovision)")
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "Development team: $TEAM_ID"

      # ── 5. Write App Store Connect API key ───────────────────────────────
      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > \
            ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      # ── 6. Write ExportOptions.plist ─────────────────────────────────────
      - name: Write ExportOptions.plist
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${{ env.SIGN_IDENTITY }}</string>
            <key>teamID</key>
            <string>${{ env.TEAM_ID }}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>the.discgolfgo.app</key>
              <string>${{ env.PROFILE_UUID }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      # ── 7a. Scope manual signing to the App target only ──────────────────
      # Passing signing settings on the xcodebuild CLI applies them to every
      # target, including the CocoaPods framework targets, which reject a
      # provisioning profile. Bake signing into the App target's build config
      # instead (Pods keep the no-signing settings from the Podfile hook).
      - name: Configure App target signing
        run: |
          python3 - <<'PY'
          import os, re
          p = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(p).read()
          team = os.environ["TEAM_ID"]; uuid = os.environ["PROFILE_UUID"]; ident = os.environ["SIGN_IDENTITY"]
          keys = ["CODE_SIGN_STYLE", "DEVELOPMENT_TEAM", "PROVISIONING_PROFILE_SPECIFIER", "PROVISIONING_PROFILE", "CODE_SIGN_IDENTITY"]
          def patch(m):
              b = m.group(0)
              for k in keys:
                  b = re.sub(r'\n\t+"?' + k + r'"?(\[[^\]]*\])?\s*=[^;]*;', '', b)
              inj = ('\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
                     f'\n\t\t\t\tDEVELOPMENT_TEAM = {team};'
                     f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{uuid}";'
                     f'\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "{ident}";')
              return b.replace('PRODUCT_BUNDLE_IDENTIFIER = the.discgolfgo.app;',
                               'PRODUCT_BUNDLE_IDENTIFIER = the.discgolfgo.app;' + inj, 1)
          s2 = re.sub(r'buildSettings = \{[^}]*?PRODUCT_BUNDLE_IDENTIFIER = the\.discgolfgo\.app;[^}]*?\};', patch, s)
          assert s2 != s, "no App target buildSettings block matched"
          open(p, "w").write(s2)
          print("Patched App target signing (team=%s profile=%s identity=%s)" % (team, uuid, ident))
          PY

      # ── 7b. Build Xcode archive ───────────────────────────────────────────
      - name: Build Xcode Archive
        run: |
          mkdir -p build   # tee target dir must exist before the pipe opens it
          xcodebuild -workspace ios/App/App.xcworkspace -list
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            -resultBundlePath build/archive.xcresult \
            -allowProvisioningUpdates \
            archive 2>&1 | tee build/archive.log || {
              echo "═══ ARCHIVE FAILED — extracting issues from xcresult ═══"
              xcrun xcresulttool get --legacy --format json --path build/archive.xcresult 2>/dev/null \
                | python3 -c "import sys,json;d=json.load(sys.stdin);
          def walk(o):
            if isinstance(o,dict):
              if o.get('_type',{}).get('_name','').endswith('IssueSummary'):
                print('ISSUE:', o.get('issueType',{}).get('_value',''), '-', o.get('message',{}).get('_value',''))
              [walk(v) for v in o.values()]
            elif isinstance(o,list): [walk(v) for v in o]
          walk(d)" || true
              tail -n 80 build/archive.log
              exit 1
            }

      # ── 8. Export IPA ─────────────────────────────────────────────────────
      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ 2>&1 | tee build/export.log || {
              echo "═══ EXPORT FAILED — distribution logs ═══"
              find "$TMPDIR" -name "*.xcdistributionlogs" -maxdepth 2 2>/dev/null | while read d; do
                echo "--- $d ---"; find "$d" -name "*.log" -exec tail -n 40 {} \;
              done
              exit 1
            }
          echo "Exported:"; ls -la build/*.ipa

      # ── 9. Upload to TestFlight ───────────────────────────────────────────
      - name: Upload to TestFlight via App Store Connect API
        if: ${{ github.event.inputs.upload_testflight != 'false' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$(find build/ -name '*.ipa' | head -1)" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose 2>&1 | tail -30 || \
          xcrun altool --upload-app \
            --type ios \
            --file "$(find build/ -name '*.ipa' | head -1)" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1

      # ── 10. Upload IPA as artifact (always) ──────────────────────────────
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disc-golf-go-ios-${{ github.run_number }}
          path: build/*.ipa
          retention-days: 30
          if-no-files-found: warn

      # ── 11. Upload archive as artifact (for debugging) ───────────────────
      - name: Upload dSYM for crash reporting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disc-golf-go-dsym-${{ github.run_number }}
          path: build/App.xcarchive/dSYMs/
          retention-days: 90
          if-no-files-found: warn

      # ── 12. Cleanup sensitive files ───────────────────────────────────────
      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f /tmp/distribution.p12 /tmp/profile.mobileprovision
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/.appstoreconnect

      # ── 13. Build summary ─────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## iOS Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **App:** Disc Golf Go" >> $GITHUB_STEP_SUMMARY
          echo "🆔 **Bundle ID:** \`the.discgolfgo.app\`" >> $GITHUB_STEP_SUMMARY
          echo "🏗️ **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.upload_testflight }}" != "false" ]; then
            echo "🚀 **TestFlight upload triggered** — check App Store Connect for processing status (usually 5–15 min)" >> $GITHUB_STEP_SUMMARY
          else
            echo "📦 **IPA artifact uploaded** — TestFlight upload skipped (toggle on next run)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [App Store Connect](https://appstoreconnect.apple.com)" >> $GITHUB_STEP_SUMMARY
