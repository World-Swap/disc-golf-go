name: Build Android AAB

on:
  # Trigger manually from GitHub Actions tab
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Sign with release keystore (requires secrets to be set)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  # Also run on pushes to main (builds debug AAB for review)
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'public/**'
      - 'package.json'
      - 'android/**'
      - 'resources/**'
      - 'scripts/**'

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Initialize Android platform (first run)
        # Only adds the android folder if it doesn't exist yet
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found — running 'cap add android'"
            npx cap add android
          else
            echo "Android directory exists — syncing"
            npx cap sync android
          fi

      - name: Generate icons and splash screens via @capacitor/assets
        # Official Capacitor asset pipeline — generates all icons, adaptive icons, and
        # splash screens from source images in resources/. Survives cap sync because
        # assets are placed in the correct Capacitor resource locations.
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0d2b33' --splashBackgroundColor '#0d2b33'

      - name: Write Android splash theme (styles.xml)
        # cap sync overwrites styles.xml with defaults — this restores the branded
        # splash theme (Theme.SplashScreen + dark teal bg + foreground icon).
        run: node scripts/write-android-styles.js

      - name: Verify splash and icon assets exist
        run: |
          echo "Checking splash assets..."
          SPLASH_COUNT=$(ls android/app/src/main/res/drawable*/splash.png 2>/dev/null | wc -l)
          echo "Found $SPLASH_COUNT splash files"
          if [ "$SPLASH_COUNT" -lt 10 ]; then
            echo "ERROR: Expected at least 10 splash files, found $SPLASH_COUNT"
            exit 1
          fi
          echo "Checking icon foreground assets..."
          ls android/app/src/main/res/mipmap-*/ic_launcher_foreground.png
          echo "Checking icon launcher assets..."
          ls android/app/src/main/res/mipmap-*/ic_launcher.png
          echo "Checking styles.xml has splash theme..."
          grep -q "Theme.SplashScreen" android/app/src/main/res/values/styles.xml
          echo "All assets and theme verified ✓"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Release signing (optional) ─────────────────────────────────────
      # To enable, add these secrets in GitHub → Settings → Secrets:
      #   ANDROID_KEYSTORE_BASE64  — base64 of your .jks file
      #   ANDROID_KEY_ALIAS        — key alias
      #   ANDROID_KEY_PASSWORD     — key password
      #   ANDROID_STORE_PASSWORD   — store password
      - name: Decode release keystore
        if: ${{ github.event.inputs.sign_release == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "RELEASE_KEYSTORE_EXISTS=true" >> $GITHUB_ENV
          else
            echo "RELEASE_KEYSTORE_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Build Release AAB (signed)
        if: ${{ env.RELEASE_KEYSTORE_EXISTS == 'true' }}
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../android/app/release.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build Debug AAB (unsigned — for testing)
        if: ${{ env.RELEASE_KEYSTORE_EXISTS != 'true' }}
        run: |
          cd android
          ./gradlew bundleDebug

      - name: Upload signed Release AAB
        if: ${{ env.RELEASE_KEYSTORE_EXISTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: disc-golf-go-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Debug AAB
        if: ${{ env.RELEASE_KEYSTORE_EXISTS != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: disc-golf-go-debug-${{ github.run_number }}
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 7

      - name: Build summary
        run: |
          echo "## Android Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$RELEASE_KEYSTORE_EXISTS" == "true" ]; then
            echo "📦 **Release AAB** — ready for Google Play upload" >> $GITHUB_STEP_SUMMARY
          else
            echo "📦 **Debug AAB** — for internal testing only" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To build a signed release AAB for Play Store, add these GitHub Secrets:" >> $GITHUB_STEP_SUMMARY
            echo "- \`ANDROID_KEYSTORE_BASE64\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`ANDROID_KEY_ALIAS\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`ANDROID_KEY_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`ANDROID_STORE_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "App ID: \`the.discgolfgo.app\`" >> $GITHUB_STEP_SUMMARY
          echo "WebView URL: \`https://discgolfgo.app\`" >> $GITHUB_STEP_SUMMARY
