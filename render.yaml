services:
  - type: web
    runtime: node
    name: app
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
    # Scheduled jobs (daily challenge + training notifications) run in-process
    # via the app's scheduler (src/lib/scheduler.ts), not as separate services.
