    <style>        body { padding-top: var(--safe-t); }

        /* ── Page layout ──────────────────────────────────────────────── */
        .page-wrap {
            max-width: 640px; margin: 0 auto;
            padding: 1.25rem 1rem calc(var(--tab-h) + var(--safe-b) + 1.5rem);
        }

        /* ── Page header ──────────────────────────────────────────────── */
        .page-header { margin-bottom: 1.25rem; }
        .page-title { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.2rem; }
        .page-sub { color: var(--text3); font-size: 0.9rem; }

        /* ── Category tabs (scrollable) ───────────────────────────────── */
        .tab-outer {
            margin-bottom: 1.25rem; position: relative;
        }
        .tab-outer::after {
            content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 32px;
            background: linear-gradient(to right, transparent, var(--bg));
            pointer-events: none;
        }
        .tabs {
            display: flex; gap: 0.35rem;

            overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex-shrink: 0; padding: 0.5rem 0.8rem; border-radius: 9px;
            border: none; background: transparent;
            color: var(--text3); font-size: 0.8rem; font-weight: 600;
            cursor: pointer; transition: all 0.18s; white-space: nowrap;
        }
        .tab:hover { color: var(--text2); }
        .tab.active {
            background: var(--surface);
            color: var(--green);
            box-shadow: var(--shadow-card);
        }

        /* ── Category banner ──────────────────────────────────────────── */
        .cat-banner {
            display: flex; align-items: center; gap: 0.75rem;

        }
        .cat-icon { font-size: 1.25rem; flex-shrink: 0; }
        .cat-title { font-size: 0.92rem; font-weight: 700; margin-bottom: 0.1rem; }
        .cat-desc { font-size: 0.77rem; color: var(--text3); }

        /* ── Podium ───────────────────────────────────────────────────── */
        .podium-section { margin-bottom: 1.5rem; }
        .podium {
            display: flex; gap: 0.65rem; align-items: flex-end; justify-content: center;
        }
        .podium-slot {
            flex: 1; max-width: 180px; text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px; padding: 1.1rem 0.6rem 1rem;
            position: relative; overflow: hidden;
            box-shadow: var(--shadow-card);
        }
        .podium-slot.rank-1 {
            border-color: rgba(212,160,23,0.35);
            background: linear-gradient(160deg, var(--gold-bg), var(--surface));
            min-height: 175px;
        }
        .podium-slot.rank-2 {
            border-color: rgba(110,117,128,0.3);
            background: linear-gradient(160deg, var(--silver-bg), var(--surface));
            min-height: 150px;
        }
        .podium-slot.rank-3 {
            border-color: rgba(160,82,45,0.3);
            background: linear-gradient(160deg, var(--bronze-bg), var(--surface));
            min-height: 135px;
        }
        [data-theme="dark"] .podium-slot.rank-1 { border-color: rgba(251,191,36,0.28); }
        [data-theme="dark"] .podium-slot.rank-2 { border-color: rgba(156,163,175,0.22); }
        [data-theme="dark"] .podium-slot.rank-3 { border-color: rgba(205,124,47,0.22); }

        .podium-slot::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
        }
        .podium-slot.rank-1::before { background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .podium-slot.rank-2::before { background: linear-gradient(90deg, transparent, var(--silver), transparent); }
        .podium-slot.rank-3::before { background: linear-gradient(90deg, transparent, var(--bronze), transparent); }

        .podium-crown { font-size: 1.35rem; margin-bottom: 0.3rem; display: block; }

        .podium-avatar {
            width: 48px; height: 48px; border-radius: 50%;

            border-color: var(--gold);

            font-family: 'Space Mono', monospace;
            font-size: 1.1rem; font-weight: 700;

        .podium-stat-label { font-size: 0.62rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }

        /* ── Player list ──────────────────────────────────────────────── */
        .list-header {
            display: grid; grid-template-columns: 44px 1fr auto;

        .player-list { display: flex; flex-direction: column; gap: 0.4rem; }
        .player-row {

            gap: 0.65rem; align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.7rem 0.8rem;

<script>
// ── Dark mode toggle ──────────────────────────────────────────────────────────
(function() {
    var btn = document.getElementById('themeToggle');
    function update() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.textContent = dark ? '☀️' : '🌙';
    }
    update();
    btn.addEventListener('click', function() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('dggo_theme', next);
        update();
    });
})();
</script>

<script>
// ── Auth helpers ─────────────────────────────────────────────────────────────
function getAuthHeaders() {
    const token = localStorage.getItem('token') || localStorage.getItem('dggo_token');
    const h = {};
    if (token) { h['Authorization'] = 'Bearer ' + token; }
    else {
        const uuid = localStorage.getItem('dggo_player_uuid');
        if (uuid) h['X-Player-Id'] = uuid;
    }
    return h;
}

// ── Level helpers ─────────────────────────────────────────────────────────────
function getLevelTitle(lvl) {
    if (lvl < 5) return { icon: '🥏', title: 'Rookie' };
    if (lvl < 10) return { icon: '⛳', title: 'Amateur' };
    if (lvl < 15) return { icon: '🎯', title: 'Intermediate' };
    if (lvl < 25) return { icon: '🏅', title: 'Advanced' };
    if (lvl < 40) return { icon: '🥇', title: 'Pro' };
    if (lvl < 60) return { icon: '👑', title: 'Legend' };
    return { icon: '🐐', title: 'GOAT' };
}

function initials(name) {
    if (!name) return '?';
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || '?';
}

// ── Category metadata ─────────────────────────────────────────────────────────
const CAT_META = {
    overall:    { icon: '⭐', title: 'Overall XP',         desc: 'Total experience points earned across everything', unit: 'XP', fmt: n => Number(n).toLocaleString() },
    checkins:   { icon: '📍', title: 'Most Check-ins',     desc: 'Total course check-ins logged', unit: 'check-ins', fmt: n => n },
    rounds:     { icon: '🔄', title: 'Rounds Completed',   desc: 'Full rounds finished on the scorecard', unit: 'rounds', fmt: n => n },
    birdies:    { icon: '🐦', title: 'Most Birdies',       desc: 'Holes finished one stroke under par', unit: 'birdies', fmt: n => n },
    aces:       { icon: '🎯', title: 'Most Aces',          desc: 'Holes-in-one — the rarest shot in disc golf', unit: 'aces', fmt: n => n },
    challenges: { icon: '⚔️', title: 'Quests Done',   desc: 'Daily, weekly, monthly and all-time quests completed', unit: 'done', fmt: n => n },
    battles:    { icon: '🥊', title: 'Battle Wins',        desc: 'Head-to-head PvP victories', unit: 'wins', fmt: n => n },
    courses:    { icon: '🗺️', title: 'Courses Explored',  desc: 'Unique disc golf courses visited', unit: 'courses', fmt: n => n },
    streak:     { icon: '🔥', title: 'Best Streak',        desc: 'Longest consecutive login streak ever achieved', unit: 'days', fmt: n => n },
};

// ── State ─────────────────────────────────────────────────────────────────────
let activeCategory = 'overall';
let cache = {};

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadCategory(cat) {
    if (cache[cat]) return cache[cat];
    const res = await fetch('/api/leaderboard?category=' + cat, { headers: getAuthHeaders() });
    if (!res.ok) throw new Error('Failed');
    const data = await res.json();
    cache[cat] = data;
    return data;
}

// ── Render ────────────────────────────────────────────────────────────────────
function avatarHTML(p, cls) {
    const me = cls || '';
    if (p.profile_photo_url) {
        return `<div class="row-avatar ${me}"><img src="${escHtml(p.profile_photo_url)}" alt=""></div>`;
    }
    return `<div class="row-avatar ${me}">${escHtml(initials(p.display_name))}</div>`;
}

function podiumAvatarHTML(p, isMe) {
    const ring = isMe ? ' podium-me-ring' : '';
    if (p.profile_photo_url) {
        return `<div class="podium-avatar${ring}"><img src="${escHtml(p.profile_photo_url)}" alt=""></div>`;
    }
    return `<div class="podium-avatar${ring}">${escHtml(initials(p.display_name))}</div>`;
}

function escHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderPodium(players, meta) {
    const top3 = players.filter(p => p.rank <= 3 && !p.out_of_top).slice(0, 3);
    if (top3.length < 2) return ''; // not enough for podium

    // Reorder: 2, 1, 3
    const order = [top3[1], top3[0], top3[2]].filter(Boolean);
    const crowns = ['🥈', '🥇', '🥉'];
    const rankClasses = ['rank-2', 'rank-1', 'rank-3'];

    const slots = order.map((p, i) => {
        const rankClass = rankClasses[i];
        const crown = crowns[i];
        const lt = getLevelTitle(p.level || 1);
        const statFmt = meta.fmt(p.stat_value);
        return `
            <div class="podium-slot ${rankClass}">
                <span class="podium-crown">${crown}</span>
                ${podiumAvatarHTML(p, p.is_me)}
                <div class="podium-name">${escHtml(p.display_name)}${p.is_me ? ' 👈' : ''}</div>
                <div class="podium-level">${escHtml(lt.icon)} Lv.${p.level || 1}</div>
                <div class="podium-stat">${statFmt}</div>
                <div class="podium-stat-label">${meta.unit}</div>
            </div>`;
    });

    return `<div class="podium-section"><div class="podium">${slots.join('')}</div></div>`;
}

function renderList(players, meta) {
    if (!players || players.length === 0) {
        return `<div class="empty-state"><span class="empty-icon">🥏</span><div>No players yet in this category.</div><div class="empty-sub">Be the first! Go play some disc golf.</div></div>`;
    }

    const top100 = players.filter(p => !p.out_of_top);
    const myRow  = players.find(p => p.out_of_top);

    const rankMedal = r => {
        if (r === 1) return `<span class="rank-medal">🥇</span>`;
        if (r === 2) return `<span class="rank-medal">🥈</span>`;
        if (r === 3) return `<span class="rank-medal">🥉</span>`;
        return `<span>#${r}</span>`;
    };

    const rankRowClass = r => {
        if (r === 1) return ' rank-gold';
        if (r === 2) return ' rank-silver';
        if (r === 3) return ' rank-bronze';
        return '';
    };

    const renderRow = p => {
        const lt = getLevelTitle(p.level || 1);
        const meClass = p.is_me ? ' is-me' : '';
        const otClass = p.out_of_top ? ' out-of-top' : '';
        const avMe = p.is_me ? 'me-ring' : '';
        const statFmt = meta.fmt(p.stat_value);

        return `
            <div class="player-row${meClass}${otClass}${rankRowClass(p.rank)}">
                <div class="rank-cell">${rankMedal(p.rank)}</div>
                <div class="player-info">
                    ${avatarHTML(p, avMe)}
                    <div class="player-text">
                        <div class="player-name-row">
                            ${escHtml(p.display_name)}
                            ${p.is_me ? '<span class="you-chip">You</span>' : ''}
                        </div>
                        <div class="player-meta">
                            <span class="level-pill">${escHtml(lt.icon)} Lv.${p.level || 1} ${escHtml(lt.title)}</span>
                            ${p.username ? ' &nbsp;<span style="color:var(--text3);">@' + escHtml(p.username) + '</span>' : ''}
                        </div>
                    </div>
                </div>
                <div class="stat-cell">${statFmt}<span class="stat-unit">${meta.unit}</span></div>
            </div>`;
    };

    // Split top 10 and the rest
    const first10 = top100.filter(p => p.rank <= 10);
    const rest    = top100.filter(p => p.rank > 10);

    let html = `<div class="list-header"><div>Rank</div><div>Player</div><div>Stat</div></div>`;
    html += `<div class="player-list">`;
    html += first10.map(renderRow).join('');
    if (rest.length > 0) {
        html += `<div class="top10-divider">Positions 11+</div>`;
        html += rest.map(renderRow).join('');
    }
    if (myRow) {
        html += renderRow(myRow);
    }
    html += `</div>`;
    return html;
}

async function render(cat) {
    const content = document.getElementById('lb-content');
    content.style.display = 'block';

    let data;
    try {
        data = await loadCategory(cat);
    } catch {
        loading.style.display = 'none';
        content.style.display = 'block';
        content.innerHTML = `<div class="empty-state"><span class="empty-icon">⚠️</span><div>Failed to load leaderboard. Try refreshing.</div></div>`;
        return;
    }

    const meta = CAT_META[cat] || CAT_META.overall;
    const players = data.players || [];

    loading.style.display = 'none';
    content.style.display = 'block';

    let html = `
        <div class="cat-banner">
            <span class="cat-icon">${meta.icon}</span>
            <div>
                <div class="cat-title">${meta.title}</div>
                <div class="cat-desc">${meta.desc}</div>
            </div>
        </div>`;

    html += renderPodium(players, meta);
    html += renderList(players, meta);

    content.innerHTML = html;
}

// ── Tab switching ─────────────────────────────────────────────────────────────
document.getElementById('tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCategory = tab.dataset.cat;
    render(activeCategory);
});

// ── Boot ──────────────────────────────────────────────────────────────────────
render(activeCategory).then(() => {
    // If arriving from "See where you stand" link, scroll to the current user's row
    if (new URLSearchParams(window.location.search).get('highlight') === 'me') {
        requestAnimationFrame(() => {
            var meRow = document.querySelector('.player-row.is-me, .player-row.out-of-top');
            if (meRow) {
                meRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                meRow.style.outline = '2px solid var(--green)';
                meRow.style.outlineOffset = '2px';
                setTimeout(function() { meRow.style.outline = ''; meRow.style.outlineOffset = ''; }, 2000);
            }
        });
    }
});
</script>
<!-- In-app notification popup -->
<div id="notifPopupOverlay" style="display:none;position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;"></div>
<div id="notifPopup" style="display:none;position:fixed;z-index:9991;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;max-width:420px;padding:20px;background:var(--surface,#232320);border:1px solid var(--border2,rgba(255,255,255,0.12));border-radius:18px;box-shadow:0 8px 40px rgba(0,0,0,0.45);font-family:'Space Grotesk',system-ui,sans-serif;color:var(--text,#f0efe9);">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;">
    <div style="width:36px;height:36px;flex-shrink:0;background:var(--green-glow,rgba(76,223,60,0.18));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;">📣</div>
    <div style="flex:1;min-width:0;">
      <div id="notifPopupTitle" style="font-weight:700;font-size:1rem;line-height:1.3;margin-bottom:4px;"></div>
      <div id="notifPopupMsg" style="font-size:0.875rem;color:var(--text2,#c4c4bc);line-height:1.5;white-space:pre-wrap;word-break:break-word;"></div>
    </div>
    <button id="notifPopupClose" style="flex-shrink:0;background:var(--surface2,#2a2a27);border:1px solid var(--border,rgba(255,255,255,0.07));border-radius:50%;width:30px;height:30px;font-size:1rem;cursor:pointer;color:var(--text3,#78787a);display:flex;align-items:center;justify-content:center;line-height:1;" aria-label="Dismiss">✕</button>
  </div>
  <button id="notifPopupDismissBtn" style="width:100%;margin-top:8px;background:var(--green,#7ed957);color:#fff;border:none;border-radius:10px;padding:11px;font-size:0.875rem;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;">Got it</button>
</div>
<script>
(function(){
  var token = localStorage.getItem('dggo_token');
  var uuid  = localStorage.getItem('dggo_player_uuid');
  if (!token && !uuid) return; // not logged in
  var headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  else headers['X-Player-Id'] = uuid;
  var currentNotifId = null;
  function dismiss() {
    document.getElementById('notifPopup').style.display='none';
    document.getElementById('notifPopupOverlay').style.display='none';
    if (!currentNotifId) return;
    fetch('/api/notifications/' + currentNotifId + '/dismiss', { method:'POST', headers:headers }).catch(function(){});
  }
  document.getElementById('notifPopupClose').addEventListener('click', dismiss);
  document.getElementById('notifPopupDismissBtn').addEventListener('click', dismiss);
  document.getElementById('notifPopupOverlay').addEventListener('click', dismiss);
  fetch('/api/notifications/active', { headers: headers })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.notification) return;
      currentNotifId = d.notification.id;
      document.getElementById('notifPopupTitle').textContent = d.notification.title;
      document.getElementById('notifPopupMsg').textContent = d.notification.message;
      document.getElementById('notifPopup').style.display = 'block';
      document.getElementById('notifPopupOverlay').style.display = 'flex';
    })
    .catch(function(){});
})();
</script>

<script>
// Notification bell — fetches unread admin notifications, shows badge + dropdown
(function() {
    var token = localStorage.getItem('dggo_token');
    var bell = document.getElementById('notifBell');
    var badge = document.getElementById('notifBadge');
    var panel = document.getElementById('notifPanel');
    var list = document.getElementById('notifList');
    var closeBtn = document.getElementById('notifClose');
    if (!bell || !token) return;

    function fmtTime(iso) {
        var d = new Date(iso);
        var now = new Date();
        var diff = (now - d) / 1000;
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        return Math.floor(diff / 86400) + 'd ago';
    }

    function updateBadge(count) {
        if (!count) { badge.hidden = true; return; }
        badge.hidden = false;
        badge.classList.toggle('dot', count > 9);
        badge.textContent = count > 9 ? '' : String(count);
    }

    var notifs = [];
    function loadNotifs() {
        fetch('/api/notifications/all', { headers: { Authorization: 'Bearer ' + token } })
            .then(function(r) { return r.ok ? r.json() : { notifications: [] }; })
            .then(function(data) {
                notifs = data.notifications || [];
                updateBadge(notifs.length);
            })
            .catch(function() {});
    }

    function renderPanel() {
        if (!notifs.length) {
            list.innerHTML = '<div class="notif-empty"><span>&#x1F514;</span>No new notifications</div>';
            return;
        }
        list.innerHTML = notifs.map(function(n) {
            return '<div class="notif-item" data-id="' + n.id + '">' +
                '<div class="notif-item-title">' + n.title + '</div>' +
                '<div class="notif-item-body">' + n.message + '</div>' +
                '<div class="notif-item-time">' + fmtTime(n.created_at) + '</div>' +
                '</div>';
        }).join('');
        list.querySelectorAll('.notif-item').forEach(function(el) {
            el.addEventListener('click', function() {
                var id = el.getAttribute('data-id');
                el.classList.add('read');
                fetch('/api/notifications/' + id + '/dismiss', {
                    method: 'POST',
                    headers: { Authorization: 'Bearer ' + token }
                }).catch(function() {});
                notifs = notifs.filter(function(n) { return String(n.id) !== id; });
                updateBadge(notifs.length);
                setTimeout(function() {
                    el.remove();
                    if (!list.querySelectorAll('.notif-item').length) renderPanel();
                }, 350);
            });
        });
    }

    bell.addEventListener('click', function(e) {
        e.stopPropagation();
        var isOpen = panel.classList.contains('open');
        panel.classList.toggle('open', !isOpen);
        if (!isOpen) renderPanel();
    });
    if (closeBtn) closeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        panel.classList.remove('open');
    });
    document.addEventListener('click', function(e) {
        var wrap = document.getElementById('notifWrap');
        if (wrap && !wrap.contains(e.target)) panel.classList.remove('open');
    });

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadNotifs);
    } else {
        loadNotifs();
    }
})();
</script>
