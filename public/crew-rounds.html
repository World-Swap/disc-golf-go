<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Crew Rounds — Disc Golf Go</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FF6B1A">
    <meta name="application-name" content="Disc Golf Go">
    <meta name="apple-mobile-web-app-title" content="Disc Golf Go">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
    <script>(function(){var s=localStorage.getItem('dggo_theme');var p=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s?s==='dark'?'dark':'light':p?'dark':'light')})()</script>
    <style>
body { padding-bottom: 0; }        /* ── Header ── */
        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text2); font-size: 1.1rem; text-decoration: none; flex-shrink: 0;
        }
        .header-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; flex: 1; }

        main { padding: 1.25rem; max-width: 480px; margin: 0 auto; }

        /* ── Tab bar ── */
        .tab-bar {
            display: flex; border-bottom: 1px solid var(--border);
            margin-bottom: 1.25rem; gap: 0;
        }
        .tab-btn {
            flex: 1; padding: 0.6rem 0.5rem; font-size: 0.82rem; font-weight: 600;
            background: none; border: none; border-bottom: 2px solid transparent;
            color: var(--text3); cursor: pointer; transition: color var(--transition);
            font-family: inherit;
        }
        .tab-btn.active { color: var(--green); border-bottom-color: var(--green); }

        /* ── Cards ── */
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-card); box-shadow: var(--shadow-card);
            padding: 1rem 1.1rem; margin-bottom: 0.75rem;
        }

        /* ── Summary chips ── */
        .summary-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 0.55rem; margin-bottom: 1.25rem;
        }
        .stat-chip {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 0.65rem 0.6rem; text-align: center;
            box-shadow: var(--shadow-card);
        }
        .stat-chip-value { font-size: 1.1rem; font-weight: 700; }
        .stat-chip-label { font-size: 0.68rem; color: var(--text3); margin-top: 0.15rem; }

        /* ── Round row ── */
        .round-row {
            display: flex; align-items: center; gap: 0.85rem;
        }
        .round-score-badge {
            width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.95rem; font-weight: 700; font-family: 'Space Mono', monospace;
        }
        .score-under { background: rgba(255,107,26,0.15); color: var(--green); }
        .score-even  { background: rgba(59,130,246,0.12); color: var(--blue); }
        .score-over  { background: rgba(224,64,64,0.12);  color: var(--red); }
        .round-info { flex: 1; min-width: 0; }
        .round-player { font-size: 0.9rem; font-weight: 600; }
        .round-meta { font-size: 0.75rem; color: var(--text3); margin-top: 0.15rem; }
        .group-badge {
            font-size: 0.68rem; background: var(--green-glow); color: var(--green);
            padding: 0.15rem 0.45rem; border-radius: 6px; font-weight: 600;
            margin-left: 0.35rem;
        }
        .round-date { font-size: 0.72rem; color: var(--text3); text-align: right; flex-shrink: 0; }

        /* ── Member stat card ── */
        .member-stat-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; box-shadow: var(--shadow-card);
            padding: 0.85rem 1rem; margin-bottom: 0.65rem;
            cursor: pointer; transition: background var(--transition);
        }
        .member-stat-card:hover { background: var(--surface2); }
        .member-stat-top {
            display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.55rem;
        }
        .member-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--surface2); display: flex; align-items: center;
            justify-content: center; font-size: 1.2rem; flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .member-name { font-size: 0.92rem; font-weight: 600; }
        .member-role-chip {
            font-size: 0.68rem; padding: 0.15rem 0.45rem; border-radius: 6px;
            font-weight: 600; margin-left: 0.3rem;
        }
        .role-boss { background: rgba(224,165,0,0.15); color: var(--gold); }
        .role-captain { background: rgba(255,107,26,0.15); color: var(--green); }
        .role-member { background: var(--surface2); color: var(--text3); }
        .member-rounds-row {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
        }
        .member-mini-stat {
            font-size: 0.74rem; color: var(--text2);
            background: var(--surface2); border-radius: 8px;
            padding: 0.2rem 0.5rem;
        }
        .member-mini-stat strong { color: var(--text); }

        /* ── Player detail panel ── */
        .player-detail-panel {
            background: var(--surface2); border: 1px solid var(--border2);
            border-radius: 14px; padding: 1rem; margin-top: 0.5rem;
            display: none;
        }
        .player-detail-panel.open { display: block; }
        .detail-round-row {
            display: flex; align-items: center; gap: 0.65rem;
            padding: 0.5rem 0; border-bottom: 1px solid var(--border);
        }
        .detail-round-row:last-child { border-bottom: none; }
        .detail-score {
            font-size: 0.88rem; font-weight: 700; font-family: 'Space Mono', monospace;
            width: 40px; text-align: center;
        }
        .detail-info { flex: 1; min-width: 0; }
        .detail-course { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .detail-date { font-size: 0.72rem; color: var(--text3); }

        /* ── Section label ── */
        .section-label {
            font-size: 0.78rem; font-weight: 700; letter-spacing: 0.05em;
            color: var(--text3); text-transform: uppercase;
            margin: 1.1rem 0 0.6rem;
        }

        /* ── Empty / loading ── */
        .empty-state {
            text-align: center; padding: 2.5rem 1rem; color: var(--text3);
        }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .empty-state p { font-size: 0.9rem; }
        .loading-dots { text-align: center; padding: 2rem; color: var(--text3); font-size: 0.9rem; }

        /* ── Bottom nav ── */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: var(--bg2); border-top: 1px solid var(--border);
            display: flex; align-items: stretch;
            height: calc(var(--tab-h) + var(--safe-b));
            padding-bottom: var(--safe-b);
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 0.2rem; text-decoration: none;
            color: var(--text3); font-size: 0.6rem; font-weight: 600;
            padding: 0.4rem 0.2rem; transition: color var(--transition);
        }
        .nav-item.active { color: var(--green); }
        .nav-item .icon { font-size: 1.3rem; line-height: 1; }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: calc(var(--tab-h) + var(--safe-b) + 1rem); left: 50%;
            transform: translateX(-50%) translateY(20px); opacity: 0;
            background: var(--text); color: var(--bg2); padding: 0.65rem 1.2rem;
            border-radius: 100px; font-size: 0.85rem; font-weight: 600;
            pointer-events: none; transition: all 0.28s cubic-bezier(0.4,0,0.2,1);
            white-space: nowrap; z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--red); color: #fff; }
    </style>
</head>
<body>
    <div class="top-header">
        <a href="/crew/me" class="back-btn">←</a>
        <div class="header-title" id="headerTitle">Crew Rounds</div>
    </div>

    <main id="mainContent">
        <div class="loading-dots">Loading…</div>
    </main>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
        <a href="/profile" class="nav-item"><span class="icon">👤</span>Profile</a>
        <a href="/checkin" class="nav-item"><span class="icon">📍</span>Check In</a>
        <a href="/scorecard" class="nav-item"><span class="icon">🥏</span>Play</a>
        <a href="/battles" class="nav-item"><span class="icon">⚔️</span>Battles</a>
        <a href="/challenges" class="nav-item"><span class="icon">🎯</span>Quests</a>
        <a href="/map" class="nav-item"><span class="icon">🗺️</span>Map</a>
        <a href="/crews" class="nav-item active"><span class="icon">👥</span>Crews</a>
    </nav>

    <div class="toast" id="toast"></div>

    <script>
        var TOKEN = localStorage.getItem('dggo_token');
        var authHeaders = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN };
        var crewId = null;
        var isBoss = false;
        var allRounds = [];
        var roundsCursor = null;
        var roundsHasMore = false;
        var analyticsData = null;
        var activeTab = 'rounds';
        var expandedPlayers = {};

        // ── Init ───────────────────────────────────────────────────────
        (function init() {
            if (!TOKEN) { window.location.href = '/login'; return; }
            var params = new URLSearchParams(window.location.search);
            crewId = params.get('crew_id');
            if (!crewId) { window.location.href = '/crews'; return; }
            loadCrewInfo();
        })();

        function loadCrewInfo() {
            fetch('/api/players/me/crew-check?crew_id=' + crewId, { headers: authHeaders })
                .catch(function() {})
                .then(function() { return fetch('/api/crews/' + crewId, { headers: authHeaders }); })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (!d.crew) { window.location.href = '/crews'; return; }
                    var crewName = d.crew.name;
                    document.title = crewName + ' Rounds — Disc Golf Go';
                    document.getElementById('headerTitle').textContent = crewName + ' Rounds';
                    // Check if user is boss
                    return fetch('/api/crews/' + crewId + '/members', { headers: authHeaders });
                })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    // Determine role
                    var myIdRes = fetch('/api/players/profile', { headers: authHeaders });
                    myIdRes.then(function(r) { return r.json(); })
                        .then(function(pd) {
                            var myId = pd.player && pd.player.id;
                            var me = (d.members || []).find(function(m) { return m.player_id === myId; });
                            isBoss = me && me.role === 'boss';
                            renderPage();
                        }).catch(function() { renderPage(); });
                })
                .catch(function() {
                    renderPage();
                });
        }

        function renderPage() {
            var html = '';
            // Tab bar — only show analytics tab to boss
            html += '<div class="tab-bar">';
            html += '<button class="tab-btn' + (activeTab === 'rounds' ? ' active' : '') + '" onclick="switchTab(\'rounds\')">📋 All Rounds</button>';
            if (isBoss) {
                html += '<button class="tab-btn' + (activeTab === 'analytics' ? ' active' : '') + '" onclick="switchTab(\'analytics\')">📊 Analytics</button>';
            }
            html += '</div>';
            html += '<div id="tabContent"></div>';
            document.getElementById('mainContent').innerHTML = html;

            if (activeTab === 'rounds') loadRounds();
            else if (activeTab === 'analytics') loadAnalytics();
        }

        function switchTab(tab) {
            activeTab = tab;
            var btns = document.querySelectorAll('.tab-btn');
            btns.forEach(function(b) {
                b.classList.toggle('active', b.textContent.includes(tab === 'rounds' ? 'Round' : 'Analytic'));
            });
            if (tab === 'rounds') loadRounds();
            else if (tab === 'analytics') loadAnalytics();
        }

        // ── Rounds tab ─────────────────────────────────────────────────
        function loadRounds() {
            document.getElementById('tabContent').innerHTML = '<div class="loading-dots">Loading rounds…</div>';
            var qs = '?limit=50' + (roundsCursor ? '&cursor=' + encodeURIComponent(roundsCursor) : '');
            fetch('/api/crews/' + crewId + '/rounds' + qs, { headers: authHeaders })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    var newRounds = d.rounds || [];
                    if (roundsCursor) {
                        // append to existing
                        allRounds = allRounds.concat(newRounds);
                    } else {
                        // first page
                        allRounds = newRounds;
                    }
                    roundsCursor = d.next_cursor || null;
                    roundsHasMore = d.next_cursor != null;
                    renderRounds();
                    updateRoundsLoadMore();
                })
                .catch(function() {
                    document.getElementById('tabContent').innerHTML = '<div class="empty-state"><div class="icon">🏳️</div><p>Could not load rounds</p></div>';
                });
        }

        function updateRoundsLoadMore() {
            var el = document.getElementById('roundsLoadMoreBtn');
            if (!el) return;
            el.style.display = roundsHasMore && roundsCursor ? '' : 'none';
        }

        function loadMoreRounds() {
            loadRounds();
        }
        window.loadMoreRounds = loadMoreRounds;

        function renderRounds() {
            var el = document.getElementById('tabContent');
            if (!allRounds.length) {
                el.innerHTML = '<div class="empty-state"><div class="icon">🥏</div><p>No rounds yet<br><small style="font-size:0.8rem;color:var(--text3);">Rounds played at your home course will appear here</small></p></div>';
                return;
            }

            // Group rounds by date
            var byDate = {};
            allRounds.forEach(function(r) {
                var d = r.date ? r.date.split('T')[0] : 'Unknown';
                if (!byDate[d]) byDate[d] = [];
                byDate[d].push(r);
            });

            var html = '';
            Object.keys(byDate).sort(function(a,b) { return b.localeCompare(a); }).forEach(function(dateKey) {
                html += '<div class="section-label">' + formatDateFull(dateKey) + '</div>';
                byDate[dateKey].forEach(function(r) {
                    var svp = parseInt(r.score_vs_par);
                    var scoreClass = svp < 0 ? 'score-under' : svp === 0 ? 'score-even' : 'score-over';
                    var scoreStr = svp === 0 ? 'E' : (svp > 0 ? '+' + svp : '' + svp);
                    html += '<div class="card" style="padding:0.75rem 1rem;">';
                    html += '<div class="round-row">';
                    html += '<div class="round-score-badge ' + scoreClass + '">' + escHtml(scoreStr) + '</div>';
                    html += '<div class="round-info">';
                    html += '<div class="round-player">' + escHtml(r.player_name || 'Player');
                    if (r.is_group) html += '<span class="group-badge">👥 Group</span>';
                    html += '</div>';
                    html += '<div class="round-meta">';
                    html += escHtml(r.course_name || 'Course') + ' · ' + (r.holes_count || 18) + ' holes';
                    html += '</div>';
                    html += '</div>';
                    html += '<div class="round-date">' + formatTime(r.date) + '</div>';
                    html += '</div>';
                    html += '</div>';
                });
            });
            html += '<div id="roundsLoadMoreContainer" style="text-align:center;padding:0.75rem 0;">' +
                '<button id="roundsLoadMoreBtn" onclick="loadMoreRounds()" style="display:none;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:10px 24px;font-size:0.8rem;font-weight:600;color:var(--text2);cursor:pointer;">Load more</button>' +
                '</div>';
            el.innerHTML = html;
            updateRoundsLoadMore();
        }

        // ── Analytics tab ──────────────────────────────────────────────
        function loadAnalytics() {
            document.getElementById('tabContent').innerHTML = '<div class="loading-dots">Loading analytics…</div>';
            fetch('/api/crews/' + crewId + '/analytics', { headers: authHeaders })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    analyticsData = d;
                    renderAnalytics(d);
                })
                .catch(function() {
                    document.getElementById('tabContent').innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>Could not load analytics</p></div>';
                });
        }

        function renderAnalytics(d) {
            var el = document.getElementById('tabContent');
            var summary = d.summary || {};
            var members = d.member_stats || [];

            var html = '';

            // Summary chips
            html += '<div class="summary-grid">';
            html += '<div class="stat-chip"><div class="stat-chip-value">' + (summary.total_rounds || 0) + '</div><div class="stat-chip-label">Total Rounds</div></div>';
            html += '<div class="stat-chip"><div class="stat-chip-value">' + (summary.active_players || 0) + '</div><div class="stat-chip-label">Active Players</div></div>';
            var bestScore = summary.crew_best_score_vs_par;
            var bestStr = bestScore != null ? (bestScore > 0 ? '+' + bestScore : bestScore === 0 ? 'E' : '' + bestScore) : '—';
            html += '<div class="stat-chip"><div class="stat-chip-value" style="color:var(--green)">' + escHtml(bestStr) + '</div><div class="stat-chip-label">Crew Best</div></div>';
            html += '</div>';

            if (!members.length) {
                html += '<div class="empty-state"><div class="icon">👥</div><p>No member data yet</p></div>';
                el.innerHTML = html;
                return;
            }

            html += '<div class="section-label">Member Performance</div>';
            members.forEach(function(m) {
                var avgStr = m.avg_score_vs_par != null ? (m.avg_score_vs_par > 0 ? '+' + m.avg_score_vs_par : m.avg_score_vs_par === 0 ? 'E' : '' + m.avg_score_vs_par) : '—';
                var bestStr2 = m.best_score_vs_par != null ? (m.best_score_vs_par > 0 ? '+' + m.best_score_vs_par : m.best_score_vs_par === 0 ? 'E' : '' + m.best_score_vs_par) : '—';
                var roleClass = m.role === 'boss' ? 'role-boss' : m.role === 'captain' ? 'role-captain' : 'role-member';
                var roleEmoji = m.role === 'boss' ? '👑' : m.role === 'captain' ? '⚡' : '';
                var lastActive = m.last_active ? 'Last: ' + formatDateShort(m.last_active) : 'No rounds';

                html += '<div class="member-stat-card" onclick="togglePlayerDetail(' + m.player_id + ')">';
                html += '<div class="member-stat-top">';
                html += '<div class="member-avatar">👤</div>';
                html += '<div style="flex:1;min-width:0;">';
                html += '<div class="member-name">' + escHtml(m.username);
                html += '<span class="member-role-chip ' + roleClass + '">' + roleEmoji + ' ' + escHtml(m.role) + '</span>';
                html += '</div>';
                html += '<div style="font-size:0.73rem;color:var(--text3);margin-top:0.15rem">' + lastActive + '</div>';
                html += '</div>';
                html += '<div style="font-size:0.75rem;color:var(--text3);text-align:right;flex-shrink:0">';
                html += 'Lv ' + (m.level || 1);
                html += '</div>';
                html += '</div>';
                html += '<div class="member-rounds-row">';
                html += '<div class="member-mini-stat"><strong>' + (m.rounds_at_home || 0) + '</strong> rounds</div>';
                html += '<div class="member-mini-stat">Avg <strong>' + avgStr + '</strong></div>';
                html += '<div class="member-mini-stat">Best <strong>' + bestStr2 + '</strong></div>';
                html += '</div>';
                html += '<div class="player-detail-panel" id="player-detail-' + m.player_id + '"></div>';
                html += '</div>';
            });

            el.innerHTML = html;
        }

        window.togglePlayerDetail = function(playerId) {
            var panel = document.getElementById('player-detail-' + playerId);
            if (!panel) return;
            if (expandedPlayers[playerId]) {
                panel.classList.remove('open');
                expandedPlayers[playerId] = false;
                return;
            }
            expandedPlayers[playerId] = true;
            panel.classList.add('open');
            panel.innerHTML = '<div style="text-align:center;padding:0.75rem;color:var(--text3);font-size:0.82rem">Loading…</div>';
            fetch('/api/crews/' + crewId + '/players/' + playerId + '/stats', { headers: authHeaders })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    var rounds = d.recent_rounds || [];
                    if (!rounds.length) {
                        panel.innerHTML = '<div style="text-align:center;padding:0.75rem;color:var(--text3);font-size:0.82rem">No rounds at home course</div>';
                        return;
                    }
                    var html = '<div style="font-size:0.72rem;font-weight:700;letter-spacing:0.04em;color:var(--text3);text-transform:uppercase;margin-bottom:0.5rem">Recent Rounds</div>';
                    rounds.forEach(function(r) {
                        var svp = parseInt(r.score_vs_par);
                        var scoreStr = svp === 0 ? 'E' : (svp > 0 ? '+' + svp : '' + svp);
                        var scoreColor = svp < 0 ? 'var(--green)' : svp === 0 ? 'var(--blue)' : 'var(--red)';
                        html += '<div class="detail-round-row">';
                        html += '<div class="detail-score" style="color:' + scoreColor + '">' + escHtml(scoreStr) + '</div>';
                        html += '<div class="detail-info">';
                        html += '<div class="detail-course">' + escHtml(r.course_name || 'Course');
                        if (r.is_group) html += ' <span style="font-size:0.68rem;color:var(--green)">👥</span>';
                        html += '</div>';
                        html += '<div class="detail-date">' + formatDateShort(r.completed_at) + ' · ' + (r.holes_count || 18) + ' holes</div>';
                        html += '</div>';
                        html += '</div>';
                    });
                    panel.innerHTML = html;
                })
                .catch(function() {
                    panel.innerHTML = '<div style="text-align:center;padding:0.75rem;color:var(--text3);font-size:0.82rem">Could not load</div>';
                });
        };

        // ── Utilities ──────────────────────────────────────────────────
        function escHtml(s) {
            if (!s && s !== 0) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function formatDateFull(dateStr) {
            if (!dateStr || dateStr === 'Unknown') return 'Unknown';
            try {
                var d = new Date(dateStr + 'T12:00:00');
                return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            } catch(e) { return dateStr; }
        }

        function formatDateShort(dateStr) {
            if (!dateStr) return '';
            try {
                var d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } catch(e) { return dateStr; }
        }

        function formatTime(dateStr) {
            if (!dateStr) return '';
            try {
                var d = new Date(dateStr);
                return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            } catch(e) { return ''; }
        }

        function toast(msg, isError) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast' + (isError ? ' error' : '') + ' show';
            clearTimeout(el._t);
            el._t = setTimeout(function() { el.className = 'toast'; }, 2800);
        }
    </script>
</body>
</html>
